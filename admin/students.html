<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수강생 관리 — 아이엠러닝 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<link rel="stylesheet" href="admin-common.css">
<style>
* { box-sizing:border-box; word-break:keep-all; }
body { margin:0; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#F4F6F8; color:#111; }
a { text-decoration:none; color:inherit; }
.admin-main { padding:2rem; }

/* 헤더 */
.page-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:1.5rem; flex-wrap:wrap; }
.page-title  { font-size:24px; font-weight:800; margin:0; }
.page-desc   { font-size:13px; color:#888; margin-top:4px; }

/* KPI 행 */
.kpi-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:1.25rem; }
.kpi-card { background:#fff; border-radius:14px; padding:18px 20px; border:1px solid rgba(0,0,0,.06); position:relative; overflow:hidden; }
.kpi-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--accent,#2D9B6F); }
.kpi-label { font-size:12px; color:#888; margin-bottom:8px; font-weight:600; }
.kpi-value { font-size:28px; font-weight:900; line-height:1; margin-bottom:6px; }
.kpi-delta  { font-size:12px; font-weight:600; color:#888; }
.kpi-delta.red { color:#EF4444; }

/* 카드 */
.card { background:#fff; border-radius:14px; border:1px solid rgba(0,0,0,.06); overflow:hidden; margin-bottom:1.25rem; }
.card-header { padding:16px 22px; border-bottom:1px solid rgba(0,0,0,.05); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.card-title  { font-size:14px; font-weight:700; }
.card-body   { padding:0; }

/* 검색 */
.search-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.search-input { padding:8px 12px; border:1.5px solid rgba(0,0,0,.1); border-radius:8px; font-size:13px; width:220px; outline:none; }
.search-input:focus { border-color:#2D9B6F; }
.filter-select { padding:8px 12px; border:1.5px solid rgba(0,0,0,.1); border-radius:8px; font-size:13px; cursor:pointer; }

/* 테이블 */
table { width:100%; border-collapse:collapse; font-size:13px; }
th { padding:10px 16px; text-align:left; font-size:11px; color:#888; background:#F8F9FA; white-space:nowrap; font-weight:600; }
td { padding:12px 16px; border-bottom:1px solid rgba(0,0,0,.04); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr.dormant-row td { background:#FFF5F5; }
tr.clickable-row { cursor:pointer; }
tr.clickable-row:hover td { background:#F0FAF5; }
tr.dormant-row:hover td { background:#FFE8E8; }

/* 배지 */
.badge { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
.badge-active   { background:#DCFCE7; color:#16A34A; }
.badge-dormant  { background:#FEE2E2; color:#DC2626; }
.badge-complete { background:#DBEAFE; color:#1D4ED8; }

/* 진행률 바 */
.prog-bar-wrap { background:#f0f0f0; border-radius:10px; height:6px; width:80px; overflow:hidden; display:inline-block; vertical-align:middle; }
.prog-bar-fill { background:linear-gradient(90deg,#2D9B6F,#5cbf8a); border-radius:10px; height:6px; transition:width .5s; }

/* 독려 버튼 */
.enc-btn { padding:5px 12px; border:1.5px solid #EF4444; background:#fff; color:#EF4444; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
.enc-btn:hover { background:#EF4444; color:#fff; }
/* 환불 버튼 */
.refund-btn { padding:5px 12px; border:1.5px solid #F59E0B; background:#fff; color:#D97706; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; margin-top:4px; }
.refund-btn:hover { background:#F59E0B; color:#fff; }
.refund-btn:disabled { opacity:.5; cursor:not-allowed; }

.empty   { text-align:center; padding:2.5rem; color:#aaa; font-size:13px; }
.loading { text-align:center; padding:2rem; color:#aaa; font-size:13px; }

/* 강좌 태그 */
.course-tag { display:inline-block; background:#F0FAF5; color:#2D9B6F; border:1px solid #d1f0e0;
  border-radius:6px; font-size:11px; font-weight:600; padding:2px 7px; margin:2px 2px 0 0; white-space:nowrap; }

/* 프로필 요약 카드 */
.profile-card { background:#F8FAFB; border:1px solid rgba(0,0,0,.07); border-radius:12px;
  padding:16px 18px; margin-bottom:18px; display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; }
.profile-card-item { display:flex; flex-direction:column; gap:2px; }
.profile-card-label { font-size:10px; color:#bbb; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.profile-card-value { font-size:13px; color:#111; font-weight:500; }
.pass-badge { display:inline-block; background:#fef9c3; color:#a16207; border:1px solid #fde047;
  border-radius:6px; font-size:11px; font-weight:700; padding:2px 8px; }

/* ── 상세 모달 ── */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:500; align-items:center; justify-content:center; padding:16px; }
.modal-bg.open { display:flex; }
.modal-box { background:#fff; border-radius:16px; width:min(700px,95vw); max-height:88vh; overflow:hidden; display:flex; flex-direction:column; }
.modal-head { padding:20px 24px 16px; border-bottom:1px solid rgba(0,0,0,.06); display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-shrink:0; }
.modal-name  { font-size:18px; font-weight:800; margin-bottom:2px; }
.modal-email { font-size:13px; color:#888; }
.modal-close { width:34px; height:34px; border-radius:50%; border:1.5px solid rgba(0,0,0,.1); background:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.modal-body  { padding:20px 24px; overflow-y:auto; flex:1; }
.modal-course-title { font-size:14px; font-weight:800; color:#111; margin:16px 0 10px; padding-bottom:6px; border-bottom:2px solid rgba(45,155,111,.15); }
.modal-course-title:first-child { margin-top:0; }

/* 강의 진도 카드 */
.lesson-card { padding:10px 14px; border:1px solid rgba(0,0,0,.06); border-radius:10px; margin-bottom:8px; }
.lesson-card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:8px; flex-wrap:wrap; }
.lesson-num   { font-size:12px; font-weight:700; color:#888; }
.lesson-title { font-size:13px; font-weight:600; color:#111; flex:1; }
.lesson-pct   { font-size:13px; font-weight:800; }
.lesson-detail { font-size:12px; color:#666; margin-bottom:6px; }
.lesson-bar-wrap { background:#f0f0f0; border-radius:10px; height:8px; overflow:hidden; }
.lesson-bar-fill { border-radius:10px; height:8px; transition:width .5s; }
.lesson-done-badge { font-size:11px; font-weight:700; color:#16A34A; margin-left:6px; }

@media(max-width:1023px) { .admin-main { padding:1rem; } .kpi-row { grid-template-columns:1fr 1fr; } .search-input { width:100%; } }
</style>
</head>
<body>

<div class="admin-main">
  <div class="page-header">
    <div>
      <h1 class="page-title">👥 수강생 관리</h1>
      <div class="page-desc">수강생 학습 현황을 한눈에 파악하고 관리해요</div>
    </div>
  </div>

  <!-- 학습 현황 KPI -->
  <div class="kpi-row">
    <div class="kpi-card" style="--accent:#2D9B6F;">
      <div class="kpi-label">오늘 학습한 수강생</div>
      <div class="kpi-value" id="ks-today">-</div>
      <div class="kpi-delta">오늘 기준</div>
    </div>
    <div class="kpi-card" style="--accent:#3B82F6;">
      <div class="kpi-label">총 수강생</div>
      <div class="kpi-value" id="ks-total">-</div>
      <div class="kpi-delta">수강 신청 수강생</div>
    </div>
    <div class="kpi-card" style="--accent:#EF4444;">
      <div class="kpi-label">휴면 수강생</div>
      <div class="kpi-value" id="ks-dormant">-</div>
      <div class="kpi-delta red">14일 이상 미접속</div>
    </div>
    <div class="kpi-card" style="--accent:#F59E0B;">
      <div class="kpi-label">수료 임박 수강생</div>
      <div class="kpi-value" id="ks-near">-</div>
      <div class="kpi-delta">진행률 80% 이상</div>
    </div>
  </div>

  <!-- 수강생 목록 -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">수강생 목록</span>
      <div class="search-bar">
        <input type="text" class="search-input" id="student-search" placeholder="이름 또는 이메일 검색..." oninput="renderTable()">
        <select class="filter-select" id="status-filter" onchange="renderTable()">
          <option value="">전체 상태</option>
          <option value="active">활성</option>
          <option value="dormant">휴면</option>
          <option value="complete">수료</option>
        </select>
      </div>
    </div>
    <div class="card-body">
      <div id="student-table-area"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>
</div>

<!-- 환불 처리 모달 -->
<div id="refund-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:2rem;max-width:420px;width:90%;">
    <!-- 1단계: 환불 정보 확인 -->
    <div id="refund-step1">
      <h3 style="margin:0 0 1rem;">환불 처리</h3>
      <p id="refund-modal-info" style="color:#555;font-size:14px;margin-bottom:1.5rem;line-height:1.6;"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="closeRefundModal()" style="padding:9px 18px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;">취소</button>
        <button id="refund-confirm-btn" style="padding:9px 18px;border-radius:8px;background:#EF4444;color:#fff;border:none;cursor:pointer;font-weight:700;">환불 처리</button>
      </div>
    </div>
    <!-- 2단계: 최종 확인 -->
    <div id="refund-step2" style="display:none;">
      <h3 style="margin:0 0 1rem;color:#DC2626;">⚠️ 최종 확인</h3>
      <div id="refund-step2-info" style="background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:1rem;font-size:14px;color:#7F1D1D;line-height:1.7;margin-bottom:1.5rem;"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="showRefundStep1()" style="padding:9px 18px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;">뒤로</button>
        <button id="refund-final-btn" style="padding:9px 18px;border-radius:8px;background:#DC2626;color:#fff;border:none;cursor:pointer;font-weight:700;">최종 확인 — 환불 처리</button>
      </div>
    </div>
  </div>
</div>

<!-- 수강생 상세 모달 -->
<div class="modal-bg" id="student-modal" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <div class="modal-name" id="modal-name">-</div>
        <div class="modal-email" id="modal-email">-</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="loading">불러오는 중...</div>
    </div>
  </div>
</div>

<script>
const sb = window.supabaseClient;

(async function checkAdminAccess() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = '../login.html?next=' + encodeURIComponent(location.pathname.split('/admin/')[1] ? 'admin/' + location.pathname.split('/admin/')[1] : 'admin/index.html');
    return;
  }
  const { data: profile } = await sb
    .from('profiles').select('role').eq('id', session.user.id).maybeSingle();
  if (!profile || profile.role !== 'admin') {
    alert('관리자 권한이 없는 계정입니다.');
    window.location.href = '../index.html';
    return;
  }
})();

// ── 전역 데이터 ──
var allProfiles   = [];
var allOrders     = [];
var allVideoProgress = [];
var allStudyLogs  = [];
var allCourses    = [];
var studentRows   = []; // 계산된 행 데이터
var currentUserId = null;

function fmtSecs(s) {
  s = Math.floor(s || 0);
  if (s < 60)   return s + '초';
  if (s < 3600) { var m = Math.floor(s/60); var r = s%60; return m + '분' + (r ? ' ' + r + '초' : ''); }
  return Math.floor(s/3600) + '시간 ' + (Math.floor((s%3600)/60) ? Math.floor((s%3600)/60) + '분' : '');
}

function fmtDate(dateStr) {
  if (!dateStr) return '-';
  var d = new Date(dateStr);
  return d.toLocaleDateString('ko-KR', { month:'short', day:'numeric' });
}

function daysSince(dateStr) {
  if (!dateStr) return 9999;
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}

// ── 수강생 행 계산 ──
function buildStudentRows() {
  var now = Date.now();
  var todayStart = new Date(); todayStart.setHours(0,0,0,0);

  // user_id별 orders 그룹
  var ordersByUser = {};
  allOrders.filter(function(o){ return o.status === 'paid'; }).forEach(function(o) {
    if (!ordersByUser[o.user_id]) ordersByUser[o.user_id] = [];
    ordersByUser[o.user_id].push(o);
  });

  // user_id별 video_progress 총 시청시간
  var watchByUser = {};
  allVideoProgress.forEach(function(vp) {
    watchByUser[vp.user_id] = (watchByUser[vp.user_id] || 0) + (vp.actual_watched_seconds || 0);
  });

  // user_id별 마지막 수강일 (study_logs 기준)
  var lastStudyByUser = {};
  allStudyLogs.forEach(function(sl) {
    if (!lastStudyByUser[sl.user_id] || new Date(sl.studied_at) > new Date(lastStudyByUser[sl.user_id])) {
      lastStudyByUser[sl.user_id] = sl.studied_at;
    }
  });

  // 수강생 집합 (최소 1개 이상 paid order인 유저)
  var enrolledUserIds = Object.keys(ordersByUser);

  studentRows = enrolledUserIds.map(function(uid) {
    var profile = allProfiles.find(function(p){ return p.id === uid; }) || {};
    var orders  = ordersByUser[uid] || [];
    // course_id=null인 프리패스 영수증 order 제외 (강좌 수·진도 집계에서)
    var courseOrders = orders.filter(function(o){ return o.course_id != null; });
    var courseCount = courseOrders.length;
    var avgProgress = courseCount ? Math.round(courseOrders.reduce(function(s,o){ return s+(o.progress||0); },0) / courseCount) : 0;
    var lastStudy   = lastStudyByUser[uid] || null;
    var totalWatch  = watchByUser[uid] || 0;
    var daysSinceLast = daysSince(lastStudy);

    var status;
    if (avgProgress >= 100) status = 'complete';
    else if (daysSinceLast > 14) status = 'dormant';
    else if (daysSinceLast <= 7) status = 'active';
    else status = 'active'; // 8-14일도 일단 active로

    return {
      uid:            uid,
      name:           profile.name || profile.email || uid.slice(0,8),
      email:          profile.email || '-',
      phone:          profile.phone || '',
      joinedAt:       profile.created_at || null,
      hasPass:        !!profile.has_unlimited_pass,
      courseCount:    courseCount,
      courseIds:      courseOrders.map(function(o){ return o.course_id; }),
      avgProgress:    avgProgress,
      lastStudy:      lastStudy,
      daysSinceLast:  daysSinceLast,
      totalWatch:     totalWatch,
      status:         status,
      isDormant:      daysSinceLast > 14,
    };
  });
}

// ── KPI 계산 ──
function renderKPI() {
  var todayStart = new Date(); todayStart.setHours(0,0,0,0);

  // 오늘 학습한 수강생
  var todayLearners = new Set(
    allStudyLogs.filter(function(sl){ return new Date(sl.studied_at) >= todayStart; })
      .map(function(sl){ return sl.user_id; })
  );
  document.getElementById('ks-today').textContent = todayLearners.size;

  // 총 수강생 (paid order 있는 유저)
  var enrolled = new Set(
    allOrders.filter(function(o){ return o.status==='paid'; }).map(function(o){ return o.user_id; })
  );
  document.getElementById('ks-total').textContent = enrolled.size;

  // 휴면 (14일 이상 미접속)
  var dormant = studentRows.filter(function(r){ return r.isDormant; }).length;
  document.getElementById('ks-dormant').textContent = dormant;

  // 수료 임박 (80% 이상)
  var near = studentRows.filter(function(r){ return r.avgProgress >= 80 && r.avgProgress < 100; }).length;
  document.getElementById('ks-near').textContent = near;
}

// ── 테이블 렌더 ──
function renderTable() {
  var q      = (document.getElementById('student-search').value || '').toLowerCase();
  var filter = document.getElementById('status-filter').value;

  var rows = studentRows.filter(function(r) {
    var matchQ = !q || r.name.toLowerCase().includes(q) || r.email.toLowerCase().includes(q);
    var matchF = !filter || r.status === filter;
    return matchQ && matchF;
  });

  var el = document.getElementById('student-table-area');
  if (!rows.length) {
    el.innerHTML = '<div class="empty">조건에 맞는 수강생이 없어요</div>';
    return;
  }

  var html = '<div class="table-wrap"><table><thead><tr>' +
    '<th>이름 / 이메일</th><th>수강 강좌</th><th>평균 진행률</th>' +
    '<th>마지막 수강일</th><th>총 시청시간</th><th>상태</th><th>권한</th><th>관리</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(r) {
    var badgeClass = r.status === 'complete' ? 'badge-complete' : r.status === 'dormant' ? 'badge-dormant' : 'badge-active';
    var badgeText  = r.status === 'complete' ? '수료' : r.status === 'dormant' ? '휴면' : '활성';
    var rowClass   = (r.isDormant ? 'dormant-row ' : '') + 'clickable-row';
    var lastTxt    = r.lastStudy ? fmtDate(r.lastStudy) + ' (' + r.daysSinceLast + '일 전)' : '미접속';
    var encBtn = r.isDormant ? '<button class="enc-btn" onclick="event.stopPropagation();encourage(\'' + r.uid + '\',\'' + r.name + '\')">독려 메시지</button>' : '';
    var userOrders = allOrders.filter(function(o){ return o.user_id === r.uid; });
    var refundableOrder = userOrders
      .filter(function(o){ return (!o.refund_status || o.refund_status === 'none') && o.status === 'paid' && (o.amount || 0) > 0; })
      .sort(function(a,b){ return (b.amount||0) - (a.amount||0); })[0];
    var refundBtn = refundableOrder
      ? '<button class="refund-btn" onclick="event.stopPropagation();showRefundModal(\'' + r.uid + '\',' + refundableOrder.course_id + ',' + refundableOrder.id + ',' + refundableOrder.amount + ')">환불처리</button>'
      : '';

    var profile = allProfiles.find(function(p){ return p.id === r.uid; }) || {};
    var isAdmin = profile.role === 'admin';
    var isSelf  = r.uid === currentUserId;
    var roleBadge = isAdmin
      ? '<span style="display:inline-block;padding:2px 8px;border-radius:12px;background:#fef3c7;color:#b45309;font-size:11px;font-weight:700;">관리자</span>'
      : '<span style="display:inline-block;padding:2px 8px;border-radius:12px;background:#f0f0f0;color:#888;font-size:11px;">일반</span>';
    var roleBtn;
    if (isSelf) {
      roleBtn = '<button style="font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #e0e0e0;background:#f8f8f8;color:#bbb;cursor:not-allowed;margin-top:4px;" disabled title="본인 권한은 변경할 수 없습니다">본인</button>';
    } else if (isAdmin) {
      roleBtn = '<button style="font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #fca5a5;background:#fff;color:#dc2626;cursor:pointer;margin-top:4px;" onclick="event.stopPropagation();setRole(\'' + r.uid + '\',\'admin\')">관리자 해제</button>';
    } else {
      roleBtn = '<button style="font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #2D9B6F;background:#fff;color:#2D9B6F;cursor:pointer;margin-top:4px;" onclick="event.stopPropagation();setRole(\'' + r.uid + '\',\'user\')">관리자 지정</button>';
    }

    // 수강 강좌 태그 (최대 2개 표시 후 나머지 개수)
    var courseTags = r.courseIds.map(function(cid) {
      var c = allCourses.find(function(x){ return String(x.id) === String(cid); });
      return c ? c.title : ('ID:' + cid);
    });
    var MAX_SHOW = 2;
    var shownTags = courseTags.slice(0, MAX_SHOW).map(function(t) {
      var short = t.length > 14 ? t.slice(0,14) + '…' : t;
      return '<span class="course-tag" title="' + t + '">' + short + '</span>';
    }).join('');
    if (courseTags.length > MAX_SHOW) shownTags += '<span class="course-tag" style="background:#f0f0f0;color:#888;border-color:#e0e0e0;">+' + (courseTags.length - MAX_SHOW) + '개</span>';

    // 첫 열: 이름 + 이메일 + 전화번호 + 가입일
    var phoneTxt  = r.phone ? '<div style="font-size:11px;color:#666;margin-top:1px;">📞 ' + r.phone + '</div>' : '';
    var joinedTxt = r.joinedAt ? '<div style="font-size:11px;color:#aaa;margin-top:1px;">가입 ' + fmtDate(r.joinedAt) + '</div>' : '';
    var passBadge = r.hasPass ? '<span style="font-size:10px;font-weight:700;color:#a16207;background:#fef9c3;border:1px solid #fde047;border-radius:5px;padding:1px 6px;margin-left:4px;">패스</span>' : '';

    html += '<tr class="' + rowClass + '" onclick="openModal(\'' + r.uid + '\')">' +
      '<td><div style="font-weight:600;">' + r.name + passBadge + '</div>' +
      '<div style="font-size:11px;color:#888;">' + r.email + '</div>' +
      phoneTxt + joinedTxt + '</td>' +
      '<td>' + (shownTags || '<span style="color:#ccc;font-size:12px;">-</span>') + '</td>' +
      '<td><div style="display:flex;align-items:center;gap:8px;">' +
        '<div class="prog-bar-wrap"><div class="prog-bar-fill" style="width:' + r.avgProgress + '%;"></div></div>' +
        '<span style="font-size:12px;font-weight:700;">' + r.avgProgress + '%</span>' +
      '</div></td>' +
      '<td style="font-size:12px;color:#666;">' + lastTxt + '</td>' +
      '<td style="font-size:12px;">' + fmtSecs(r.totalWatch) + '</td>' +
      '<td><span class="badge ' + badgeClass + '">' + badgeText + '</span></td>' +
      '<td style="white-space:nowrap;">' + roleBadge + '<br>' + roleBtn + '</td>' +
      '<td style="white-space:nowrap;">' + encBtn + (encBtn && refundBtn ? '<br>' : '') + refundBtn + '</td>' +
      '</tr>';
  });

  html += '</tbody></table></div>';
  el.innerHTML = html;
}

function encourage(uid, name) {
  alert('준비 중입니다.\n(' + name + ' 님에게 독려 메시지 발송)');
}

async function setRole(uid, currentRole) {
  var profile = allProfiles.find(function(p){ return p.id === uid; }) || {};
  var name = profile.name || profile.email || uid.slice(0,8);
  var newRole = currentRole === 'admin' ? 'user' : 'admin';
  var msg = newRole === 'admin'
    ? name + ' 님을 관리자로 지정합니다.'
    : name + ' 님의 관리자 권한을 해제합니다.';
  if (!confirm(msg)) return;
  try {
    var { error } = await sb.rpc('set_user_role', { p_user_id: uid, p_new_role: newRole });
    if (error) {
      var reason = error.message || '';
      if (reason.includes('last_admin')) {
        alert('마지막 관리자의 권한은 해제할 수 없습니다.');
      } else if (reason.includes('not_admin')) {
        alert('관리자만 권한을 변경할 수 있습니다.');
      } else {
        alert('오류: ' + reason);
      }
      return;
    }
    var p = allProfiles.find(function(p){ return p.id === uid; });
    if (p) p.role = newRole;
    renderTable();
    alert((newRole === 'admin' ? '관리자로 지정' : '관리자 해제') + '되었습니다.');
  } catch(e) {
    alert('오류가 발생했습니다: ' + e.message);
  }
}

// ── 상세 모달 ──
function openModal(uid) {
  var row = studentRows.find(function(r){ return r.uid === uid; });
  if (!row) return;

  document.getElementById('modal-name').textContent  = row.name;
  document.getElementById('modal-email').textContent = row.email;
  document.getElementById('student-modal').classList.add('open');
  document.body.style.overflow = 'hidden';

  renderModalBody(uid);
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('student-modal') && !e.target.classList.contains('modal-close')) return;
  document.getElementById('student-modal').classList.remove('open');
  document.body.style.overflow = '';
}

function renderModalBody(uid) {
  var body = document.getElementById('modal-body');
  var profile = allProfiles.find(function(p){ return p.id === uid; }) || {};

  // ── 프로필 요약 카드 ──
  var userOrders = allOrders.filter(function(o){ return o.user_id === uid && o.status === 'paid'; });
  var totalPaid  = userOrders.reduce(function(s,o){ return s + (o.amount||0); }, 0);
  var userVP     = allVideoProgress.filter(function(vp){ return vp.user_id === uid; });
  var totalSecs  = userVP.reduce(function(s,vp){ return s + (vp.actual_watched_seconds||0); }, 0);

  var passBadgeHtml = profile.has_unlimited_pass
    ? '<span class="pass-badge">✅ 무제한 패스 보유</span>'
    : '<span style="font-size:13px;color:#aaa;">없음</span>';

  var html = '<div class="profile-card">' +
    '<div class="profile-card-item"><div class="profile-card-label">이름</div><div class="profile-card-value">' + (profile.name || '-') + '</div></div>' +
    '<div class="profile-card-item"><div class="profile-card-label">이메일</div><div class="profile-card-value">' + (profile.email || '-') + '</div></div>' +
    '<div class="profile-card-item"><div class="profile-card-label">전화번호</div><div class="profile-card-value">' + (profile.phone || '-') + '</div></div>' +
    '<div class="profile-card-item"><div class="profile-card-label">가입일</div><div class="profile-card-value">' + (profile.created_at ? new Date(profile.created_at).toLocaleDateString('ko-KR') : '-') + '</div></div>' +
    '<div class="profile-card-item"><div class="profile-card-label">권한</div><div class="profile-card-value">' + (profile.role === 'admin' ? '관리자' : profile.role === 'super_admin' ? '슈퍼관리자' : '일반') + '</div></div>' +
    '<div class="profile-card-item"><div class="profile-card-label">무제한 패스</div><div class="profile-card-value">' + passBadgeHtml + '</div></div>' +
    '<div class="profile-card-item"><div class="profile-card-label">수강 강좌 수</div><div class="profile-card-value">' + userOrders.filter(function(o){ return o.course_id; }).length + '개</div></div>' +
    '<div class="profile-card-item"><div class="profile-card-label">총 결제금액</div><div class="profile-card-value">₩' + totalPaid.toLocaleString() + '</div></div>' +
    '<div class="profile-card-item"><div class="profile-card-label">총 시청시간</div><div class="profile-card-value">' + fmtSecs(totalSecs) + '</div></div>' +
    '<div class="profile-card-item"><div class="profile-card-label">UUID</div><div class="profile-card-value" style="font-size:11px;color:#bbb;word-break:break-all;">' + uid + '</div></div>' +
    '</div>';

  if (!userOrders.length) {
    body.innerHTML = html + '<div class="empty">수강 중인 강좌가 없어요</div>';
    return;
  }

  userOrders.forEach(function(order) {
    var course = allCourses.find(function(c){ return String(c.id) === String(order.course_id); });
    var courseName = course ? course.title : ('강좌 ID: ' + order.course_id);

    html += '<div class="modal-course-title">📚 ' + courseName + '</div>';

    // 이 강좌의 video_progress
    var courseVP = userVP.filter(function(vp){ return String(vp.course_id) === String(order.course_id); });
    courseVP.sort(function(a,b){ return a.lesson_number - b.lesson_number; });

    if (!courseVP.length) {
      html += '<div style="color:#aaa;font-size:13px;padding:8px 0 12px;">아직 시청 기록이 없어요</div>';
      return;
    }

    courseVP.forEach(function(vp) {
      var pct       = vp.watch_percentage || 0;
      var barColor  = pct >= 80 ? '#2D9B6F' : pct >= 50 ? '#F59E0B' : '#aaa';
      var doneText  = vp.completed ? '<span class="lesson-done-badge">✅ 완료</span>' : '';
      var totalTxt  = vp.total_seconds ? ' (전체 ' + fmtSecs(vp.total_seconds) + ')' : '';

      html += '<div class="lesson-card">' +
        '<div class="lesson-card-top">' +
          '<span class="lesson-num">' + vp.lesson_number + '강</span>' +
          '<span class="lesson-title">' + (vp.lesson_title || '') + totalTxt + '</span>' +
          '<span class="lesson-pct" style="color:' + barColor + ';">' + pct + '%' + doneText + '</span>' +
        '</div>' +
        '<div class="lesson-detail">실제 시청: ' + (vp.actual_watched_text || fmtSecs(vp.actual_watched_seconds)) + '</div>' +
        '<div class="lesson-bar-wrap"><div class="lesson-bar-fill" style="background:' + barColor + ';width:' + pct + '%;"></div></div>' +
        '</div>';
    });
  });

  body.innerHTML = html || '<div class="empty">시청 데이터가 없어요</div>';
}

// ── 데이터 로드 ──
async function loadAll() {
  try {
    var [profilesRes, ordersRes, vpRes, logsRes, coursesRes] = await Promise.all([
      sb.from('profiles').select('id, name, email, role, phone, has_unlimited_pass, created_at').order('created_at', { ascending:false }),
      sb.from('orders').select('id, user_id, course_id, progress, status, amount, payment_id, refund_status, created_at').eq('status','paid'),
      sb.from('video_progress').select('user_id, course_id, lesson_number, lesson_title, actual_watched_seconds, actual_watched_text, total_seconds, watch_percentage, completed, updated_at'),
      sb.from('study_logs').select('user_id, course_id, lesson_number, studied_at'),
      sb.from('courses').select('id, title'),
    ]);

    allProfiles      = profilesRes.data  || [];
    allOrders        = ordersRes.data    || [];
    allVideoProgress = vpRes.data        || [];
    allStudyLogs     = logsRes.data      || [];
    allCourses       = coursesRes.data   || [];

    var userRes = await sb.auth.getUser();
    currentUserId = userRes.data?.user?.id || null;

    buildStudentRows();
    renderKPI();
    renderTable();
  } catch(e) {
    console.error('수강생 데이터 로드 오류:', e);
    document.getElementById('student-table-area').innerHTML =
      '<div class="empty">데이터를 불러오는 중 오류가 발생했어요</div>';
  }
}

// ── 환불 처리 모달 ──
var currentRefundOrderId = null;

function showRefundModal(userId, courseId, orderId, amount) {
  currentRefundOrderId = orderId;
  var course = allCourses.find(function(c){ return String(c.id) === String(courseId); });
  var courseName = course ? course.title : '강좌 ID: ' + courseId;
  var order = allOrders.find(function(o){ return o.id === orderId; });
  var purchaseDate = order ? fmtDate(order.created_at) : '-';
  var daysAgo = order ? daysSince(order.created_at) : 0;

  document.getElementById('refund-modal-info').innerHTML =
    '<strong>' + courseName + '</strong><br>' +
    '결제금액: <strong>₩' + Number(amount).toLocaleString() + '</strong><br>' +
    '구매일: ' + purchaseDate + ' (' + daysAgo + '일 전)<br><br>' +
    '관리자 권한으로 시청률·기간 무관 전액 환불됩니다.<br>' +
    '<span style="color:#EF4444;font-size:12px;">환불 처리 후에는 취소가 불가능합니다.</span>';

  var confirmBtn = document.getElementById('refund-confirm-btn');
  confirmBtn.disabled = false;
  confirmBtn.textContent = '환불 처리';
  confirmBtn.onclick = function() { showRefundStep2(orderId, courseName, amount); };

  document.getElementById('refund-step1').style.display = 'block';
  document.getElementById('refund-step2').style.display = 'none';
  document.getElementById('refund-modal').style.display = 'flex';
}

function showRefundStep2(orderId, courseName, amount) {
  document.getElementById('refund-step2-info').innerHTML =
    '<strong>정말 환불 처리하시겠습니까?</strong><br><br>' +
    '강좌: ' + courseName + '<br>' +
    '환불금액: <strong>₩' + Number(amount).toLocaleString() + '</strong><br><br>' +
    '이 작업은 즉시 실행되며 되돌릴 수 없습니다.';

  var finalBtn = document.getElementById('refund-final-btn');
  finalBtn.disabled = false;
  finalBtn.textContent = '최종 확인 — 환불 처리';
  finalBtn.onclick = function() { processRefund(orderId); };

  document.getElementById('refund-step1').style.display = 'none';
  document.getElementById('refund-step2').style.display = 'block';
}

function showRefundStep1() {
  document.getElementById('refund-step1').style.display = 'block';
  document.getElementById('refund-step2').style.display = 'none';
}

function closeRefundModal() {
  document.getElementById('refund-modal').style.display = 'none';
  document.getElementById('refund-step1').style.display = 'block';
  document.getElementById('refund-step2').style.display = 'none';
  currentRefundOrderId = null;
}

async function processRefund(orderId) {
  var confirmBtn = document.getElementById('refund-final-btn');
  confirmBtn.disabled = true;
  confirmBtn.textContent = '처리 중...';

  try {
    // 어드민 세션 토큰 (supabase auth 기반일 경우 getSession 사용)
    var { data: { session } } = await sb.auth.getSession();
    var token = session ? session.access_token : '';

    var res = await fetch('https://lvglkxjzraznwnfilxvy.supabase.co/functions/v1/refund-payment', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify({ orderId: orderId }),
    });

    var result = await res.json();

    if (result.success) {
      var refundText = result.refund_amount > 0
        ? '₩' + Number(result.refund_amount).toLocaleString() + ' 환불 완료'
        : '환불 불가';
      document.getElementById('refund-step2-info').style.background = '#F0FDF4';
      document.getElementById('refund-step2-info').style.borderColor = '#BBF7D0';
      document.getElementById('refund-step2-info').style.color = '#14532D';
      document.getElementById('refund-step2-info').innerHTML =
        '<span style="font-weight:700;">✅ 처리 완료</span><br>' +
        (result.message || '') + '<br><br>' +
        '<strong>' + refundText + '</strong>';
      confirmBtn.style.display = 'none';
      document.querySelector('#refund-step2 button[onclick="showRefundStep1()"]').style.display = 'none';
      await loadAll();
    } else {
      document.getElementById('refund-step2-info').innerHTML =
        '<span style="font-weight:700;">❌ 오류 발생</span><br>' + (result.error || '알 수 없는 오류');
      confirmBtn.disabled = false;
      confirmBtn.textContent = '다시 시도';
    }
  } catch(e) {
    document.getElementById('refund-step2-info').innerHTML =
      '<span style="font-weight:700;">❌ 네트워크 오류</span><br>' + (e.message || '오류가 발생했습니다.');
    confirmBtn.disabled = false;
    confirmBtn.textContent = '다시 시도';
  }
}

loadAll();
</script>
