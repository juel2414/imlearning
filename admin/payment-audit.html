<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 대사 — 아이엠러닝 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<link rel="stylesheet" href="admin-common.css">
<style>
body { background:#F8F9FA; }
.pa-lead { font-size:13px; color:#666; line-height:1.75; max-width:760px; margin-bottom:1.5rem; }
.pa-lead strong { color:#111; }
.pa-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem; }
.pa-range { display:flex; gap:6px; }
.pa-tab { padding:7px 16px; border-radius:20px; border:1.5px solid rgba(0,0,0,.1); background:#fff; font-size:13px; font-weight:600; color:#777; cursor:pointer; }
.pa-tab.active { background:#2D9B6F; border-color:#2D9B6F; color:#fff; }
.pa-run { padding:9px 22px; border:none; border-radius:10px; background:#111; color:#fff; font-size:13px; font-weight:700; cursor:pointer; }
.pa-run:disabled { opacity:.5; cursor:not-allowed; }
.pa-result { background:#fff; border-radius:14px; border:1px solid rgba(0,0,0,.06); padding:22px 24px; }
.pa-verdict { display:flex; align-items:center; gap:12px; margin-bottom:4px; }
.pa-dot { width:10px; height:10px; border-radius:50%; flex:none; }
.pa-dot.ok  { background:#16A34A; }
.pa-dot.bad { background:#EF4444; }
.pa-dot.idle{ background:#D1D5DB; }
.pa-title { font-size:17px; font-weight:800; color:#111; }
.pa-sub { font-size:12.5px; color:#888; margin-left:22px; }
.pa-table-wrap { overflow-x:auto; margin-top:1.25rem; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:10px 14px; font-size:11px; font-weight:700; color:#888; border-bottom:2px solid rgba(0,0,0,.06); white-space:nowrap; }
td { padding:12px 14px; border-bottom:1px solid rgba(0,0,0,.04); vertical-align:top; }
tr:last-child td { border-bottom:none; }
.pa-pid { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; color:#444; word-break:break-all; }
.pa-amt { font-weight:700; white-space:nowrap; }
.pa-ctx { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#666; max-width:320px; word-break:break-all; }
.pa-none { font-size:12px; color:#C0392B; font-weight:600; }
.pa-err { background:#FEF2F2; border:1px solid #FECACA; color:#B91C1C; border-radius:10px; padding:14px 16px; font-size:13px; line-height:1.6; }
</style>
</head>
<body>
<main class="admin-main">
  <div class="admin-header">
    <h1>결제 대사</h1>
  </div>

  <p class="pa-lead">
    포트원에 <strong>승인된 결제</strong>와 우리 DB의 <strong>주문·선물</strong>을 맞춰 봅니다.
    짝이 없는 결제는 돈은 빠져나갔는데 아무 기록이 없다는 뜻이라 손으로 확인해야 합니다.
    평소에는 웹훅이 막아 주지만, 웹훅 자체가 실패할 수 있어 마지막 그물로 둡니다.
  </p>

  <div class="pa-bar">
    <div class="pa-range" id="pa-range">
      <button class="pa-tab active" data-days="7">최근 7일</button>
      <button class="pa-tab" data-days="30">최근 30일</button>
      <button class="pa-tab" data-days="90">최근 90일</button>
    </div>
    <button class="pa-run" id="pa-run">대사 실행</button>
  </div>

  <div class="pa-result" id="pa-result">
    <div class="pa-verdict"><span class="pa-dot idle"></span><span class="pa-title">아직 실행하지 않았습니다</span></div>
    <div class="pa-sub">기간을 고르고 대사 실행을 누르세요.</div>
  </div>
</main>

<script>
var PA_DAYS = 7;

document.getElementById('pa-range').addEventListener('click', function (e) {
  var b = e.target.closest('.pa-tab');
  if (!b) return;
  [].forEach.call(this.querySelectorAll('.pa-tab'), function (t) { t.classList.remove('active'); });
  b.classList.add('active');
  PA_DAYS = Number(b.dataset.days);
});

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function won(n) {
  return n == null ? '-' : Number(n).toLocaleString('ko-KR') + '원';
}
function when(iso) {
  if (!iso) return '-';
  var d = new Date(iso);
  return d.toLocaleString('ko-KR', { dateStyle:'short', timeStyle:'short' });
}

document.getElementById('pa-run').addEventListener('click', async function () {
  var btn = this, box = document.getElementById('pa-result');
  btn.disabled = true; btn.textContent = '조회 중...';
  box.innerHTML = '<div class="pa-verdict"><span class="pa-dot idle"></span>'
                + '<span class="pa-title">포트원 결제 내역을 불러오는 중...</span></div>';
  try {
    var s = await supabaseClient.auth.getSession();
    if (!s.data.session) { location.href = 'login.html'; return; }

    var res = await fetch(SUPABASE_URL + '/functions/v1/payment-audit', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + s.data.session.access_token,
      },
      body: JSON.stringify({ days: PA_DAYS }),
    });
    var out = await res.json();

    if (!out.success) {
      box.innerHTML = '<div class="pa-err"><strong>조회 실패</strong><br>' + esc(out.error) + '</div>';
      return;
    }

    var n = out.orphanCount || 0;
    var head = '<div class="pa-verdict"><span class="pa-dot ' + (n ? 'bad' : 'ok') + '"></span>'
             + '<span class="pa-title">' + (n ? n + '건이 기록 없이 결제되었습니다' : '모두 맞습니다') + '</span></div>'
             + '<div class="pa-sub">최근 ' + out.days + '일, 승인된 결제 ' + out.checked + '건을 확인했습니다.</div>';

    if (!n) { box.innerHTML = head; return; }

    var rows = out.orphans.map(function (o) {
      var ctx = o.customData
        ? '<span class="pa-ctx">' + esc(o.customData) + '</span>'
        : '<span class="pa-none">customData 없음 — 손으로 확인 필요</span>';
      return '<tr>'
           + '<td>' + when(o.paidAt) + '</td>'
           + '<td class="pa-pid">' + esc(o.paymentId) + '</td>'
           + '<td>' + esc(o.orderName) + '</td>'
           + '<td class="pa-amt">' + won(o.amount) + '</td>'
           + '<td>' + esc(o.customer) + '</td>'
           + '<td>' + ctx + '</td>'
           + '</tr>';
    }).join('');

    box.innerHTML = head
      + '<div class="pa-table-wrap"><table>'
      + '<thead><tr><th>승인 시각</th><th>결제번호</th><th>주문명</th><th>금액</th><th>결제자</th><th>결제 맥락</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table></div>';

  } catch (e) {
    box.innerHTML = '<div class="pa-err"><strong>오류</strong><br>' + esc(String(e)) + '</div>';
  } finally {
    btn.disabled = false; btn.textContent = '대사 실행';
  }
});
</script>
<script src="../js/admin-nav.js"></script>
</body>
</html>
