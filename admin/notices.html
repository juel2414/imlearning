<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 관리 — 아이엠러닝 관리자</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <link rel="stylesheet" href="admin-common.css">
  <style>
    body { background: #F8F9FA; }
    @media (min-width: 1024px) {
      #notice-form     { display: block !important; }
      .toggle-form-btn { display: none !important; }
    }
    .toggle-form-btn { padding: 8px 18px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .form-textarea   { height: 160px; resize: vertical; }
    .btn-save   { padding: 10px 24px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-save:hover { background: #1A7A4A; }
    .btn-cancel { padding: 10px 20px; background: #fff; color: #6B6B6B; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .notice-list  { display: flex; flex-direction: column; gap: 0; }
    .notice-row   { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.05); gap: 1rem; transition: background 0.15s; flex-wrap: wrap; }
    .notice-row:last-child { border-bottom: none; }
    .notice-row:hover { background: #F8F9FA; }
    .badge-notice { background: #E8F5EE; color: #1A7A4A; }
    .badge-event  { background: #FEF3C7; color: #D97706; }
    .badge-info   { background: #EEF2FF; color: #4B6FD4; }
    .badge-hidden { background: #F3F4F6; color: #9CA3AF; }
    .badge-list   { background: #F0FDF4; color: #16A34A; }
    .badge-popup  { background: #FFF7ED; color: #EA580C; }
    .badge-banner { background: #EFF6FF; color: #2563EB; }
    .notice-title-text { font-size: 14px; font-weight: 500; color: var(--black); flex: 1; min-width: 0; }
    .notice-date-text  { font-size: 12px; color: #6B6B6B; flex-shrink: 0; white-space: nowrap; }
    .action-btns  { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm-edit  { padding: 4px 10px; font-size: 11px; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; color: #3D3D3D; background: #fff; cursor: pointer; }
    .btn-sm-edit:hover { border-color: #2D9B6F; color: #2D9B6F; }
    .btn-sm-del   { padding: 4px 10px; font-size: 11px; border: 1px solid #FCA5A5; border-radius: 6px; color: #EF4444; background: #fff; cursor: pointer; }
    .btn-sm-del:hover { background: #FEE2E2; }
    .empty-state  { text-align: center; padding: 3rem; color: #6B6B6B; }
    .loading-state { text-align: center; padding: 3rem; color: #6B6B6B; }
    .display-hint { font-size: 11px; color: #888; margin-top: 6px; padding: 8px 10px; background: #f8f9fa; border-radius: 6px; line-height: 1.5; }
  </style>
</head>
<body>

<main class="admin-main">
  <div class="admin-header">
    <h1>📢 공지사항 관리</h1>
    <button class="toggle-form-btn" onclick="toggleForm()">+ 공지 작성</button>
  </div>

  <div class="page-grid-2">
    <!-- 작성/수정 폼 -->
    <div class="admin-card" id="notice-form" style="display:none;">
      <div class="admin-card-header">
        <span class="admin-card-title" id="form-title">공지사항 작성</span>
      </div>
      <div class="admin-card-body">
        <div class="form-row" style="margin-bottom:1.25rem;">
          <div class="form-group" style="margin:0;">
            <label class="form-label">유형</label>
            <select class="form-select" id="notice-type">
              <option value="notice">공지</option>
              <option value="event">이벤트</option>
              <option value="info">안내</option>
            </select>
          </div>
          <div class="form-group" style="margin:0;">
            <label class="form-label">날짜</label>
            <input class="form-input" type="date" id="notice-date">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">제목</label>
          <input class="form-input" type="text" id="notice-title" placeholder="공지사항 제목을 입력해주세요">
        </div>
        <div class="form-group">
          <label class="form-label">내용</label>
          <textarea class="form-textarea form-input" id="notice-content" placeholder="공지사항 내용을 입력해주세요"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">게시 방식</label>
          <select class="form-select" id="notice-display-mode" onchange="updateDisplayHint()">
            <option value="hidden">비공개 (초안)</option>
            <option value="none">일반 게시 (공지 목록에만)</option>
            <option value="popup">팝업으로 표시</option>
            <option value="banner">상단 배너로 표시</option>
          </select>
          <div class="display-hint" id="display-hint">공지사항 목록 페이지(notices.html)에 일반 게시됩니다.</div>
        </div>
        <div class="form-actions">
          <button class="btn-cancel" onclick="cancelForm()">취소</button>
          <button class="btn-save" id="save-btn" onclick="saveNotice()">저장하기</button>
        </div>
      </div>
    </div>

    <!-- 공지 목록 -->
    <div class="admin-card">
      <div class="admin-card-header">
        <span class="admin-card-title">공지 목록 <span id="notice-count" style="color:#2D9B6F;"></span></span>
      </div>
      <div class="notice-list" id="notice-list">
        <div class="loading-state">불러오는 중...</div>
      </div>
    </div>
  </div>
</main>

<div class="success-toast" id="toast"></div>

<script>
  var sb = window.supabaseClient;

  (async function checkAdminAccess() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = '../login.html?next=' + encodeURIComponent(location.pathname.split('/admin/')[1] ? 'admin/' + location.pathname.split('/admin/')[1] : 'admin/index.html');
      return;
    }
    const { data: profile } = await sb
      .from('profiles').select('role').eq('id', session.user.id).maybeSingle();
    if (!profile || !['admin','super_admin'].includes(profile.role)) {
      alert('관리자 권한이 없는 계정입니다.');
      window.location.href = '../index.html';
      return;
    }
  })();

  var TYPE_LABELS = { notice:'공지', event:'이벤트', info:'안내' };
  var TYPE_BADGES = { notice:'badge-notice', event:'badge-event', info:'badge-info' };
  var DISPLAY_LABELS = { hidden:'비공개', none:'일반 게시', popup:'팝업', banner:'배너' };
  var DISPLAY_BADGES = { hidden:'badge-hidden', none:'badge-list', popup:'badge-popup', banner:'badge-banner' };
  var DISPLAY_HINTS = {
    hidden: '비공개 상태입니다. 어드민에서만 보이며 수강생·방문자에게는 노출되지 않습니다.',
    none:   '공지사항 목록 페이지(notices.html)에 일반 게시됩니다.',
    popup:  '메인 페이지(index.html) 접속 시 팝업으로 표시됩니다. 가장 최근 공지 1개만 표시되며, 방문자가 오늘 하루 보지 않기 선택 시 하루 동안 나타나지 않습니다.',
    banner: '사이트 모든 페이지 상단에 배너 형태로 표시됩니다. 가장 최근 배너 공지 1개가 자동으로 노출됩니다.'
  };
  var editingId = null;

  function updateDisplayHint() {
    var mode = document.getElementById('notice-display-mode').value;
    document.getElementById('display-hint').textContent = DISPLAY_HINTS[mode] || '';
  }

  // 오늘 날짜 기본값
  document.getElementById('notice-date').value = new Date().toISOString().split('T')[0];

  // ── 목록 불러오기 ──────────────────────────────────────────────
  async function loadNotices() {
    var list = document.getElementById('notice-list');
    var { data, error } = await sb
      .from('notices')
      .select('*')
      .order('notice_date', { ascending: false })
      .order('created_at', { ascending: false });

    if (error) {
      list.innerHTML = '<div class="empty-state">불러오기 실패: ' + error.message + '</div>';
      return;
    }

    document.getElementById('notice-count').textContent = '(' + (data.length) + '개)';

    if (!data.length) {
      list.innerHTML = '<div class="empty-state">공지사항을 작성해보세요!</div>';
      return;
    }

    list.innerHTML = data.map(function(n) {
      var badge = TYPE_BADGES[n.type] || 'badge-notice';
      var label = TYPE_LABELS[n.type] || escHtml(n.type);
      var dm = n.display_mode || 'none';
      var dmBadge = '<span class="badge ' + (DISPLAY_BADGES[dm] || 'badge-list') + '" style="margin-left:4px;">' + (DISPLAY_LABELS[dm] || escHtml(dm)) + '</span>';
      return '<div class="notice-row">' +
        '<span class="badge ' + badge + '">' + label + '</span>' +
        dmBadge +
        '<span class="notice-title-text">' + escHtml(n.title) + '</span>' +
        '<span class="notice-date-text">' + (n.notice_date || '') + '</span>' +
        '<div class="action-btns">' +
          '<button class="btn-sm-edit" onclick="editNotice(' + n.id + ')">수정</button>' +
          '<button class="btn-sm-del"  onclick="deleteNotice(' + n.id + ')">삭제</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // ── 저장 (등록/수정) ───────────────────────────────────────────
  async function saveNotice() {
    var title   = document.getElementById('notice-title').value.trim();
    var type    = document.getElementById('notice-type').value;
    var date    = document.getElementById('notice-date').value;
    var content = document.getElementById('notice-content').value.trim();

    if (!title) { alert('제목을 입력해주세요'); return; }

    var btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.textContent = '저장 중...';

    var displayMode = document.getElementById('notice-display-mode').value;
    var payload = { type: type, title: title, notice_date: date || null, content: content || null, display_mode: displayMode };
    var error;

    if (editingId) {
      ({ error } = await sb.from('notices').update(payload).eq('id', editingId));
    } else {
      ({ error } = await sb.from('notices').insert(payload));
    }

    btn.disabled = false;
    btn.textContent = '저장하기';

    if (error) { alert('저장 실패: ' + error.message); return; }

    showToast(editingId ? '공지사항이 수정되었습니다!' : '공지사항이 등록되었습니다!');
    cancelForm();
    loadNotices();
  }

  // ── 수정 폼 열기 ───────────────────────────────────────────────
  async function editNotice(id) {
    var { data, error } = await sb.from('notices').select('*').eq('id', id).single();
    if (error || !data) { alert('불러오기 실패'); return; }

    editingId = id;
    document.getElementById('form-title').textContent = '공지사항 수정';
    document.getElementById('notice-type').value         = data.type || 'notice';
    document.getElementById('notice-date').value         = data.notice_date || '';
    document.getElementById('notice-title').value        = data.title || '';
    document.getElementById('notice-content').value      = data.content || '';
    document.getElementById('notice-display-mode').value = data.display_mode || 'none';
    updateDisplayHint();
    document.getElementById('notice-form').style.display = 'block';
    document.getElementById('notice-form').scrollIntoView({ behavior: 'smooth' });
  }

  // ── 삭제 ───────────────────────────────────────────────────────
  async function deleteNotice(id) {
    if (!confirm('정말 삭제할까요?')) return;
    var { error } = await sb.from('notices').delete().eq('id', id);
    if (error) { alert('삭제 실패: ' + error.message); return; }
    showToast('삭제되었습니다');
    loadNotices();
  }

  // ── 폼 토글 ────────────────────────────────────────────────────
  function toggleForm() {
    var form = document.getElementById('notice-form');
    if (form.style.display === 'none') {
      cancelForm();
      form.style.display = 'block';
      form.scrollIntoView({ behavior: 'smooth' });
    } else {
      form.style.display = 'none';
    }
  }

  function cancelForm() {
    editingId = null;
    document.getElementById('form-title').textContent  = '공지사항 작성';
    document.getElementById('notice-type').value         = 'notice';
    document.getElementById('notice-date').value         = new Date().toISOString().split('T')[0];
    document.getElementById('notice-title').value        = '';
    document.getElementById('notice-content').value      = '';
    document.getElementById('notice-display-mode').value = 'none';
    updateDisplayHint();
    document.getElementById('notice-form').style.display = 'none';
  }

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = '✅ ' + msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadNotices();
</script>
<script src="../js/admin-nav.js"></script>
</body>
</html>
