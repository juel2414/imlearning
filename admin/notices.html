<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 관리 — 아이엠러닝 관리자</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: #F8F9FA; }
    .admin-layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .admin-sidebar { background: var(--black); position: fixed; top: 0; left: 0; width: 220px; height: 100vh; overflow-y: auto; z-index: 100; }
    .admin-logo { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 16px; font-weight: 800; color: #fff; }
    .admin-logo span { color: #2D9B6F; }
    .admin-logo-sub { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 400; margin-top: 2px; }
    .admin-nav { padding: 1rem 0; }
    .admin-nav-section { padding: 0.5rem 1rem; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; margin-top: 0.5rem; }
    .admin-nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 1.25rem; font-size: 13px; color: rgba(255,255,255,0.6); transition: all 0.2s; text-decoration: none; }
    .admin-nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .admin-nav-item.active { background: rgba(45,155,111,0.15); color: #2D9B6F; font-weight: 600; border-right: 2px solid #2D9B6F; }
    .admin-nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .admin-main { margin-left: 220px; padding: 2rem; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .admin-header h1 { font-size: 24px; font-weight: 800; color: var(--black); }
    .admin-card { background: #fff; border-radius: 12px; border: 1px solid rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 1.5rem; }
    .admin-card-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: space-between; }
    .admin-card-title { font-size: 15px; font-weight: 700; color: var(--black); }
    .admin-card-body { padding: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--black); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 12px; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color 0.2s; background: #fff; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: #2D9B6F; }
    .form-textarea { height: 160px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 1rem; }
    .btn-save { padding: 10px 24px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-save:hover { background: #1A7A4A; }
    .btn-cancel { padding: 10px 20px; background: #fff; color: #6B6B6B; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .toggle-form-btn { padding: 8px 18px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }

    .notice-list { display: flex; flex-direction: column; gap: 0; }
    .notice-row { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.05); gap: 1rem; transition: background 0.15s; }
    .notice-row:last-child { border-bottom: none; }
    .notice-row:hover { background: #F8F9FA; }
    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .badge-notice { background: #E8F5EE; color: #1A7A4A; }
    .badge-event { background: #FEF3C7; color: #D97706; }
    .badge-info { background: #EEF2FF; color: #4B6FD4; }
    .notice-title-text { font-size: 14px; font-weight: 500; color: var(--black); flex: 1; }
    .notice-date-text { font-size: 12px; color: #6B6B6B; flex-shrink: 0; }
    .action-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm-edit { padding: 4px 10px; font-size: 11px; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; color: #3D3D3D; background: #fff; cursor: pointer; }
    .btn-sm-edit:hover { border-color: #2D9B6F; color: #2D9B6F; }
    .btn-sm-del { padding: 4px 10px; font-size: 11px; border: 1px solid #FCA5A5; border-radius: 6px; color: #EF4444; background: #fff; cursor: pointer; }
    .btn-sm-del:hover { background: #FEE2E2; }
    .empty-state { text-align: center; padding: 3rem; color: #6B6B6B; }

    .success-toast { display: none; position: fixed; top: 1.5rem; right: 1.5rem; background: #2D9B6F; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 999; }
    .success-toast.show { display: block; }
  </style>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-logo">아이엠<span>러닝</span><div class="admin-logo-sub">관리자 페이지</div></div>
    <nav class="admin-nav">
      <div class="admin-nav-section">메인</div>
      <a href="index.html" class="admin-nav-item"><span class="admin-nav-icon">📊</span> 대시보드</a>
      <div class="admin-nav-section">강좌 관리</div>
      <a href="courses.html" class="admin-nav-item"><span class="admin-nav-icon">📚</span> 강좌 관리</a>
      <a href="instructors.html" class="admin-nav-item"><span class="admin-nav-icon">👨‍🏫</span> 강사 관리</a>
      <div class="admin-nav-section">프로모션</div>
      <a href="promotions.html" class="admin-nav-item"><span class="admin-nav-icon">🎯</span> 프로모션 관리</a>
      <div class="admin-nav-section">콘텐츠</div>
      <a href="notices.html" class="admin-nav-item active"><span class="admin-nav-icon">📢</span> 공지사항</a>
      <a href="banners.html" class="admin-nav-item"><span class="admin-nav-icon">🎨</span> 배너 관리</a>
      <div class="admin-nav-section">설정</div>
      <a href="settings.html" class="admin-nav-item"><span class="admin-nav-icon">⚙️</span> 사이트 설정</a>
      <a href="../index.html" class="admin-nav-item"><span class="admin-nav-icon">🌐</span> 사이트 보기</a>
      <a href="login.html" class="admin-nav-item" onclick="logout();return false;"><span class="admin-nav-icon">🚪</span> 로그아웃</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>📢 공지사항 관리</h1>
      <button class="toggle-form-btn" onclick="toggleForm()">+ 공지 작성</button>
    </div>

    <!-- 작성 폼 -->
    <div class="admin-card" id="notice-form" style="display:none;">
      <div class="admin-card-header">
        <span class="admin-card-title" id="form-title">공지사항 작성</span>
      </div>
      <div class="admin-card-body">
        <div class="form-row" style="margin-bottom:1.25rem;">
          <div class="form-group" style="margin:0;">
            <label class="form-label">유형</label>
            <select class="form-select" id="notice-type">
              <option value="notice">공지</option>
              <option value="event">이벤트</option>
              <option value="info">안내</option>
            </select>
          </div>
          <div class="form-group" style="margin:0;">
            <label class="form-label">날짜</label>
            <input class="form-input" type="date" id="notice-date">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">제목</label>
          <input class="form-input" type="text" id="notice-title" placeholder="공지사항 제목을 입력해주세요">
        </div>
        <div class="form-group">
          <label class="form-label">내용</label>
          <textarea class="form-textarea" id="notice-content" placeholder="공지사항 내용을 입력해주세요"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn-cancel" onclick="toggleForm()">취소</button>
          <button class="btn-save" onclick="saveNotice()">저장하기</button>
        </div>
      </div>
    </div>

    <!-- 공지 목록 -->
    <div class="admin-card">
      <div class="admin-card-header">
        <span class="admin-card-title">공지 목록 <span id="notice-count" style="color:#2D9B6F;"></span></span>
      </div>
      <div class="notice-list" id="notice-list">
        <div class="empty-state">공지사항을 작성해보세요!</div>
      </div>
    </div>
  </main>
</div>

<div class="success-toast" id="toast"></div>

<script src="../js/main.js"></script>
<script>
if (!sessionStorage.getItem('admin_auth')) window.location.href = 'login.html';
function logout() { sessionStorage.removeItem('admin_auth'); window.location.href = 'login.html'; }

let notices = JSON.parse(localStorage.getItem('notices') || '[]');
let editingId = null;
const TYPE_LABELS = { notice:'공지', event:'이벤트', info:'안내' };
const TYPE_BADGES = { notice:'badge-notice', event:'badge-event', info:'badge-info' };

// 오늘 날짜 기본값
document.getElementById('notice-date').value = new Date().toISOString().split('T')[0];

function toggleForm() {
  const form = document.getElementById('notice-form');
  if (form.style.display === 'none') {
    form.style.display = 'block';
    resetForm();
    form.scrollIntoView({ behavior: 'smooth' });
  } else {
    form.style.display = 'none';
    resetForm();
  }
}

function resetForm() {
  editingId = null;
  document.getElementById('form-title').textContent = '공지사항 작성';
  document.getElementById('notice-type').value = 'notice';
  document.getElementById('notice-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('notice-title').value = '';
  document.getElementById('notice-content').value = '';
}

function saveNotice() {
  const title = document.getElementById('notice-title').value.trim();
  if (!title) { alert('제목을 입력해주세요'); return; }

  const notice = {
    id: editingId || Date.now(),
    type: document.getElementById('notice-type').value,
    date: document.getElementById('notice-date').value,
    title,
    content: document.getElementById('notice-content').value,
  };

  if (editingId) {
    const idx = notices.findIndex(n => n.id === editingId);
    if (idx !== -1) notices[idx] = notice;
  } else {
    notices.unshift(notice);
  }

  localStorage.setItem('notices', JSON.stringify(notices));
  renderNotices();
  toggleForm();
  showToast(editingId ? '공지사항이 수정되었습니다!' : '공지사항이 등록되었습니다!');
}

function editNotice(id) {
  const n = notices.find(n => n.id === id);
  if (!n) return;
  editingId = id;
  document.getElementById('form-title').textContent = '공지사항 수정';
  document.getElementById('notice-type').value = n.type;
  document.getElementById('notice-date').value = n.date;
  document.getElementById('notice-title').value = n.title;
  document.getElementById('notice-content').value = n.content || '';
  document.getElementById('notice-form').style.display = 'block';
  document.getElementById('notice-form').scrollIntoView({ behavior: 'smooth' });
}

function deleteNotice(id) {
  if (!confirm('정말 삭제할까요?')) return;
  notices = notices.filter(n => n.id !== id);
  localStorage.setItem('notices', JSON.stringify(notices));
  renderNotices();
  showToast('삭제되었습니다');
}

function renderNotices() {
  const list = document.getElementById('notice-list');
  document.getElementById('notice-count').textContent = `(${notices.length}개)`;
  if (notices.length === 0) {
    list.innerHTML = '<div class="empty-state">공지사항을 작성해보세요!</div>';
    return;
  }
  list.innerHTML = notices.map(n => `
    <div class="notice-row">
      <span class="badge ${TYPE_BADGES[n.type]}">${TYPE_LABELS[n.type]}</span>
      <span class="notice-title-text">${n.title}</span>
      <span class="notice-date-text">${n.date}</span>
      <div class="action-btns">
        <button class="btn-sm-edit" onclick="editNotice(${n.id})">수정</button>
        <button class="btn-sm-del" onclick="deleteNotice(${n.id})">삭제</button>
      </div>
    </div>
  `).join('');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = '✅ ' + msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

renderNotices();
</script>
<script src="../js/admin-nav.js"></script>
</body>
</html>
