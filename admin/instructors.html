<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강사 관리 — 아이엠러닝 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="admin-common.css">
<style>
  * { box-sizing: border-box; word-break: keep-all; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #F8F9FA; color: #111; }
  a { text-decoration: none; color: inherit; }

  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: #111318; color: #fff; }
  .sidebar-logo { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .sidebar-logo-text { font-size: 16px; font-weight: 800; white-space: nowrap; }
  .sidebar-logo-sub { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 4px; white-space: nowrap; }
  .nav-section { padding: 16px 20px 6px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; font-size: 13px; color: rgba(255,255,255,0.65); white-space: nowrap; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: rgba(45,155,111,0.15); color: #2D9B6F; font-weight: 600; }

  .main { flex: 1; padding: 32px; min-width: 0; }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .page-title { font-size: 26px; font-weight: 800; white-space: nowrap; margin: 0; }
  .page-desc { font-size: 13px; color: #6B6B6B; margin-top: 4px; white-space: nowrap; }
  .add-btn { padding: 10px 20px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }

  .stats-row { display: flex; gap: 16px; margin: 20px 0; flex-wrap: wrap; }
  .stat-card { flex: 1 1 200px; min-width: 160px; background: #fff; border-radius: 12px; padding: 20px; border: 1px solid rgba(0,0,0,0.06); }
  .stat-label { font-size: 13px; color: #6B6B6B; margin-bottom: 8px; white-space: nowrap; }
  .stat-value { font-size: 26px; font-weight: 800; white-space: nowrap; }
  .stat-value.green { color: #2D9B6F; }

  .card { background: #fff; border-radius: 12px; border: 1px solid rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 20px; }
  .card-header { padding: 18px 24px; border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .card-body { padding: 24px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .full { grid-column: 1/-1; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; }
  .form-group textarea { height: 80px; resize: vertical; }
  .form-actions { grid-column: 1/-1; display: flex; gap: 10px; justify-content: flex-end; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.06); }
  .btn-save { padding: 10px 24px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-cancel { padding: 10px 20px; background: #fff; color: #6B6B6B; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }

  .photo-box { width: 110px; height: 110px; border-radius: 50%; background: #E8F5EE; border: 2px dashed #2D9B6F; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; flex-shrink: 0; }
  .photo-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

  .instructors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .instructor-card { background: #fff; border: 1px solid rgba(0,0,0,0.07); border-radius: 12px; padding: 24px; text-align: center; }
  .instructor-avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 12px; overflow: hidden; background: #E8F5EE; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .instructor-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .instructor-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; white-space: nowrap; }
  .instructor-role { font-size: 12px; color: #2D9B6F; font-weight: 600; margin-bottom: 8px; }
  .instructor-desc { font-size: 12px; color: #6B6B6B; line-height: 1.5; margin-bottom: 10px; min-height: 36px; }
  .instructor-stats { display: flex; justify-content: center; gap: 14px; font-size: 11px; color: #6B6B6B; margin-bottom: 12px; padding: 8px 0; border-top: 1px solid rgba(0,0,0,0.05); border-bottom: 1px solid rgba(0,0,0,0.05); white-space: nowrap; }
  .instructor-stats b { color: #111; font-size: 13px; }
  .action-btns { display: flex; gap: 6px; justify-content: center; }
  .btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .btn-sm.edit { border: 1px solid rgba(0,0,0,0.1); background: #fff; }
  .btn-sm.del { border: 1px solid #FCA5A5; background: #fff; color: #EF4444; }

  .empty { text-align: center; padding: 40px; color: #6B6B6B; grid-column: 1/-1; }
  .toast { display: none; position: fixed; top: 20px; right: 20px; background: #2D9B6F; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 999; white-space: nowrap; }
  .toast.show { display: block; }
  .toast.error { background: #EF4444; }

  .menu-btn { display: none; }
  @media (max-width: 1023px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: fixed; top: 0; left: 0; height: 100vh; z-index: 200; transform: translateX(-100%); transition: 0.25s; overflow-y: auto; }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: flex; align-items: center; justify-content: center; position: fixed; top: 14px; left: 14px; z-index: 250; width: 38px; height: 38px; border-radius: 8px; background: #111318; color: #fff; border: none; font-size: 16px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">아이엠<span style="color:#2D9B6F;">러닝</span></div>
      <div class="sidebar-logo-sub">관리자 페이지</div>
    </div>
    <div class="nav-section">메인</div>
    <a href="index.html" class="nav-item">📊 대시보드</a>
    <div class="nav-section">강좌 관리</div>
    <a href="courses.html" class="nav-item">📚 강좌 관리</a>
    <a href="instructors.html" class="nav-item active">👨‍🏫 강사 관리</a>
    <div class="nav-section">프로모션</div>
    <a href="promotions.html" class="nav-item">🎯 프로모션 관리</a>
    <div class="nav-section">콘텐츠</div>
    <a href="notices.html" class="nav-item">📢 공지사항</a>
    <a href="banners.html" class="nav-item">🎨 배너 관리</a>
    <div class="nav-section">설정</div>
    <a href="settings.html" class="nav-item">⚙️ 사이트 설정</a>
    <a href="../index.html" class="nav-item">🌐 사이트 보기</a>
    <a href="#" class="nav-item" onclick="(async()=>{await sb.auth.signOut();window.location.href='../index.html';})()">🚪 로그아웃</a>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">👨‍🏫 강사 관리</h1>
        <div class="page-desc">강사 프로필을 추가, 수정하고 담당 강좌 현황을 확인해요</div>
      </div>
      <button class="add-btn" onclick="toggleForm()">+ 강사 추가</button>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">전체 강사</div><div class="stat-value" id="stat-total">-</div></div>
      <div class="stat-card"><div class="stat-label">담당 강좌 합계</div><div class="stat-value green" id="stat-courses">-</div></div>
      <div class="stat-card"><div class="stat-label">총 수강생</div><div class="stat-value" id="stat-students">-</div></div>
    </div>

    <div class="card" id="instructor-form" style="display:none;">
      <div class="card-header"><span class="card-title" id="form-title">새 강사 추가</span></div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-group full" style="display:flex;align-items:center;gap:1.5rem;">
            <div>
              <div class="photo-box" onclick="document.getElementById('photo-input').click()">
                <div style="font-size:28px;"><img src="../icons/profile.svg" alt="" style="width:1em;height:1em;vertical-align:-0.15em;display:inline-block;"></div>
                <div style="font-size:10px;color:#2D9B6F;margin-top:4px;font-weight:600;">사진 업로드</div>
                <img id="photo-img" src="" style="display:none;">
              </div>
              <input type="file" id="photo-input" accept="image/*" style="display:none;" onchange="previewPhoto(this)">
            </div>
            <div style="flex:1;">
              <div class="form-group" style="margin-bottom:12px;"><label>이름</label><input type="text" id="instructor-name" placeholder="강사 이름"></div>
              <div class="form-group"><label>역할 / 담당 과목</label><input type="text" id="instructor-role" placeholder="예: 신앙·사역 강사"></div>
            </div>
          </div>
          <div class="form-group full"><label>강사 소개</label><textarea id="instructor-bio" placeholder="강사 소개를 입력해주세요"></textarea></div>
          <div class="form-group"><label>이메일 (선택)</label><input type="email" id="instructor-email" placeholder="이메일 주소"></div>
          <div class="form-group"><label>SNS / 링크 (선택)</label><input type="url" id="instructor-link" placeholder="https://..."></div>
          <div class="form-actions">
            <button class="btn-cancel" onclick="toggleForm()">취소</button>
            <button class="btn-save" id="save-btn" onclick="saveInstructor()">강사 저장하기</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">강사 목록 <span id="instructor-count" style="color:#2D9B6F;"></span></span></div>
      <div class="card-body">
        <div class="instructors-grid" id="instructors-grid"><div class="empty">불러오는 중...</div></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL = 'https://lvglkxjzraznwnfilxvy.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2Z2xreGp6cmF6bnduZmlseHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MTMyOTgsImV4cCI6MjA5NzI4OTI5OH0.FGsNDbX_XQuVyJfJbFH2wuDLH21EhV7MSJvi6_Lu_tk';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async function checkAdminAccess() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = '../login.html?next=' + encodeURIComponent(location.pathname.split('/admin/')[1] ? 'admin/' + location.pathname.split('/admin/')[1] : 'admin/index.html');
    return;
  }
  const { data: profile } = await sb
    .from('profiles').select('role').eq('id', session.user.id).maybeSingle();
  if (!profile || profile.role !== 'admin') {
    alert('관리자 권한이 없는 계정입니다.');
    window.location.href = '../index.html';
    return;
  }
})();

var instructors = [];
var allCourses = [];
var editingId = null;
var photoData = null;

function toggleForm() {
  var form = document.getElementById('instructor-form');
  if (form.style.display === 'none') {
    form.style.display = 'block';
    resetForm();
    form.scrollIntoView({ behavior: 'smooth' });
  } else {
    form.style.display = 'none';
    resetForm();
  }
}

function resetForm() {
  editingId = null;
  photoData = null;
  document.getElementById('form-title').textContent = '새 강사 추가';
  ['instructor-name','instructor-role','instructor-bio','instructor-email','instructor-link'].forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('photo-img').style.display = 'none';
  document.getElementById('photo-img').src = '';
}

function previewPhoto(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    photoData = e.target.result;
    document.getElementById('photo-img').src = photoData;
    document.getElementById('photo-img').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

async function saveInstructor() {
  var name = document.getElementById('instructor-name').value.trim();
  if (!name) { alert('강사 이름을 입력해주세요'); return; }

  var btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = '저장 중...';

  var instructorData = {
    name: name,
    role: document.getElementById('instructor-role').value,
    bio: document.getElementById('instructor-bio').value,
    email: document.getElementById('instructor-email').value,
    link: document.getElementById('instructor-link').value,
    photo_url: photoData || null
  };

  try {
    var result;
    if (editingId) {
      result = await sb.from('instructors').update(instructorData).eq('id', editingId);
    } else {
      result = await sb.from('instructors').insert(instructorData);
    }
    if (result.error) {
      showToast('저장 중 오류: ' + result.error.message, true);
      btn.disabled = false; btn.textContent = '강사 저장하기';
      return;
    }
    await loadAll();
    toggleForm();
    showToast(editingId ? '강사 정보가 수정되었습니다!' : '새 강사가 추가되었습니다!');
  } catch (err) {
    showToast('저장 중 오류가 발생했습니다', true);
  }
  btn.disabled = false; btn.textContent = '강사 저장하기';
}

function editInstructor(id) {
  var i = null;
  for (var k = 0; k < instructors.length; k++) { if (instructors[k].id === id) { i = instructors[k]; break; } }
  if (!i) return;
  editingId = id;
  document.getElementById('form-title').textContent = '강사 수정';
  document.getElementById('instructor-name').value = i.name || '';
  document.getElementById('instructor-role').value = i.role || '';
  document.getElementById('instructor-bio').value = i.bio || '';
  document.getElementById('instructor-email').value = i.email || '';
  document.getElementById('instructor-link').value = i.link || '';
  if (i.photo_url) {
    photoData = i.photo_url;
    document.getElementById('photo-img').src = i.photo_url;
    document.getElementById('photo-img').style.display = 'block';
  }
  document.getElementById('instructor-form').style.display = 'block';
  document.getElementById('instructor-form').scrollIntoView({ behavior: 'smooth' });
}

async function deleteInstructor(id) {
  if (!confirm('정말 이 강사를 삭제할까요?')) return;
  try {
    var result = await sb.from('instructors').delete().eq('id', id);
    if (result.error) { showToast('삭제 중 오류가 발생했습니다', true); return; }
    await loadAll();
    showToast('강사가 삭제되었습니다');
  } catch (err) {
    showToast('삭제 중 오류가 발생했습니다', true);
  }
}

function courseStatsFor(name) {
  var list = allCourses.filter(function(c){ return c.instructor === name; });
  var students = 0;
  list.forEach(function(c){ students += (c.students || 0); });
  return { count: list.length, students: students };
}

function renderInstructors() {
  var grid = document.getElementById('instructors-grid');
  document.getElementById('instructor-count').textContent = '(' + instructors.length + '명)';

  document.getElementById('stat-total').textContent = instructors.length;
  document.getElementById('stat-courses').textContent = allCourses.length;
  var totalStudents = 0;
  allCourses.forEach(function(c){ totalStudents += (c.students||0); });
  document.getElementById('stat-students').textContent = totalStudents.toLocaleString();

  if (instructors.length === 0) {
    grid.innerHTML = '<div class="empty"><div style="font-size:40px;margin-bottom:12px;">👨‍🏫</div><div style="font-weight:600;margin-bottom:6px;">아직 등록된 강사가 없어요</div><div style="font-size:13px;">상단의 "+ 강사 추가" 버튼을 눌러 첫 강사를 등록해보세요!</div></div>';
    return;
  }

  grid.innerHTML = instructors.map(function(i) {
    var stats = courseStatsFor(i.name);
    return '<div class="instructor-card">' +
      '<div class="instructor-avatar">' + (i.photo_url ? '<img src="' + i.photo_url + '">' : '<img src="../icons/profile.svg" alt="" style="width:100%;height:100%;object-fit:contain;">') + '</div>' +
      '<div class="instructor-name">' + i.name + '</div>' +
      '<div class="instructor-role">' + (i.role || '') + '</div>' +
      '<div class="instructor-desc">' + (i.bio || '') + '</div>' +
      '<div class="instructor-stats"><div>담당 강좌<br><b>' + stats.count + '개</b></div><div>총 수강생<br><b>' + stats.students.toLocaleString() + '명</b></div></div>' +
      '<div class="action-btns"><button class="btn-sm edit" onclick="editInstructor(\'' + i.id + '\')">수정</button><button class="btn-sm del" onclick="deleteInstructor(\'' + i.id + '\')">삭제</button></div>' +
      '</div>';
  }).join('');
}

function showToast(msg, isError) {
  var toast = document.getElementById('toast');
  toast.textContent = (isError ? '❌ ' : '✅ ') + msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function(){ toast.classList.remove('show'); }, 3000);
}

async function loadAll() {
  try {
    var instructorsRes = await sb.from('instructors').select('*').order('created_at', { ascending: true });
    var coursesRes = await sb.from('courses').select('instructor, students');
    instructors = instructorsRes.data || [];
    allCourses = coursesRes.data || [];
    renderInstructors();
  } catch (err) {
    document.getElementById('instructors-grid').innerHTML = '<div class="empty">불러오기 중 오류가 발생했습니다</div>';
  }
}

loadAll();
</script>
<script src="../js/admin-nav.js"></script>
</body>
</html>
