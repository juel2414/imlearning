<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 — 아이엠러닝 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; word-break: keep-all; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #F8F9FA; color: #111; }
  a { text-decoration: none; color: inherit; }

  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: #111318; color: #fff; }
  .sidebar-logo { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .sidebar-logo-text { font-size: 16px; font-weight: 800; white-space: nowrap; }
  .sidebar-logo-text span { color: #2D9B6F; }
  .sidebar-logo-sub { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 4px; white-space: nowrap; }
  .nav-section { padding: 16px 20px 6px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; font-size: 13px; color: rgba(255,255,255,0.65); white-space: nowrap; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: rgba(45,155,111,0.15); color: #2D9B6F; font-weight: 600; }

  .main { flex: 1; padding: 32px; min-width: 0; }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .page-title { font-size: 26px; font-weight: 800; white-space: nowrap; margin: 0; }
  .page-date { font-size: 13px; color: #6B6B6B; margin-top: 6px; white-space: nowrap; }
  .add-btn { padding: 10px 20px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }

  .stats-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { flex: 1 1 200px; min-width: 160px; background: #fff; border-radius: 12px; padding: 20px; border: 1px solid rgba(0,0,0,0.06); }
  .stat-label { font-size: 13px; color: #6B6B6B; margin-bottom: 8px; white-space: nowrap; }
  .stat-value { font-size: 26px; font-weight: 800; white-space: nowrap; }
  .stat-delta { font-size: 12px; color: #2D9B6F; font-weight: 600; margin-top: 6px; white-space: nowrap; }

  .quick-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .quick-card { flex: 1 1 150px; min-width: 130px; background: #fff; border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; padding: 20px; text-align: center; }
  .quick-icon { font-size: 26px; margin-bottom: 8px; }
  .quick-label { font-size: 13px; font-weight: 600; white-space: nowrap; }

  .card { background: #fff; border-radius: 12px; border: 1px solid rgba(0,0,0,0.06); overflow: hidden; }
  .card-header { padding: 18px 24px; border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .see-all { font-size: 12px; color: #2D9B6F; font-weight: 600; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 10px 24px; text-align: left; font-size: 11px; color: #6B6B6B; background: #F8F9FA; white-space: nowrap; }
  td { padding: 12px 24px; font-size: 13px; border-bottom: 1px solid rgba(0,0,0,0.04); }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge.active { background: #DCFCE7; color: #16A34A; }
  .badge.hidden { background: #F0F0F0; color: #6B6B6B; }
  .empty { text-align: center; padding: 32px; color: #6B6B6B; font-size: 13px; }

  .menu-btn { display: none; }
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: fixed; top: 0; left: 0; height: 100vh; z-index: 200; transform: translateX(-100%); transition: 0.25s; overflow-y: auto; }
    .sidebar.open { transform: translateX(0); }
    .main { padding: 16px; padding-top: 64px; }
    .menu-btn { display: flex; align-items: center; justify-content: center; position: fixed; top: 14px; left: 14px; z-index: 250; width: 38px; height: 38px; border-radius: 8px; background: #111318; color: #fff; border: none; font-size: 16px; }
  }
</style>
</head>
<body>

<button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">아이엠<span>러닝</span></div>
      <div class="sidebar-logo-sub">관리자 페이지</div>
    </div>
    <div class="nav-section">메인</div>
    <a href="index.html" class="nav-item active">📊 대시보드</a>
    <div class="nav-section">강좌 관리</div>
    <a href="courses.html" class="nav-item">📚 강좌 관리</a>
    <a href="instructors.html" class="nav-item">👨‍🏫 강사 관리</a>
    <div class="nav-section">프로모션</div>
    <a href="promotions.html" class="nav-item">🎯 프로모션 관리</a>
    <div class="nav-section">콘텐츠</div>
    <a href="notices.html" class="nav-item">📢 공지사항</a>
    <a href="banners.html" class="nav-item">🎨 배너 관리</a>
    <div class="nav-section">설정</div>
    <a href="settings.html" class="nav-item">⚙️ 사이트 설정</a>
    <a href="../index.html" class="nav-item">🌐 사이트 보기</a>
    <a href="login.html" class="nav-item" onclick="sessionStorage.removeItem('admin_auth')">🚪 로그아웃</a>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">대시보드</h1>
        <div class="page-date" id="today"></div>
      </div>
      <a href="courses.html" class="add-btn">+ 새 강좌 추가</a>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">총 강좌 수</div>
        <div class="stat-value" id="s-courses">-</div>
        <div class="stat-delta" id="s-courses-d">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">총 강사 수</div>
        <div class="stat-value" id="s-instructors">-</div>
        <div class="stat-delta">등록된 강사진</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">총 수강생</div>
        <div class="stat-value" id="s-students">-</div>
        <div class="stat-delta">전체 강좌 합계</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">추천 강좌</div>
        <div class="stat-value" id="s-featured">-</div>
        <div class="stat-delta">메인 노출 중</div>
      </div>
    </div>

    <div class="quick-row">
      <a href="courses.html" class="quick-card"><div class="quick-icon">📚</div><div class="quick-label">강좌 추가</div></a>
      <a href="instructors.html" class="quick-card"><div class="quick-icon">👨‍🏫</div><div class="quick-label">강사 추가</div></a>
      <a href="notices.html" class="quick-card"><div class="quick-icon">📢</div><div class="quick-label">공지 작성</div></a>
      <a href="promotions.html" class="quick-card"><div class="quick-icon">🎯</div><div class="quick-label">프로모션 설정</div></a>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">최근 등록된 강좌</span>
        <a href="courses.html" class="see-all">전체 보기 →</a>
      </div>
      <div id="recent-area"><div class="empty">불러오는 중...</div></div>
    </div>
  </main>
</div>

<script>
if (!sessionStorage.getItem('admin_auth')) { window.location.href = 'login.html'; }

document.getElementById('today').textContent = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

var SUPABASE_URL = 'https://lvglkxjzraznwnfilxvy.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2Z2xreGp6cmF6bnduZmlseHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MTMyOTgsImV4cCI6MjA5NzI4OTI5OH0.FGsNDbX_XQuVyJfJbFH2wuDLH21EhV7MSJvi6_Lu_tk';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var CAT_LABELS = { faith:'신앙', edu:'교사·부모', mission:'캠프·사역', english:'영어·시험', freepass:'전강좌 무제한' };

async function load() {
  try {
    var coursesRes = await sb.from('courses').select('*').order('created_at', { ascending: false });
    var instructorsRes = await sb.from('instructors').select('*');

    var courses = coursesRes.data || [];
    var instructors = instructorsRes.data || [];

    document.getElementById('s-courses').textContent = courses.length;
    document.getElementById('s-courses-d').textContent = courses.filter(function(c){return c.status==='active';}).length + '개 판매중';
    document.getElementById('s-instructors').textContent = instructors.length;
    var totalStudents = 0;
    courses.forEach(function(c){ totalStudents += (c.students || 0); });
    document.getElementById('s-students').textContent = totalStudents.toLocaleString();
    document.getElementById('s-featured').textContent = courses.filter(function(c){return c.featured;}).length;

    var recent = courses.slice(0, 5);
    var area = document.getElementById('recent-area');
    if (recent.length === 0) {
      area.innerHTML = '<div class="empty">아직 등록된 강좌가 없어요. "강좌 추가"로 첫 강좌를 등록해보세요!</div>';
      return;
    }
    var html = '<table><thead><tr><th>강좌명</th><th>카테고리</th><th>강사</th><th>가격</th><th>상태</th></tr></thead><tbody>';
    recent.forEach(function(c) {
      html += '<tr>';
      html += '<td style="font-weight:600;">' + c.title + '</td>';
      html += '<td>' + (CAT_LABELS[c.category] || '-') + '</td>';
      html += '<td>' + (c.instructor || '-') + '</td>';
      html += '<td>' + (c.price ? '₩' + Number(c.price).toLocaleString() : '-') + '</td>';
      html += '<td><span class="badge ' + (c.status === 'active' ? 'active' : 'hidden') + '">' + (c.status === 'active' ? '판매중' : '비공개') + '</span></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    area.innerHTML = html;
  } catch (err) {
    document.getElementById('recent-area').innerHTML = '<div class="empty">불러오기 중 오류가 발생했습니다</div>';
  }
}
load();
</script>
</body>
</html>
