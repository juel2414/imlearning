<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 — 아이엠러닝 관리자</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #F8F9FA; word-break: keep-all; overflow-wrap: normal; }
    h1, h2, h3, .stat-card-value, .admin-header h1 { word-break: keep-all; white-space: normal; }
    .admin-layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .admin-sidebar { background: var(--black); position: fixed; top: 0; left: 0; width: 220px; height: 100vh; overflow-y: auto; z-index: 100; }
    .admin-logo { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 16px; font-weight: 800; color: #fff; }
    .admin-logo span { color: #2D9B6F; }
    .admin-logo-sub { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 400; margin-top: 2px; }
    .admin-nav { padding: 1rem 0; }
    .admin-nav-section { padding: 0.5rem 1rem; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; margin-top: 0.5rem; }
    .admin-nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 1.25rem; font-size: 13px; color: rgba(255,255,255,0.6); transition: all 0.2s; text-decoration: none; }
    .admin-nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .admin-nav-item.active { background: rgba(45,155,111,0.15); color: #2D9B6F; font-weight: 600; border-right: 2px solid #2D9B6F; }
    .admin-nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .admin-main { margin-left: 220px; padding: 2rem; max-width: 1200px; }
    .admin-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .admin-header h1 { font-size: 28px; font-weight: 800; color: var(--black); white-space: nowrap; }
    .admin-header-date { font-size: 13px; color: #6B6B6B; margin-top: 4px; white-space: nowrap; }
    .admin-header { min-width: 0; }
    .admin-main { overflow-x: hidden; }
    .quick-add-btn { padding: 10px 20px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }

    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #fff; border-radius: 12px; padding: 1.5rem; border: 1px solid rgba(0,0,0,0.06); min-width: 0; overflow: hidden; }
    .stat-card-label { font-size: 13px; color: #6B6B6B; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-card-value { font-size: 28px; font-weight: 800; color: var(--black); margin-bottom: 6px; }
    .stat-card-delta { font-size: 12px; color: #2D9B6F; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .quick-action { background: #fff; border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s; text-decoration: none; color: var(--black); }
    .quick-action:hover { border-color: #2D9B6F; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .quick-action-icon { font-size: 28px; margin-bottom: 8px; }
    .quick-action-label { font-size: 13px; font-weight: 600; white-space: nowrap; }

    .admin-card { background: #fff; border-radius: 12px; border: 1px solid rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 1.5rem; }
    .admin-card-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: space-between; }
    .admin-card-title { font-size: 15px; font-weight: 700; color: var(--black); }
    .see-all-link { font-size: 12px; color: #2D9B6F; font-weight: 600; text-decoration: none; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th { padding: 10px 1.5rem; text-align: left; font-size: 11px; font-weight: 700; color: #6B6B6B; text-transform: uppercase; background: #F8F9FA; border-bottom: 1px solid rgba(0,0,0,0.06); }
    .admin-table td { padding: 12px 1.5rem; font-size: 13px; color: #3D3D3D; border-bottom: 1px solid rgba(0,0,0,0.04); }
    .admin-table tr:last-child td { border-bottom: none; }
    .badge { display: inline-flex; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-active { background: #DCFCE7; color: #16A34A; }
    .badge-hidden { background: #F5F5F5; color: #6B6B6B; }
    .empty-tip { text-align: center; padding: 2rem; color: #6B6B6B; font-size: 13px; }

    /* 모바일 반응형 */
    .mobile-menu-btn { display: none; }
    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: flex; align-items: center; justify-content: center;
        position: fixed; top: 1rem; left: 1rem; z-index: 200;
        width: 40px; height: 40px; border-radius: 8px;
        background: var(--black); color: #fff; border: none;
        font-size: 18px; cursor: pointer;
      }
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar {
        transform: translateX(-100%); transition: transform 0.25s ease;
        width: 240px;
      }
      .admin-sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.2); }
      .admin-main { margin-left: 0; padding: 1.25rem; padding-top: 4rem; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .quick-actions { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .price-grid { grid-template-columns: 1fr; }
      .admin-header { flex-direction: column; align-items: stretch; }
      .admin-card-header { flex-direction: column; align-items: stretch; }
      .search-input { width: 100%; }
      .view-toggle { width: 100%; }
      .view-toggle button { flex: 1; }
    }
  </style>
</head>
<body>

<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="admin-layout">
  <aside class="admin-sidebar" id="sidebar">
    <div class="admin-logo">아이엠<span>러닝</span><div class="admin-logo-sub">관리자 페이지</div></div>
    <nav class="admin-nav">
      <div class="admin-nav-section">메인</div>
      <a href="index.html" class="admin-nav-item active"><span class="admin-nav-icon">📊</span> 대시보드</a>
      <div class="admin-nav-section">강좌 관리</div>
      <a href="courses.html" class="admin-nav-item"><span class="admin-nav-icon">📚</span> 강좌 관리</a>
      <a href="instructors.html" class="admin-nav-item"><span class="admin-nav-icon">👨‍🏫</span> 강사 관리</a>
      <div class="admin-nav-section">프로모션</div>
      <a href="promotions.html" class="admin-nav-item"><span class="admin-nav-icon">🎯</span> 프로모션 관리</a>
      <div class="admin-nav-section">콘텐츠</div>
      <a href="notices.html" class="admin-nav-item"><span class="admin-nav-icon">📢</span> 공지사항</a>
      <a href="banners.html" class="admin-nav-item"><span class="admin-nav-icon">🎨</span> 배너 관리</a>
      <div class="admin-nav-section">설정</div>
      <a href="settings.html" class="admin-nav-item"><span class="admin-nav-icon">⚙️</span> 사이트 설정</a>
      <a href="../index.html" class="admin-nav-item"><span class="admin-nav-icon">🌐</span> 사이트 보기</a>
      <a href="login.html" class="admin-nav-item" onclick="logout();return false;"><span class="admin-nav-icon">🚪</span> 로그아웃</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>대시보드</h1>
        <div class="admin-header-date" id="today-date"></div>
      </div>
      <a href="courses.html" class="quick-add-btn" style="text-decoration:none;display:inline-block;">+ 새 강좌 추가</a>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-card-label">총 강좌 수</div>
        <div class="stat-card-value" id="stat-courses">-</div>
        <div class="stat-card-delta" id="stat-courses-active">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">총 강사 수</div>
        <div class="stat-card-value" id="stat-instructors">-</div>
        <div class="stat-card-delta">등록된 강사진</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">총 수강생</div>
        <div class="stat-card-value" id="stat-students">-</div>
        <div class="stat-card-delta">전체 강좌 합계</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">추천 강좌</div>
        <div class="stat-card-value" id="stat-featured">-</div>
        <div class="stat-card-delta">메인 노출 중</div>
      </div>
    </div>

    <div class="quick-actions">
      <a href="courses.html" class="quick-action">
        <div class="quick-action-icon">📚</div>
        <div class="quick-action-label">강좌 추가</div>
      </a>
      <a href="instructors.html" class="quick-action">
        <div class="quick-action-icon">👨‍🏫</div>
        <div class="quick-action-label">강사 추가</div>
      </a>
      <a href="notices.html" class="quick-action">
        <div class="quick-action-icon">📢</div>
        <div class="quick-action-label">공지 작성</div>
      </a>
      <a href="promotions.html" class="quick-action">
        <div class="quick-action-icon">🎯</div>
        <div class="quick-action-label">프로모션 설정</div>
      </a>
    </div>

    <div class="admin-card">
      <div class="admin-card-header">
        <span class="admin-card-title">최근 등록된 강좌</span>
        <a href="courses.html" class="see-all-link">전체 보기 →</a>
      </div>
      <div id="recent-courses">
        <div class="empty-tip">불러오는 중...</div>
      </div>
    </div>
  </main>
</div>

<script src="../js/main.js"></script>
<script>
function toggleSidebar() { document.getElementById("sidebar").classList.toggle("open"); }
</script>
<script src="../js/supabase-client.js"></script>
<script>
if (!sessionStorage.getItem('admin_auth')) window.location.href = 'login.html';
function logout() { sessionStorage.removeItem('admin_auth'); window.location.href = 'login.html'; }

document.getElementById('today-date').textContent = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

const CAT_LABELS = { faith:'신앙', edu:'교사·부모', mission:'캠프·사역', english:'영어·시험', freepass:'전강좌 무제한' };

async function loadDashboard() {
  try {
    const [coursesRes, instructorsRes] = await Promise.all([
      supabaseClient.from('courses').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('instructors').select('*')
    ]);

    const courses = coursesRes.data || [];
    const instructors = instructorsRes.data || [];

    document.getElementById('stat-courses').textContent = courses.length;
    document.getElementById('stat-courses-active').textContent = courses.filter(c => c.status === 'active').length + '개 판매중';
    document.getElementById('stat-instructors').textContent = instructors.length;
    document.getElementById('stat-students').textContent = courses.reduce((s,c) => s + (c.students||0), 0).toLocaleString();
    document.getElementById('stat-featured').textContent = courses.filter(c => c.featured).length;

    const recent = courses.slice(0, 5);
    const area = document.getElementById('recent-courses');
    if (recent.length === 0) {
      area.innerHTML = '<div class="empty-tip">아직 등록된 강좌가 없어요. "강좌 추가"로 첫 강좌를 등록해보세요!</div>';
      return;
    }
    area.innerHTML = `
      <table class="admin-table">
        <thead><tr><th>강좌명</th><th>카테고리</th><th>강사</th><th>가격</th><th>상태</th></tr></thead>
        <tbody>
          ${recent.map(c => `
            <tr>
              <td style="font-weight:600;">${c.title}</td>
              <td>${CAT_LABELS[c.category] || '-'}</td>
              <td>${c.instructor || '-'}</td>
              <td>${c.price ? '₩' + Number(c.price).toLocaleString() : '-'}</td>
              <td><span class="badge ${c.status === 'active' ? 'badge-active' : 'badge-hidden'}">${c.status === 'active' ? '판매중' : '비공개'}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (err) {
    document.getElementById('recent-courses').innerHTML = '<div class="empty-tip">불러오기 중 오류가 발생했습니다</div>';
  }
}

loadDashboard();
</script>
</body>
</html>
