<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 — 아이엠러닝</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .notices-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 52px 20px 80px;
    }
    .notices-header {
      margin-bottom: 28px;
    }
    .notices-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #111;
      margin: 0 0 6px;
    }
    .notices-header p {
      font-size: 14px;
      color: #888;
      margin: 0;
    }
    /* 탭 */
    .notice-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }
    .notice-tab {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(0,0,0,0.1);
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: #777;
      cursor: pointer;
      transition: all 0.15s;
    }
    .notice-tab.active, .notice-tab:hover {
      background: #2D9B6F;
      border-color: #2D9B6F;
      color: #fff;
    }
    /* 목록 컨테이너 */
    .notice-list {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      overflow: hidden;
    }
    /* 공지 아이템 */
    .notice-item {
      display: block !important;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      transition: background 0.12s;
    }
    .notice-item:last-child { border-bottom: none; }
    .notice-item-header {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      cursor: pointer;
      user-select: none;
    }
    .notice-item-header:hover { background: #f9fafb; }
    /* 배지 */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .badge-notice { background: #E8F5EE; color: #1A7A4A; }
    .badge-event  { background: #FEF3C7; color: #D97706; }
    .badge-info   { background: #EEF2FF; color: #4B6FD4; }
    /* 제목 */
    .notice-title {
      font-size: 15px;
      font-weight: 600;
      color: #111;
      word-break: keep-all;
      overflow-wrap: break-word;
      line-height: 1.5;
    }
    /* 날짜 */
    .notice-date {
      font-size: 12px;
      color: #aaa;
      white-space: nowrap;
    }
    /* 토글 화살표 */
    .notice-chevron {
      font-size: 11px;
      color: #ccc;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .notice-item.open .notice-chevron { transform: rotate(180deg); }
    /* 본문 */
    .notice-content {
      display: none;
      padding: 16px 24px 22px;
      margin: 0 24px;
      border-top: 1px solid rgba(0,0,0,0.06);
      font-size: 14px;
      line-height: 1.85;
      color: #444;
      white-space: pre-line;
      word-break: keep-all;
    }
    .notice-item.open .notice-content { display: block; }
    /* 빈/로딩 */
    .empty-state, .loading-state {
      text-align: center;
      padding: 64px 20px;
      color: #aaa;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      .notice-item-header { padding: 14px 16px; gap: 10px; }
      .notice-title { font-size: 14px; }
      .notice-content { margin: 0 16px; padding: 14px 0 18px; }
    }
  </style>
</head>
<body>

<div class="notices-wrap">
  <div class="notices-header">
    <h1>📢 공지사항</h1>
    <p>아이엠러닝의 새 소식과 안내를 확인하세요.</p>
  </div>

  <div class="notice-tabs">
    <button class="notice-tab active" data-filter="all">전체</button>
    <button class="notice-tab" data-filter="notice">공지</button>
    <button class="notice-tab" data-filter="event">이벤트</button>
    <button class="notice-tab" data-filter="info">안내</button>
  </div>

  <div class="notice-list" id="notice-list">
    <div class="loading-state">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  var TYPE_LABELS = { notice: '공지', event: '이벤트', info: '안내' };
  var TYPE_BADGES = { notice: 'badge-notice', event: 'badge-event', info: 'badge-info' };
  var allNotices  = [];
  var curFilter   = 'all';

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function render(notices) {
    var list = document.getElementById('notice-list');
    if (!notices.length) {
      list.innerHTML = '<div class="empty-state">등록된 공지사항이 없습니다.</div>';
      return;
    }
    list.innerHTML = notices.map(function(n, i) {
      var badge = TYPE_BADGES[n.type] || 'badge-notice';
      var label = TYPE_LABELS[n.type] || '공지';
      var contentHtml = n.content
        ? '<div class="notice-content">' + escHtml(n.content) + '</div>'
        : '';
      return '<div class="notice-item" data-idx="' + i + '">' +
        '<div class="notice-item-header">' +
          '<span class="badge ' + badge + '">' + label + '</span>' +
          '<span class="notice-title">' + escHtml(n.title) + '</span>' +
          '<span class="notice-date">' + (n.notice_date || '') + '</span>' +
          (n.content ? '<span class="notice-chevron">▼</span>' : '') +
        '</div>' +
        contentHtml +
      '</div>';
    }).join('');

    // 아코디언 토글
    list.querySelectorAll('.notice-item').forEach(function(el) {
      el.addEventListener('click', function() {
        if (!el.querySelector('.notice-content')) return;
        el.classList.toggle('open');
      });
    });
  }

  async function load() {
    var { data, error } = await supabaseClient
      .from('notices')
      .select('*')
      .neq('display_mode', 'hidden')
      .order('notice_date', { ascending: false })
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('notice-list').innerHTML =
        '<div class="empty-state">불러오기에 실패했습니다.</div>';
      return;
    }
    allNotices = data || [];
    applyFilter();
  }

  function applyFilter() {
    var filtered = curFilter === 'all'
      ? allNotices
      : allNotices.filter(function(n) { return n.type === curFilter; });
    render(filtered);
  }

  // 탭 필터
  document.querySelectorAll('.notice-tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.notice-tab').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      curFilter = btn.dataset.filter;
      applyFilter();
    });
  });

  load();
})();
</script>
</body>
</html>
