<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 재설정 — 아이엠러닝</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    body { background: #F4F5F6; min-height: 100vh; margin: 0; }
    .auth-wrap { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 2.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .auth-title { font-size: 20px; font-weight: 700; color: #111; text-align: center; margin: 1rem 0 6px; }
    .auth-desc  { font-size: 13px; color: #888; text-align: center; margin-bottom: 2rem; line-height: 1.6; word-break: keep-all; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: #111; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: #2D9B6F; }
    .submit-btn { width: 100%; padding: 13px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 0.5rem; font-family: inherit; }
    .submit-btn:disabled { background: #C4C4C4; cursor: not-allowed; }
    .error-msg  { display: none; background: #FEE2E2; color: #EF4444; font-size: 12px; padding: 10px 12px; border-radius: 8px; margin-bottom: 1rem; }
    .error-msg.show { display: block; }
    .success-box { display: none; text-align: center; padding: 2rem 0 1rem; }
    .success-box.show { display: block; }
    .success-icon { font-size: 48px; margin-bottom: 1rem; }
    .success-title { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 8px; }
    .success-desc  { font-size: 13px; color: #666; line-height: 1.7; word-break: keep-all; }
    .top-logo-bar { padding: 1.25rem 2rem; }
    .top-logo-bar a { font-size: 18px; font-weight: 800; color: #111; text-decoration: none; }
    .top-logo-bar a span { color: #2D9B6F; }
    .back-link { display: block; text-align: center; margin-top: 1.5rem; font-size: 13px; color: #888; text-decoration: none; }
    .back-link:hover { color: #2D9B6F; }
    .strength-bar { height: 4px; border-radius: 2px; background: #eee; margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; width: 0; transition: width .2s, background .2s; }
  </style>
</head>
<body>

<div class="top-logo-bar">
  <a href="index.html">아이엠<span>러닝</span></a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <img src="images/logo-vertical.png" alt="아이엠러닝" style="height:80px;width:auto;display:block;margin:0 auto 0.5rem;">

    <!-- ① 이메일 입력 화면 -->
    <div id="step-request">
      <div class="auth-title">비밀번호 재설정</div>
      <div class="auth-desc">가입하신 이메일 주소를 입력해 주세요.<br>재설정 링크를 보내드립니다.</div>

      <div class="error-msg" id="req-error"></div>

      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input" type="email" id="req-email" placeholder="example@email.com" autocomplete="email">
      </div>
      <button class="submit-btn" id="req-btn" onclick="sendResetEmail()">재설정 링크 보내기</button>

      <!-- 발송 완료 -->
      <div class="success-box" id="req-sent">
        <div class="success-icon">📬</div>
        <div class="success-title">이메일을 확인해 주세요</div>
        <div class="success-desc">
          입력하신 이메일로 비밀번호 재설정 링크를 보냈습니다.<br>
          링크는 <strong>1시간</strong> 동안 유효합니다.<br><br>
          메일이 오지 않는다면 스팸 폴더를 확인해 주세요.
        </div>
      </div>

      <a class="back-link" href="login.html">← 로그인으로 돌아가기</a>
    </div>

    <!-- ② 새 비밀번호 설정 화면 (이메일 링크 클릭 후) -->
    <div id="step-reset" style="display:none;">
      <div class="auth-title">새 비밀번호 설정</div>
      <div class="auth-desc">사용할 새 비밀번호를 입력해 주세요.</div>

      <div class="error-msg" id="reset-error"></div>

      <div class="form-group">
        <label class="form-label">새 비밀번호</label>
        <input class="form-input" type="password" id="new-password" placeholder="8자 이상 입력" autocomplete="new-password" oninput="checkStrength(this.value)">
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호 확인</label>
        <input class="form-input" type="password" id="confirm-password" placeholder="비밀번호를 다시 입력" autocomplete="new-password">
      </div>
      <button class="submit-btn" id="reset-btn" onclick="updatePassword()">비밀번호 변경하기</button>

      <!-- 변경 완료 -->
      <div class="success-box" id="reset-done">
        <div class="success-icon">✅</div>
        <div class="success-title">비밀번호가 변경되었습니다</div>
        <div class="success-desc">새 비밀번호로 로그인되었습니다.<br>잠시 후 강의실로 이동합니다...</div>
      </div>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script>
var sb = window.supabaseClient;

// Supabase가 URL 해시의 recovery 토큰을 처리한 뒤 PASSWORD_RECOVERY 이벤트를 발생시킴
sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    document.getElementById('step-request').style.display = 'none';
    document.getElementById('step-reset').style.display   = 'block';
    document.getElementById('new-password').focus();
  }
});

// ── 재설정 메일 발송 ─────────────────────────────────────────────
async function sendResetEmail() {
  var email = document.getElementById('req-email').value.trim();
  var errEl = document.getElementById('req-error');
  errEl.classList.remove('show');

  if (!email) {
    errEl.textContent = '이메일을 입력해 주세요.';
    errEl.classList.add('show');
    return;
  }

  var btn = document.getElementById('req-btn');
  btn.disabled = true;
  btn.textContent = '발송 중...';

  var redirectTo = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/') + 'reset-password.html';

  var { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });

  btn.disabled = false;
  btn.textContent = '재설정 링크 보내기';

  if (error) {
    errEl.textContent = '발송 실패: ' + error.message;
    errEl.classList.add('show');
    return;
  }

  // 성공 — 입력 폼 숨기고 안내 메시지 표시
  document.getElementById('req-email').parentElement.style.display = 'none';
  btn.style.display = 'none';
  document.getElementById('req-sent').classList.add('show');
}

// ── 새 비밀번호 저장 ─────────────────────────────────────────────
async function updatePassword() {
  var pw  = document.getElementById('new-password').value;
  var pw2 = document.getElementById('confirm-password').value;
  var errEl = document.getElementById('reset-error');
  errEl.classList.remove('show');

  if (pw.length < 8) {
    errEl.textContent = '비밀번호는 8자 이상이어야 합니다.';
    errEl.classList.add('show');
    return;
  }
  if (pw !== pw2) {
    errEl.textContent = '비밀번호가 일치하지 않습니다.';
    errEl.classList.add('show');
    return;
  }

  var btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.textContent = '변경 중...';

  var { error } = await sb.auth.updateUser({ password: pw });

  if (error) {
    errEl.textContent = '변경 실패: ' + error.message;
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = '비밀번호 변경하기';
    return;
  }

  // 성공
  document.getElementById('new-password').parentElement.style.display = 'none';
  document.getElementById('confirm-password').parentElement.style.display = 'none';
  btn.style.display = 'none';
  document.getElementById('reset-done').classList.add('show');

  setTimeout(function() {
    window.location.href = 'my-courses.html';
  }, 2500);
}

// ── 비밀번호 강도 표시 ───────────────────────────────────────────
function checkStrength(pw) {
  var score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[0-9]/.test(pw))  score++;
  if (/[^a-zA-Z0-9]/.test(pw)) score++;
  var fill  = document.getElementById('strength-fill');
  var colors = ['', '#EF4444', '#F59E0B', '#3B82F6', '#2D9B6F'];
  fill.style.width  = (score * 25) + '%';
  fill.style.background = colors[score] || '#eee';
}

// Enter 키 처리
document.getElementById('req-email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendResetEmail();
});
document.getElementById('confirm-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') updatePassword();
});
</script>
</body>
</html>
