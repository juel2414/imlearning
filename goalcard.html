<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBUP 골카드 — 아이엠러닝</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif !important;
  word-break: keep-all;
  letter-spacing: -0.01em;
  background: #f7f8fa;
}
.gc-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem 1rem 4rem;
}
.gc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 12px;
}
.gc-title {
  font-size: 22px;
  font-weight: 900;
  color: #111;
  letter-spacing: -0.5px;
}
.gc-subtitle {
  font-size: 13px;
  color: #888;
  margin-top: 4px;
}
.gc-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.gc-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.18s;
  text-decoration: none;
}
.gc-btn-back {
  background: #f0f0f0;
  color: #555;
}
.gc-btn-back:hover { background: #e0e0e0; }
.gc-btn-print {
  background: #2D9B6F;
  color: #fff;
}
.gc-btn-print:hover { background: #248a5f; }

/* 통계 바 */
.gc-stats {
  display: flex;
  gap: 10px;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.gc-stat-card {
  background: #fff;
  border-radius: 12px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid rgba(0,0,0,0.07);
  flex: 1;
  min-width: 140px;
}
.gc-stat-icon { font-size: 20px; }
.gc-stat-val { font-size: 22px; font-weight: 900; color: #111; }
.gc-stat-lbl { font-size: 11px; color: #888; margin-top: 2px; }

/* 주차 섹션 */
.gc-section {
  background: #fff;
  border-radius: 16px;
  border: 1px solid rgba(0,0,0,0.07);
  margin-bottom: 12px;
  overflow: hidden;
}
.gc-section-head {
  background: linear-gradient(90deg, #1a5c3a 0%, #2D9B6F 100%);
  color: #fff;
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.gc-section-week {
  background: rgba(255,255,255,0.2);
  border-radius: 6px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 800;
}
.gc-lesson-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0;
}
.gc-lessons-col {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px 14px;
  border-right: 1px solid rgba(0,0,0,0.06);
}
.gc-lesson-cell {
  display: flex;
  flex-direction: column;
  background: #f8faf9;
  border-radius: 8px;
  padding: 7px 10px;
  min-width: 130px;
  max-width: 200px;
  flex: 1;
  gap: 4px;
  border: 1px solid rgba(0,0,0,0.05);
}
.gc-lesson-title {
  font-size: 11px;
  font-weight: 600;
  color: #333;
  line-height: 1.35;
}
.gc-lesson-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  width: fit-content;
}
.badge-approved  { background: #d1fae5; color: #065f46; }
.badge-pending   { background: #fef9c3; color: #854d0e; }
.badge-rejected  { background: #fee2e2; color: #991b1b; }
.badge-none      { background: #f0f0f0; color: #999; }

/* ── 한눈에 보기: 주차 × 요일 표 (실물 골카드와 같은 배치) ── */
.gc-overview { margin-bottom: 1.5rem; }
.gc-ov-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
.gc-ov-title { font-size:15px; font-weight:800; color:#111; }
.gc-ov-pct { font-size:13px; color:#555; font-variant-numeric:tabular-nums; }
.gc-ov-pct b { font-size:20px; color:#1a5c3a; }

.gc-bar { height:10px; border-radius:999px; background:#eef0f2; overflow:hidden; display:flex; margin-bottom:16px; }
.gc-bar i { display:block; height:100%; }
.gc-bar .b-approved { background:#2D9B6F; }
.gc-bar .b-pending  { background:#eab308; }
.gc-bar .b-rejected { background:#ef4444; }

.gc-grid-wrap { overflow-x:auto; border:1px solid rgba(0,0,0,.12); border-radius:10px; }
table.gc-grid { border-collapse:collapse; width:100%; min-width:1000px; font-size:11px; background:#fff; }
table.gc-grid th, table.gc-grid td { border:1px solid rgba(0,0,0,.10); padding:0; vertical-align:top; }
table.gc-grid thead th { background:#f4f6f7; font-size:12px; font-weight:800; color:#333; padding:7px 4px; text-align:center; position:sticky; top:0; z-index:1; }
.gc-g-week { width:52px; background:#fafbfb; text-align:center; font-weight:800; font-size:12px; color:#111; padding:6px 2px; }
.gc-g-week small { display:block; font-weight:600; color:#888; font-size:10px; margin-top:2px; font-variant-numeric:tabular-nums; }
.gc-g-book { width:130px; padding:6px 8px; font-size:10.5px; line-height:1.45; color:#555; background:#fcfcfd; }

/* 한 칸 안에 그날 강의들을 세로로 쌓는다 */
.gc-day { display:flex; flex-direction:column; }
.gc-item { display:flex; align-items:flex-start; gap:5px; padding:5px 7px; border-bottom:1px solid rgba(0,0,0,.06); line-height:1.4; }
.gc-item:last-child { border-bottom:none; }
.gc-item .mk { flex-shrink:0; width:13px; height:13px; border-radius:3px; margin-top:1px;
  display:inline-flex; align-items:center; justify-content:center; font-size:9px; color:#fff; font-weight:800; background:#e3e6e8; }
.gc-item.s-approved .mk { background:#2D9B6F; }
.gc-item.s-pending  .mk { background:#eab308; }
.gc-item.s-rejected .mk { background:#ef4444; }
.gc-item.s-approved { background:#f2fbf7; }
.gc-item.s-rejected { background:#fef4f4; }
.gc-item .nm { color:#222; word-break:keep-all; }
.gc-item.s-none .nm { color:#98a0a6; }
.gc-day-empty { padding:8px; color:#d5d9dc; text-align:center; }

.gc-legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:#666; }
.gc-legend span { display:inline-flex; align-items:center; gap:5px; }
.gc-legend i { width:11px; height:11px; border-radius:3px; display:inline-block; }

.gc-detail-toggle { margin:20px 0 12px; }
.gc-detail-toggle button { background:#f4f6f7; border:1px solid rgba(0,0,0,.09); border-radius:8px;
  padding:9px 16px; font-size:13px; font-weight:700; color:#333; cursor:pointer; font-family:inherit; }
.gc-detail-toggle button:hover { background:#eceff1; }
#gc-body[hidden] { display:none; }

@media print {
  .gc-detail-toggle { display:none; }
  #gc-body { display:block !important; }
}

/* 필독서 컬럼 */
.gc-book-col {
  padding: 12px 14px;
  min-width: 160px;
  max-width: 200px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
}
.gc-book-label {
  font-size: 10px;
  font-weight: 700;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.gc-book-title {
  font-size: 12px;
  font-weight: 700;
  color: #333;
  line-height: 1.4;
}
.gc-book-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  width: fit-content;
}
.gc-book-none {
  font-size: 12px;
  color: #bbb;
}

/* ── 표 ── */
.gc-table-wrap {
  background: #fff;
  border: 1px solid rgba(0,0,0,0.07);
  border-radius: 14px;
  overflow: hidden;
}
.gc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.gc-table th {
  background: #f4f6f8;
  padding: 11px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 800;
  color: #6b7280;
  letter-spacing: 0.3px;
  border-bottom: 1px solid rgba(0,0,0,0.07);
  white-space: nowrap;
}
.gc-table td {
  padding: 9px 14px;
  border-bottom: 1px solid rgba(0,0,0,0.045);
  vertical-align: middle;
}
.gc-table tr:last-child td { border-bottom: none; }
.gc-table tbody tr:hover td { background: #fafbfc; }
.gc-week-start td { border-top: 2px solid rgba(45,155,111,0.18); }
.gc-table tbody tr:first-child td { border-top: none; }

.gc-td-week {
  background: #f7fbf9;
  vertical-align: top !important;
  border-right: 1px solid rgba(0,0,0,0.05);
}
.gc-week-num  { font-size: 13px; font-weight: 900; color: #1a5c3a; }
.gc-week-name { font-size: 11px; color: #8a9a92; margin-top: 3px; line-height: 1.4; }
.gc-td-no     { color: #b9bfc6; font-variant-numeric: tabular-nums; font-size: 12px; }
.gc-td-title  { color: #222; line-height: 1.45; }
.gc-td-status { white-space: nowrap; }
.gc-td-book {
  background: #fcfcfd;
  border-left: 1px solid rgba(0,0,0,0.05);
  vertical-align: top !important;
}
.gc-td-book-title { font-size: 12px; font-weight: 700; color: #333; line-height: 1.4; margin-bottom: 5px; }

/* 로딩 / 에러 */
.gc-loading {
  text-align: center;
  padding: 4rem 1rem;
  color: #aaa;
  font-size: 15px;
}
.gc-error {
  text-align: center;
  padding: 3rem 1rem;
  color: #e53e3e;
  font-size: 14px;
}

/* 인쇄 스타일 */
@media print {
  .gc-actions, nav, header, footer, .navbar, .site-footer { display: none !important; }
  body { background: #fff !important; font-size: 10pt; }
  .gc-wrap { max-width: 100%; padding: 0; }
  .gc-stat-card { padding: 8px 12px; }
  .gc-title { font-size: 16pt; }
  .gc-table-wrap { border: none; border-radius: 0; overflow: visible; }
  .gc-table { font-size: 9pt; }
  .gc-table th { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .gc-table td, .gc-table th { padding: 5px 8px; }
  .gc-table tr { break-inside: avoid; }
  .gc-table thead { display: table-header-group; } /* 페이지마다 머리글 반복 */
  .gc-lesson-badge, .gc-book-badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

@media (max-width: 640px) {
  .gc-stat-card { min-width: 120px; }
  /* 좁은 화면에서는 표를 가로 스크롤한다 (행 구조를 깨지 않는 편이 읽기 쉽다) */
  .gc-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .gc-table { min-width: 620px; }
  .gc-table th, .gc-table td { padding: 8px 10px; }
}

/* 탭 안에 끼워 넣었을 때: 부모가 제목과 버튼을 이미 보여주므로 중복을 없앤다 */
html.gc-embed body { background: transparent; }
html.gc-embed .gc-header { display: none; }
html.gc-embed .gc-wrap { padding-top: 0; margin-top: 0; }
</style>
</head>
<body>
<!-- 공통 네비게이션.
     탭 안에 iframe 으로 넣을 때(?embed=1)는 nav.js 가 스스로 빠져나온다. -->
<script>
  if (new URLSearchParams(location.search).get('embed') === '1') {
    document.documentElement.classList.add('gc-embed');
  }
</script>
<script src="js/nav.js"></script>

<div class="gc-wrap">
  <div class="gc-header">
    <div>
      <div class="gc-title">📋 CBUP 골카드</div>
      <div class="gc-subtitle" id="gc-course-name">CBUP 4세대 수료과정 진도 현황</div>
    </div>
    <div class="gc-actions">
      <a href="my-courses.html" class="gc-btn gc-btn-back">← 나의 강의실</a>
      <button class="gc-btn gc-btn-print" onclick="window.print()">⬇ PDF 저장</button>
    </div>
  </div>

  <!-- 통계 -->
  <div class="gc-stats" id="gc-stats">
    <div class="gc-stat-card"><span class="gc-stat-icon">✅</span><div><div class="gc-stat-val" id="stat-approved">-</div><div class="gc-stat-lbl">완료 (승인됨)</div></div></div>
    <div class="gc-stat-card"><span class="gc-stat-icon">⏳</span><div><div class="gc-stat-val" id="stat-pending">-</div><div class="gc-stat-lbl">승인 대기중</div></div></div>
    <div class="gc-stat-card"><span class="gc-stat-icon">↩️</span><div><div class="gc-stat-val" id="stat-rejected">-</div><div class="gc-stat-lbl">반려 (재제출 필요)</div></div></div>
    <div class="gc-stat-card"><span class="gc-stat-icon">✏️</span><div><div class="gc-stat-val" id="stat-none">-</div><div class="gc-stat-lbl">미제출</div></div></div>
    <div class="gc-stat-card"><span class="gc-stat-icon">📖</span><div><div class="gc-stat-val" id="stat-reading">-</div><div class="gc-stat-lbl">독서노트</div></div></div>
  </div>

  <div class="gc-overview" id="gc-overview"></div>

  <div class="gc-detail-toggle" id="gc-detail-toggle" hidden>
    <button type="button" onclick="var d=document.getElementById('gc-body');d.hidden=!d.hidden;this.textContent=d.hidden?'▾ 강의별 상세 보기':'▴ 상세 접기';">▾ 강의별 상세 보기</button>
  </div>

  <div id="gc-body" hidden><div class="gc-loading">불러오는 중...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
(async function () {
  'use strict';

  // ── 대상 강좌 결정 (?course=ID, 없으면 CBUP 4세대) ──
  const DEFAULT_COURSE_ID = 1;
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('course') || params.get('course_id');
  const COURSE_ID = parseInt(raw, 10) > 0 ? parseInt(raw, 10) : DEFAULT_COURSE_ID;
  // 관리자가 특정 수강생의 골카드를 열어볼 때 쓴다 (?user=<uuid>).
  // 일반 회원이 넣어도 RLS 가 남의 제출을 막으므로 빈 화면이 될 뿐이다.
  const VIEW_USER = params.get('user');

  function showError(msg) {
    // 상세 표는 기본으로 접혀 있으므로 오류는 요약 영역에 띄운다
    document.getElementById('gc-overview').innerHTML =
      `<div class="gc-error">${msg}<br><a href="courses.html" style="color:#2D9B6F;font-weight:700;">강좌 보러 가기 →</a></div>`;
    document.getElementById('gc-stats').style.display = 'none';
    document.getElementById('gc-detail-toggle').hidden = true;
  }

  // ── 인증 확인 ──
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) {
    window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
    return;
  }

  const { data: myRole } = await supabaseClient.rpc('get_my_role');
  const isAdmin = (myRole === 'admin' || myRole === 'super_admin');
  if (VIEW_USER && !isAdmin) { showError('⚠️ 다른 회원의 골카드는 관리자만 열람할 수 있습니다.'); return; }
  const TARGET_ID = (VIEW_USER && isAdmin) ? VIEW_USER : user.id;

  // ── 강좌 정보 ──
  const { data: course } = await supabaseClient
    .from('courses').select('id, title').eq('id', COURSE_ID).maybeSingle();
  if (!course) { showError('⚠️ 강좌를 찾을 수 없습니다.'); return; }

  document.getElementById('gc-course-name').textContent = course.title + ' 진도 현황';
  document.title = course.title + ' 골카드 — 아이엠러닝';

  // 남의 골카드를 보고 있다면 누구 것인지 분명히 알린다
  if (TARGET_ID !== user.id) {
    const { data: who } = await supabaseClient
      .from('profiles').select('name, email').eq('id', TARGET_ID).maybeSingle();
    const label = who ? (who.name || who.email || TARGET_ID.slice(0, 8)) : TARGET_ID.slice(0, 8);
    const bar = document.createElement('div');
    bar.style.cssText = 'background:#ede9fe;color:#5b21b6;border:1px solid #ddd6fe;border-radius:10px;'
      + 'padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:14px;';
    bar.textContent = '🔑 관리자 열람 — ' + label + ' 님의 골카드';
    document.getElementById('gc-overview').before(bar);
  }

  // ── 수강 여부 확인 ──
  // 사이트의 다른 수강 판정과 같은 기준을 쓴다:
  //   결제완료(paid) + 환불 아님 + 기간 안 지남
  //   · 해당 강좌 주문        (관리자 부여분 포함 — 부여도 paid 로 기록된다)
  //   · 전강좌 프리패스        (course_id 가 비어 있는 주문)
  //   · 선물받아 수락한 강좌
  const { data: myOrders } = await supabaseClient
    .from('orders').select('course_id, status, refund_status, expires_at')
    .eq('user_id', user.id).eq('status', 'paid');

  const notRefunded = o => !o.refund_status || o.refund_status === 'none';
  const notExpired  = o => !o.expires_at || new Date(o.expires_at) > new Date();

  let allowed = (myOrders || []).some(o =>
    notRefunded(o) && notExpired(o) &&
    (String(o.course_id) === String(COURSE_ID) || o.course_id === null)
  );

  if (!allowed) {
    const { data: myGift } = await supabaseClient
      .from('gifts').select('id')
      .eq('recipient_id', user.id).eq('course_id', COURSE_ID).eq('status', 'accepted')
      .limit(1).maybeSingle();
    allowed = !!myGift;
  }

  if (!allowed) allowed = isAdmin;

  if (!allowed) {
    showError(`⚠️ &lsquo;${escHtml(course.title)}&rsquo; 수강생만 골카드를 열람할 수 있습니다.`);
    return;
  }

  // ── 데이터 병렬 로드 ──
  const [lessonsRes, textbooksRes, submissionsRes] = await Promise.all([
    supabaseClient
      .from('lessons')
      .select('id, title, section_title, sort_order')
      .eq('course_id', COURSE_ID)
      .order('sort_order'),
    supabaseClient
      .from('course_textbooks')
      .select('week_number, textbooks(id, title, textbook_chapters(id))')
      .eq('course_id', COURSE_ID)
      .order('week_number'),
    supabaseClient
      .from('submissions')
      .select('lesson_id, textbook_id, chapter_id, type, status')
      .eq('user_id', TARGET_ID)
      .eq('course_id', COURSE_ID)
  ]);

  const lessons = lessonsRes.data || [];
  const textbooks = textbooksRes.data || [];
  const submissions = submissionsRes.data || [];

  // ── 제출 현황 맵 ──
  // 강의 노트의 lesson_id 는 'lesson-<강의번호>' 형식으로 저장된다 (강좌 상세 제출 화면 기준).
  // lessons.id(내부 PK)와는 다른 값이므로 sort_order 로 맞춰서 찾는다.
  const lectureKey = l => 'lesson-' + l.sort_order;
  const lectureMap = {};
  submissions.filter(s => s.type === 'lecture').forEach(s => {
    if (s.lesson_id) lectureMap[s.lesson_id] = s.status;
  });
  // reading: textbook_id → status
  // 교재별 { 승인 챕터 수, 제출 챕터 수, 대표 상태 } 를 만든다.
  // 챕터가 없는 교재는 종전처럼 책 한 권이 곧 한 건이다.
  const readingMap = {};
  const readingCount = {};
  submissions.filter(s => s.type === 'reading').forEach(s => {
    if (!s.textbook_id) return;
    const c = readingCount[s.textbook_id] || (readingCount[s.textbook_id] = { approved: 0, pending: 0, rejected: 0 });
    if (s.status === 'approved') c.approved++;
    else if (s.status === 'rejected') c.rejected++;
    else c.pending++;
  });
  Object.keys(readingCount).forEach(id => {
    const c = readingCount[id];
    readingMap[id] = c.approved ? 'approved' : c.rejected ? 'rejected' : 'pending';
  });

  // ── 교재 맵: week_number → {id, title} ──
  const bookMap = {};
  textbooks.forEach(t => {
    if (t.textbooks) bookMap[t.week_number] = t.textbooks;
  });

  // ── 섹션 그룹화 ──
  const sections = [];
  const sectionMap = {};
  lessons.forEach(l => {
    const key = l.section_title || '기타';
    if (!sectionMap[key]) {
      sectionMap[key] = { title: key, lessons: [] };
      sections.push(sectionMap[key]);
    }
    sectionMap[key].lessons.push(l);
  });

  // ── 통계 계산 ──
  let approved = 0, pending = 0, rejected = 0, noneCount = 0;
  lessons.forEach(l => {
    const s = lectureMap[lectureKey(l)];
    if (s === 'approved') approved++;
    else if (s === 'pending') pending++;
    else if (s === 'rejected') rejected++;
    else noneCount++;
  });
  let readingApproved = 0;
  Object.values(readingCount).forEach(c => { readingApproved += c.approved; });

  document.getElementById('stat-approved').textContent = approved;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-rejected').textContent = rejected;
  document.getElementById('stat-none').textContent = noneCount;
  document.getElementById('stat-reading').textContent = readingApproved;

  // ── 주차 번호 추출 (섹션 제목 앞의 숫자) ──
  function weekNum(sectionTitle) {
    const m = sectionTitle.match(/^(\d+)주차/);
    return m ? parseInt(m[1]) : null;
  }

  // ── HTML 빌드 ──
  // 승인되어야 비로소 '완료'다. 제출만 한 상태는 '승인 대기중'.
  function statusLabel(status) {
    if (status === 'approved') return { cls: 'badge-approved', text: '✓ 완료' };
    if (status === 'pending')  return { cls: 'badge-pending',  text: '⏳ 승인 대기중' };
    if (status === 'rejected') return { cls: 'badge-rejected', text: '✗ 반려 — 재제출 필요' };
    return { cls: 'badge-none', text: '— 미제출' };
  }

  function badgeHtml(status) {
    const s = statusLabel(status);
    return `<span class="gc-lesson-badge ${s.cls}">${s.text}</span>`;
  }

  function bookBadgeHtml(status) {
    const s = statusLabel(status);
    return `<span class="gc-book-badge ${s.cls}">${s.text}</span>`;
  }

  // ── 한눈에 보기 ──────────────────────────────────────────
  // 실물 골카드와 같은 배치: 세로 = 주차, 가로 = 요일.
  // 강의 제목이 "월1강 · 시간관리 (1) - 클라라선교사" 형태라 요일을 앞에서 뽑아낸다.
  const DAYS = ['월','화','수','목','금','토'];
  function parseTitle(t) {
    const m = String(t || '').match(/^([월화수목금토일])\s*(\d+)강\s*[·.]?\s*(.*)$/);
    if (!m) return { day: null, no: null, name: t || '' };
    // 뒤쪽 " - 강사명" 은 표에서 생략한다 (칸이 좁다)
    const name = m[3].replace(/\s*[-–—]\s*[^-–—]*선교사\s*$/, '').trim();
    return { day: m[1], no: parseInt(m[2], 10), name: name || m[3] };
  }

  const totalLessons = lessons.length;
  const pct = n => totalLessons ? (n / totalLessons * 100) : 0;
  const donePct = Math.round(pct(approved));
  const MARK = { approved: '✓', pending: '⏳', rejected: '✕', none: '' };

  const gridRows = sections.map(sec => {
    const wn   = weekNum(sec.title);
    const book = wn ? bookMap[wn] : null;
    const bookStatus = book ? readingMap[book.id] : undefined;
    const okCount = sec.lessons.filter(l => lectureMap[lectureKey(l)] === 'approved').length;

    // 요일별로 나눈다. 요일을 못 읽은 강의는 '월' 칸으로 몰지 않고 별도 처리.
    const byDay = {}; DAYS.forEach(d => byDay[d] = []);
    const noDay = [];
    sec.lessons.forEach(l => {
      const p = parseTitle(l.title);
      const st = lectureMap[lectureKey(l)] || 'none';
      const cell = { ...p, st, full: l.title, order: l.sort_order };
      if (p.day && byDay[p.day]) byDay[p.day].push(cell); else noDay.push(cell);
    });
    if (noDay.length) byDay['월'] = noDay.concat(byDay['월']);

    const dayCells = DAYS.map(d => {
      const items = byDay[d];
      if (!items.length) return '<td><div class="gc-day-empty">·</div></td>';
      const inner = items.map(it =>
        `<div class="gc-item s-${it.st}" title="${escHtml(it.order + '강 · ' + it.full)}">
           <span class="mk">${MARK[it.st] || ''}</span><span class="nm">${escHtml(it.name)}</span>
         </div>`).join('');
      return `<td><div class="gc-day">${inner}</div></td>`;
    }).join('');

    const chTotal = book ? (book.textbook_chapters || []).length : 0;
    const chDone  = book ? (readingCount[book.id]?.approved || 0) : 0;
    const bookMark = bookStatus === 'approved' ? '✓ ' : bookStatus === 'pending' ? '⏳ ' : bookStatus === 'rejected' ? '✕ ' : '';
    const bookCell = book
      ? `<span style="color:${chTotal && chDone === chTotal ? '#2D9B6F' : '#888'};font-weight:700;">${bookMark}</span>${escHtml(book.title)}`
        + (chTotal ? `<div style="color:#98a0a6;font-size:10px;margin-top:2px;font-variant-numeric:tabular-nums;">${chDone}/${chTotal}장</div>` : '')
      : '<span style="color:#c8ccd0;">미지정</span>';

    return `<tr>
      <td class="gc-g-week">${wn ? wn + '주차' : '기타'}<small>${okCount}/${sec.lessons.length}</small></td>
      ${dayCells}
      <td class="gc-g-book">${bookCell}</td>
    </tr>`;
  }).join('');

  document.getElementById('gc-overview').innerHTML = `
    <div class="gc-ov-head">
      <div class="gc-ov-title">주차별 진행 현황</div>
      <div class="gc-ov-pct"><b>${donePct}%</b> · ${approved}/${totalLessons}강 완료</div>
    </div>
    <div class="gc-bar">
      <i class="b-approved" style="width:${pct(approved)}%"></i>
      <i class="b-pending"  style="width:${pct(pending)}%"></i>
      <i class="b-rejected" style="width:${pct(rejected)}%"></i>
    </div>
    <div class="gc-grid-wrap">
      <table class="gc-grid">
        <thead><tr><th>주차</th>${DAYS.map(d => `<th>${d}</th>`).join('')}<th>필독서</th></tr></thead>
        <tbody>${gridRows}</tbody>
      </table>
    </div>
    <div class="gc-legend">
      <span><i style="background:#2D9B6F"></i>완료</span>
      <span><i style="background:#eab308"></i>승인 대기</span>
      <span><i style="background:#ef4444"></i>반려</span>
      <span><i style="background:#e3e6e8"></i>미제출</span>
      <span style="color:#aaa;">칸에 마우스를 올리면 전체 강의명이 보입니다</span>
    </div>`;
  document.getElementById('gc-detail-toggle').hidden = false;

  // ── 표 그리기 ──
  // 한 행 = 한 강의. 주차는 첫 행에만 rowspan 으로 묶고, 필독서도 주차당 한 칸.
  let rows = '';
  sections.forEach(sec => {
    const wn = weekNum(sec.title);
    const book = wn ? bookMap[wn] : null;
    const bookStatus = book ? readingMap[book.id] : undefined;
    const span = sec.lessons.length || 1;
    const secName = escHtml(sec.title.replace(/^\d+주차\s*[—–-]\s*/, ''));

    const chTot = book ? (book.textbook_chapters || []).length : 0;
    const chOk  = book ? (readingCount[book.id]?.approved || 0) : 0;
    const bookCell = book
      ? `<div class="gc-td-book-title">${escHtml(book.title)}</div>`
        + (chTot ? `<div style="font-size:11px;color:#888;margin:2px 0 4px;">${chOk}/${chTot}장 완료</div>` : '')
        + bookBadgeHtml(bookStatus)
      : `<span class="gc-book-none">미지정</span>`;

    sec.lessons.forEach((l, i) => {
      const st = statusLabel(lectureMap[lectureKey(l)]);
      rows += `<tr class="${i === 0 ? 'gc-week-start' : ''}">`;
      if (i === 0) {
        rows += `<td class="gc-td-week" rowspan="${span}">
                   <div class="gc-week-num">${wn ? wn + '주차' : '—'}</div>
                   <div class="gc-week-name">${secName}</div>
                 </td>`;
      }
      rows += `<td class="gc-td-no">${l.sort_order ?? ''}</td>
               <td class="gc-td-title">${escHtml(l.title)}</td>
               <td class="gc-td-status">${badgeHtml(lectureMap[lectureKey(l)])}</td>`;
      if (i === 0) rows += `<td class="gc-td-book" rowspan="${span}">${bookCell}</td>`;
      rows += `</tr>`;
    });
  });

  document.getElementById('gc-body').innerHTML = rows
    ? `<div class="gc-table-wrap">
         <table class="gc-table">
           <thead><tr>
             <th style="width:150px;">주차</th>
             <th style="width:44px;">#</th>
             <th>강의</th>
             <th style="width:150px;">강의노트</th>
             <th style="width:190px;">필독서 · 독서노트</th>
           </tr></thead>
           <tbody>${rows}</tbody>
         </table>
       </div>`
    : '<div class="gc-error">강의 정보를 찾을 수 없습니다.</div>';

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
