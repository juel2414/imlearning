<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 아이엠러닝</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    body { background: #F4F5F6; min-height: 100vh; margin: 0; }
    .auth-wrap { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 2.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .auth-logo-text { font-size: 22px; font-weight: 800; color: #111; letter-spacing: -0.5px; text-align: center; }
    .auth-logo-text span { color: #2D9B6F; }
    .auth-title { font-size: 20px; font-weight: 700; color: #111; text-align: center; margin: 1.5rem 0 6px; }
    .auth-desc { font-size: 13px; color: #888; text-align: center; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: #111; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: #2D9B6F; }

    .submit-btn { width: 100%; padding: 13px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
    .submit-btn:disabled { background: #C4C4C4; cursor: not-allowed; }

    .divider { display: flex; align-items: center; gap: 10px; margin: 1.5rem 0; }
    .divider-line { flex: 1; height: 1px; background: rgba(0,0,0,0.08); }
    .divider-text { font-size: 12px; color: #888; white-space: nowrap; }

    .social-btn { width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; border: 1.5px solid rgba(0,0,0,0.1); background: #fff; color: #3D3D3D; box-sizing: border-box; transition: opacity .15s; }
    .social-btn.kakao { background: #FEE500; border-color: #FEE500; color: #191919; }
    .social-btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .social-icon { width: 18px; height: 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }

    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 13px; color: #888; }
    .auth-footer a { color: #2D9B6F; font-weight: 600; text-decoration: none; }

    .error-msg { display: none; background: #FEE2E2; color: #EF4444; font-size: 12px; padding: 10px 12px; border-radius: 8px; margin-bottom: 1rem; }
    .error-msg.show { display: block; }

    .remember-row { display: flex; align-items: center; gap: 8px; margin: 0.75rem 0 1rem; }
    .remember-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #2D9B6F; cursor: pointer; flex-shrink: 0; }
    .remember-row label { font-size: 13px; color: #555; cursor: pointer; user-select: none; }

    .top-logo-bar { padding: 1.25rem 2rem; }
    .top-logo-bar a { font-size: 18px; font-weight: 800; color: #111; text-decoration: none; }
    .top-logo-bar a span { color: #2D9B6F; }
  </style>
</head>
<body>

<div class="top-logo-bar">
  <a href="index.html">아이엠<span>러닝</span></a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <img src="images/logo-vertical.png" alt="아이엠러닝" style="height:90px;width:auto;display:block;margin:0 auto 0.5rem;">
    <div class="auth-title">로그인</div>
    <div class="auth-desc">배움이 시작되는 곳에서 다시 만나요</div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input" type="email" id="email" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" type="password" id="password" placeholder="비밀번호 입력" required>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="remember-me">
        <label for="remember-me">이메일 저장</label>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">로그인하기</button>
    </form>

    <div style="text-align:right;margin:8px 0 0;">
      <a href="reset-password.html" style="font-size:12px;color:#888;text-decoration:none;">비밀번호를 잊으셨나요?</a>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">또는 소셜 계정으로 로그인</div>
      <div class="divider-line"></div>
    </div>

    <button class="social-btn" id="google-btn">
      <svg class="social-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C40.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      구글로 로그인
    </button>
    <button class="social-btn kakao" id="kakao-btn">
      <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#191919" d="M12 3C6.477 3 2 6.477 2 10.8c0 2.764 1.827 5.197 4.572 6.6-.2.74-.726 2.69-.832 3.107-.13.516.19.51.4.37.165-.11 2.62-1.78 3.687-2.5.7.103 1.426.156 2.173.156 5.523 0 10-3.477 10-7.733C22 6.477 17.523 3 12 3z"/>
      </svg>
      카카오로 로그인
    </button>

    <div class="auth-footer">
      아직 계정이 없으신가요? <a href="signup.html">회원가입</a>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script>
var REDIRECT_URL = window.location.origin + window.location.pathname.replace(/login\.html.*$/, 'index.html');
var _nextParam = new URLSearchParams(window.location.search).get('next') || '';
var _nextUrl = (_nextParam && !_nextParam.startsWith('//') && !_nextParam.startsWith('http')) ? _nextParam : null;

// 저장된 이메일 불러오기
(function () {
  var saved = localStorage.getItem('iml_saved_email');
  if (saved) {
    document.getElementById('email').value = saved;
    document.getElementById('remember-me').checked = true;
  }
})();

function showError(msg) {
  var el = document.getElementById('error-msg');
  el.innerHTML = '❌ ' + msg;
  el.classList.add('show');
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function setSocialBtn(btn, loading) {
  if (loading) {
    btn.disabled = true;
    btn._html = btn.innerHTML;
    btn.innerHTML = '<span class="spin"></span> 연결 중...';
  } else {
    btn.disabled = false;
    if (btn._html) btn.innerHTML = btn._html;
  }
}

// OAuth 콜백 에러 감지 (Supabase가 에러와 함께 돌아온 경우)
(function () {
  var raw = window.location.hash + '&' + window.location.search;
  var em = raw.match(/[#?&]error=([^&]+)/);
  if (!em) return;
  var code = decodeURIComponent(em[1]);
  var dm = raw.match(/error_description=([^&]+)/);
  var desc = dm ? decodeURIComponent(dm[1]).replace(/\+/g, ' ') : '';
  var map = {
    provider_not_found: 'Google/카카오 로그인이 아직 설정되지 않았습니다. 이메일로 로그인해주세요.',
    access_denied: '로그인이 취소되었습니다.',
    server_error: '서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.',
  };
  window.addEventListener('DOMContentLoaded', function () {
    showError(map[code] || desc || '소셜 로그인 오류 (' + code + ')');
    history.replaceState(null, '', window.location.pathname);
  });
})();

document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  document.getElementById('error-msg').classList.remove('show');
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '로그인 중...';
  try {
    var rememberMe = document.getElementById('remember-me').checked;
    if (rememberMe) {
      localStorage.setItem('iml_saved_email', email);
    } else {
      localStorage.removeItem('iml_saved_email');
    }
    var result = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
    if (result.error) {
      var msg = result.error.message;
      showError(
        msg === 'Invalid login credentials' ? '이메일 또는 비밀번호가 올바르지 않습니다' :
        (msg === 'Email not confirmed' || msg.includes('not confirmed')) ? '이메일 인증이 필요합니다. 가입 시 발송된 확인 메일을 클릭해주세요.' :
        msg
      );
      btn.disabled = false;
      btn.textContent = '로그인하기';
      return;
    }
    window.location.href = _nextUrl || 'index.html';
  } catch (err) {
    showError('로그인 중 오류가 발생했습니다. 다시 시도해주세요.');
    btn.disabled = false;
    btn.textContent = '로그인하기';
  }
});

document.getElementById('google-btn').addEventListener('click', async function () {
  var btn = this;
  setSocialBtn(btn, true);
  try {
    var result = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: REDIRECT_URL }
    });
    if (result.error) {
      showError('구글 로그인을 사용할 수 없습니다.<br>Supabase 대시보드에서 Google Provider 설정이 필요합니다.');
      setSocialBtn(btn, false);
    }
    // 성공 시 브라우저가 리다이렉트하므로 버튼 유지
  } catch (e) {
    showError('구글 로그인 오류: ' + e.message);
    setSocialBtn(btn, false);
  }
});

document.getElementById('kakao-btn').addEventListener('click', async function () {
  var btn = this;
  setSocialBtn(btn, true);
  try {
    var result = await supabaseClient.auth.signInWithOAuth({
      provider: 'kakao',
      options: { redirectTo: REDIRECT_URL, scopes: 'profile_nickname profile_image' }
    });
    if (result.error) {
      showError('카카오 로그인을 사용할 수 없습니다.<br>Supabase 대시보드에서 Kakao Provider 설정이 필요합니다.');
      setSocialBtn(btn, false);
    }
  } catch (e) {
    showError('카카오 로그인 오류: ' + e.message);
    setSocialBtn(btn, false);
  }
});
</script>
</body>
</html>
