<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — 아이엠러닝</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    body { background: #F4F5F6; min-height: 100vh; margin: 0; }
    .auth-wrap { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 2.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .auth-logo-text { font-size: 22px; font-weight: 800; color: #111; letter-spacing: -0.5px; text-align: center; }
    .auth-logo-text span { color: #2D9B6F; }
    .auth-title { font-size: 20px; font-weight: 700; color: #111; text-align: center; margin: 1.5rem 0 6px; }
    .auth-desc { font-size: 13px; color: #888; text-align: center; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: #111; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: #2D9B6F; }

    .submit-btn { width: 100%; padding: 13px; background: #2D9B6F; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
    .submit-btn:disabled { background: #C4C4C4; cursor: not-allowed; }

    .divider { display: flex; align-items: center; gap: 10px; margin: 1.5rem 0; }
    .divider-line { flex: 1; height: 1px; background: rgba(0,0,0,0.08); }
    .divider-text { font-size: 12px; color: #888; white-space: nowrap; }

    .social-btn { width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; border: 1.5px solid rgba(0,0,0,0.1); background: #fff; color: #3D3D3D; box-sizing: border-box; }
    .social-btn.kakao { background: #FEE500; border-color: #FEE500; color: #191919; }
    .social-icon { width: 18px; height: 18px; }

    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 13px; color: #888; }
    .auth-footer a { color: #2D9B6F; font-weight: 600; text-decoration: none; }

    .error-msg { display: none; background: #FEE2E2; color: #EF4444; font-size: 12px; padding: 10px 12px; border-radius: 8px; margin-bottom: 1rem; }
    .error-msg.show { display: block; }
    .success-msg { display: none; background: #DCFCE7; color: #16A34A; font-size: 13px; padding: 14px; border-radius: 8px; margin-bottom: 1rem; text-align: center; line-height: 1.6; }
    .success-msg.show { display: block; }

    .terms-check { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 1.25rem; font-size: 12px; color: #555; }
    .terms-check input { margin-top: 2px; }

    .top-logo-bar { padding: 1.25rem 2rem; }
    .top-logo-bar a { font-size: 18px; font-weight: 800; color: #111; text-decoration: none; }
    .top-logo-bar a span { color: #2D9B6F; }
  </style>
</head>
<body>

<div class="top-logo-bar">
  <a href="index.html">아이엠<span>러닝</span></a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <img src="images/logo-vertical.png" alt="아이엠러닝" style="height:90px;width:auto;display:block;margin:0 auto 0.5rem;">
    <div class="auth-title">회원가입</div>
    <div class="auth-desc">아이엠러닝과 함께 배움을 시작해보세요</div>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg">
      ✅ 회원가입이 완료되었습니다!<br>
      <span style="font-size:12px;">잠시 후 로그인 페이지로 이동합니다.</span>
    </div>

    <form id="signup-form">
      <div class="form-group">
        <label class="form-label">이름</label>
        <input class="form-input" type="text" id="name" placeholder="홍길동" required>
      </div>
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input" type="email" id="email" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">전화번호</label>
        <input class="form-input" type="tel" id="phone" placeholder="010-1234-5678" required>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" type="password" id="password" placeholder="8자 이상 입력해주세요" minlength="8" required>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호 확인</label>
        <input class="form-input" type="password" id="password-confirm" placeholder="비밀번호를 다시 입력해주세요" minlength="8" required>
      </div>

      <div class="terms-check">
        <input type="checkbox" id="terms" required>
        <label for="terms">이용약관 및 개인정보처리방침에 동의합니다 (필수)</label>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">회원가입하기</button>
    </form>

    <div class="divider" id="divider">
      <div class="divider-line"></div>
      <div class="divider-text">또는 소셜 계정으로 가입</div>
      <div class="divider-line"></div>
    </div>

    <button class="social-btn" id="google-btn">
      <svg class="social-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C40.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      구글로 가입하기
    </button>
    <button class="social-btn kakao" id="kakao-btn">
      <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#191919" d="M12 3C6.477 3 2 6.477 2 10.8c0 2.764 1.827 5.197 4.572 6.6-.2.74-.726 2.69-.832 3.107-.13.516.19.51.4.37.165-.11 2.62-1.78 3.687-2.5.7.103 1.426.156 2.173.156 5.523 0 10-3.477 10-7.733C22 6.477 17.523 3 12 3z"/>
      </svg>
      카카오로 가입하기
    </button>

    <div class="auth-footer">
      이미 계정이 있으신가요? <a href="login.html">로그인</a>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script>
function showError(msg) {
  var el = document.getElementById('error-msg');
  el.textContent = '❌ ' + msg;
  el.classList.add('show');
}

// 흔한 도메인 오타. 서버가 이메일을 거절했을 때 "혹시 이거 아닌가요?"로만 쓴다.
var DOMAIN_TYPOS = {
  'gamil.com': 'gmail.com', 'gmial.com': 'gmail.com', 'gmai.com': 'gmail.com',
  'gnail.com': 'gmail.com', 'gmail.co': 'gmail.com', 'gmaill.com': 'gmail.com',
  'naver.co': 'naver.com', 'navar.com': 'naver.com', 'nver.com': 'naver.com',
  'hanmail.ne': 'hanmail.net', 'daum.ne': 'daum.net', 'nate.co': 'nate.com',
  'hotmail.co': 'hotmail.com', 'outlook.co': 'outlook.com', 'icloud.co': 'icloud.com'
};

// 슈퍼베이스 auth 오류 메시지를 한국어로 바꾼다. 영어 원문이 그대로 노출되면
// 수강생이 무엇을 고쳐야 하는지 알 수 없다.
function authErrorKo(raw, email) {
  var m = String(raw || '');
  if (/user already registered/i.test(m))
    return '이미 가입된 이메일입니다. 로그인하시거나 "비밀번호를 잊으셨나요?"를 이용해주세요';
  if (/email address .* is invalid|unable to validate email|invalid format/i.test(m)) {
    var domain  = (email.split('@')[1] || '').toLowerCase();
    var suggest = DOMAIN_TYPOS[domain];
    return suggest
      ? '이메일 주소를 다시 확인해주세요 — 혹시 @' + suggest + ' 아닌가요?'
      : '이메일 주소가 올바르지 않습니다. 오타가 있는지 확인해주세요';
  }
  if (/password should be at least/i.test(m)) return '비밀번호는 8자 이상이어야 합니다';
  if (/rate limit|only request this after/i.test(m)) return '요청이 너무 많습니다. 잠시 후 다시 시도해주세요';
  if (/signups? (is |are )?(not allowed|disabled)/i.test(m)) return '현재 회원가입이 제한되어 있습니다. 문의해주세요';
  console.error('[signup] 처리되지 않은 오류:', m);
  return '회원가입 중 오류가 발생했습니다. 입력 내용을 다시 확인해주세요';
}

document.getElementById('signup-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  document.getElementById('error-msg').classList.remove('show');

  var name = document.getElementById('name').value.trim();
  var email = document.getElementById('email').value.trim();
  var phone = document.getElementById('phone').value.trim();
  var password = document.getElementById('password').value;
  var passwordConfirm = document.getElementById('password-confirm').value;

  if (password !== passwordConfirm) { showError('비밀번호가 일치하지 않습니다'); return; }
  if (password.length < 8) { showError('비밀번호는 8자 이상이어야 합니다'); return; }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '가입 처리 중...';

  try {
    var result = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: { data: { name: name, phone: phone } }
    });

    if (result.error) {
      showError(authErrorKo(result.error.message, email));
      btn.disabled = false;
      btn.textContent = '회원가입하기';
      return;
    }

    // 이미 가입된 이메일이면 슈퍼베이스는 계정 존재를 숨기려고 오류 대신
    // identities가 빈 user를 돌려준다. 이때 성공 화면을 띄우면 수강생은
    // 가입된 줄 알고 로그인 화면에 갔다가 로그인에 실패한다. 특히 구글로
    // 가입한 계정은 비밀번호가 없어 영영 못 들어간다.
    var u = result.data.user;
    if (u && Array.isArray(u.identities) && u.identities.length === 0) {
      showError('이미 가입된 이메일입니다. 로그인하시거나 "비밀번호를 잊으셨나요?"를 이용해주세요');
      btn.disabled = false;
      btn.textContent = '회원가입하기';
      return;
    }

    // 프로필 행은 auth.users 트리거(handle_new_user)가 서버에서 자동 생성함.
    // 이름/전화번호는 위 signUp의 options.data(metadata)로 전달되어 트리거가 채움.
    sendEmail('welcome', { email: email, name: name });

    document.getElementById('signup-form').style.display = 'none';
    document.getElementById('divider').style.display = 'none';
    document.getElementById('google-btn').style.display = 'none';
    document.getElementById('kakao-btn').style.display = 'none';
    document.getElementById('success-msg').classList.add('show');

    setTimeout(function () { window.location.href = 'login.html'; }, 2500);

  } catch (err) {
    showError('회원가입 중 오류가 발생했습니다. 다시 시도해주세요.');
    btn.disabled = false;
    btn.textContent = '회원가입하기';
  }
});

document.getElementById('google-btn').addEventListener('click', async function () {
  var result = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname.replace('signup.html', 'index.html') }
  });
  if (result.error) showError('구글 로그인 중 오류가 발생했습니다');
});

document.getElementById('kakao-btn').addEventListener('click', async function () {
  var result = await supabaseClient.auth.signInWithOAuth({
    provider: 'kakao',
    options: { redirectTo: window.location.origin + window.location.pathname.replace('signup.html', 'index.html') }
  });
  if (result.error) showError('카카오 로그인 중 오류가 발생했습니다');
});
</script>
</body>
</html>
