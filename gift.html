<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 이 페이지는 어두운 배경으로 만들었다. 이 선언이 없으면 브라우저의
     다크 모드가 색을 한 번 더 뒤집어, 크림색 교환권이 검게 나오고 금색
     버튼이 갈색이 된다. 이미 어둡다고 알려 손대지 않게 한다. -->
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선물 받기 — 아이엠러닝</title>
<link rel="stylesheet" href="css/style.css">
<style>
.gift-page-wrap {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1rem;
  background: #080f0b;
}
.gift-card-outer { width: 100%; max-width: 400px; }

/* ── 로딩 스피너 ── */
.gift-spinner-dark {
  width: 36px; height: 36px;
  border: 2.5px solid #1c2f26;
  border-top-color: #c9a252;
  border-radius: 50%;
  animation: gSpin .8s linear infinite;
  margin: 4rem auto;
}
@keyframes gSpin { to { transform: rotate(360deg); } }

/* ── 공통 카드 ── */
.g-dark-card {
  background: #0f1a15;
  border: 0.5px solid #24382e;
  border-radius: 16px;
  padding: 36px 24px;
  text-align: center;
}

/* ── 화면 A: 봉투 ─────────────────────────────────────────────────
   이모지 대신 진짜 봉투를 그린다. 뚜껑이 위쪽 모서리를 축으로 젖혀지면서
   열리고, 그 사이로 티켓 끝이 살짝 보였다가 올라온다. */
.gift-env-visual {
  position: relative; width: 132px; height: 90px;
  margin: 0 auto 20px; perspective: 560px;
}
.gev-body {
  position: absolute; inset: 0;
  /* 안쪽. 덮개가 열리면 이 밝은 초록이 드러난다.
     위가 밝고 아래로 갈수록 그늘이 져야 속이 깊어 보인다 */
  background: linear-gradient(180deg,#35AC7D 0%,#2D9B6F 45%,#1F7350 100%);
  border-radius: 9px;
  box-shadow: inset 0 -10px 14px -8px rgba(11,42,29,.55);
}
/* 봉투 속에서 올라오는 종이 끝 */
.gev-paper {
  /* 크기는 카톡 카드의 편지와 같은 비율로 맞춘다.
     봉투 폭의 79%, 높이는 봉투와 같다 */
  /* 봉투(90px) 밖으로 나가지 않아야 한다. 내려가 있는 상태(+16px)에서도
     아래끝이 봉투를 넘으면 편지가 봉투 밑으로 삐져나온다 */
  position: absolute; left: 14px; right: 14px; top: 6px;
  height: 72px; border-radius: 5px;
  /* 종이는 비워 둔다. 무늬가 있으면 빛과 겹쳐 지저분해진다 */
  background:
    linear-gradient(180deg, rgba(32,64,47,0) 62%, rgba(32,64,47,.18) 100%),
    #FFFDFA;
  transform: translateY(16px); opacity: 0;
  transition: transform .5s cubic-bezier(.16,1,.3,1) .18s, opacity .25s .18s;
  will-change: transform, opacity;
}
/* 앞면이 종이를 가려야 "안에서 나온다" 로 보인다 */
.gev-front {
  position: absolute; left: 0; right: 0; bottom: 0; height: 71px;
  background:
    /* 좌우로 접히며 지는 그늘 */
    linear-gradient(90deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,0) 42%,
                           rgba(0,0,0,0) 58%, rgba(0,0,0,.10) 100%),
    linear-gradient(180deg,#2C5F46 0%,#1D422F 100%);
  border-radius: 0 0 9px 9px;
  clip-path: polygon(0 0, 50% 70%, 100% 0, 100% 100%, 0 100%);
}
.gev-flap {
  position: absolute; left: 0; right: 0; top: 0; height: 44px;
  background: linear-gradient(180deg,#2A8F66 0%,#33A578 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transition: transform .55s cubic-bezier(.6,-0.28,.5,1.3);
  border-radius: 8px 8px 0 0;
  will-change: transform;
}
/* ── 봉투에서 터져 나오는 빛 ──────────────────────────────────
   빛살(뒤)과 번짐(앞) 두 겹이다. 한 겹만으로는 밝기만 오르고
   무엇이 빛나는지 읽히지 않는다.

   휴대폰에서 끊기지 않게 하는 것이 여기서는 모양만큼 중요하다.
   mix-blend-mode 는 층을 합성기에서 내려 프레임마다 본체에서 그리게 만든다.
   빛이 거의 흰색이라 어두운 배경 위에서는 screen 과 보통 겹침의 결과가
   사실상 같으므로, 값이 아니라 비용만 버린 셈이다. */
.gev-rays, .gev-bloom {
  position: absolute; left: 50%; top: 26px;
  width: 300px; height: 300px; margin: -150px 0 0 -150px;
  opacity: 0; pointer-events: none;
  /* 미리 층으로 올려 둔다. 누른 순간 그리기가 시작되면 첫 프레임이 튄다 */
  will-change: transform, opacity;
}
.gev-rays {
  /* conic-gradient 두 겹과 mask 는 크기가 바뀔 때마다 다시 그려진다.
     한 장으로 구워 두면 GPU 가 크기와 각도만 바꾼다 */
  background: url("images/gift-rays.png") center / contain no-repeat;
}
.gev-bloom {
  background: radial-gradient(circle,
    rgba(255,253,240,.95) 0%, rgba(255,242,198,.52) 16%,
    rgba(255,226,142,.20) 36%, rgba(255,216,120,0) 66%);
}

/* 덮개 끝을 봉하는 밀랍. 덮개의 꼭짓점(가운데, 위에서 44px)에 물린다 */
.gev-seal {
  position: absolute; left: 50%; top: 44px; width: 44px; height: 44px;
  margin: -22px 0 0 -22px;
  transform-origin: 50% 30%;
  transition: transform .3s cubic-bezier(.4,0,1,1), opacity .18s ease;
  pointer-events: none;
  will-change: transform, opacity;
}

/* 열림 */
.gift-env-visual.open .gev-flap  { transform: rotateX(-168deg); }
.gift-env-visual.open .gev-paper { transform: translateY(-30px); opacity: 1; }
/* 카드가 물러나기 시작하는 .35s 에 빛이 가장 세야 한다.
   그보다 늦게 터지면 절정을 못 보고 화면이 넘어간다. */
.gift-env-visual.open .gev-rays  { animation: gRays  1.0s cubic-bezier(.16,1,.3,1) .16s both; }
.gift-env-visual.open .gev-bloom { animation: gBloom  .9s cubic-bezier(.16,1,.3,1) .16s both; }
/* 편지도 빛을 받아 하얗게 달아오른다 */
.gift-env-visual.open .gev-paper { box-shadow: 0 0 26px 7px rgba(255,238,178,.55); }
@keyframes gRays {
  0%   { opacity: 0;   transform: scale(.18) rotate(-16deg); }
  26%  { opacity: .95; }
  100% { opacity: .42; transform: scale(1) rotate(12deg); }
}
@keyframes gBloom {
  0%   { opacity: 0;  transform: scale(.2); }
  24%  { opacity: 1;  transform: scale(.9); }
  100% { opacity: .6; transform: scale(1.1); }
}

/* 덮개가 젖혀지면 봉인이 떨어져 나간다 */
.gift-env-visual.open .gev-seal  {
  transform: translateY(15px) rotate(-30deg) scale(.8); opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
  .gev-flap, .gev-paper { transition: none; }
  /* 떨어지는 움직임은 빼고 사라지기만 한다 */
  .gev-seal { transition: opacity .3s ease !important; }
  .gift-env-visual.open .gev-seal { transform: none; opacity: 0; }
  /* 빛은 커지거나 돌지 않고 밝아지기만 한다 */
  .gift-env-visual.open .gev-rays  { animation: gLightFade .5s ease .16s both; }
  .gift-env-visual.open .gev-bloom { animation: gLightFade .5s ease .16s both; }
  @keyframes gLightFade { from { opacity: 0; } to { opacity: .55; } }
}

/* 봉투 카드가 물러나고 교환권이 올라온다 */
#screen-a.gift-leaving {
  animation: gEnvLeave .45s cubic-bezier(.4,0,1,1) .35s both;
}
@keyframes gEnvLeave { to { opacity: 0; transform: translateY(-14px) scale(.97); } }

.gift-voucher.gift-rising {
  animation: gVoucherRise .6s cubic-bezier(.16,1,.3,1) both;
}
@keyframes gVoucherRise {
  from { opacity: 0; transform: translateY(46px) scale(.94); }
  to   { opacity: 1; transform: none; }
}
/* 동작 줄이기: 자리를 옮기는 움직임은 빼고 밝기만 바꾼다. 화면이 흔들려
   어지러운 것을 막자는 설정이지 전환 자체를 없애자는 뜻은 아니다. */
#screen-a.gift-leaving-soft { animation: gEnvFade .3s ease .12s both; }
@keyframes gEnvFade { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  #screen-a.gift-leaving { animation: gEnvFade .3s ease .12s both; }
  .gift-voucher.gift-rising { animation: gVoucherFade .35s ease both; }
  @keyframes gVoucherFade { from { opacity: 0; } to { opacity: 1; } }
  /* 뚜껑은 열리는 것을 보여준다. 위치가 아니라 각도만 바뀌어 어지럽지 않다. */
  .gev-flap { transition: transform .35s ease !important; }
  .gev-paper { transition: opacity .3s ease .15s !important; }
}

/* 파티클은 화면 전체에 뿌리되 클릭을 막지 않는다 */
#gift-confetti {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 60;
}
.gift-env-label {
  font-size: 10px; letter-spacing: 2px; color: #8fae9c;
  margin-bottom: 12px; text-transform: uppercase;
}
.gift-env-title {
  font-size: 16px; font-weight: 700; color: #f0f3f1;
  line-height: 1.55; margin-bottom: 20px;
}
.gift-env-msg {
  background: #16241d; border-radius: 10px;
  padding: 14px 18px; font-size: 13px; color: #c8d8cc;
  line-height: 1.7; text-align: left;
  margin-bottom: 20px; font-style: italic;
}
.gift-env-btn {
  width: 100%; padding: 14px;
  background: #c9a252; color: #1c1406;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: opacity .15s;
}
.gift-env-btn:hover { opacity: .9; }

/* ── 화면 B: 교환권 카드 ── */
/* ── 선물 교환권 ────────────────────────────────────────────────────
   받는 사람이 보는 화면이다. 교환권을 주머니에 꽂아 둔 모양으로 만든다.
   위쪽 표에는 무엇을 받았는지, 아래 주머니에는 유효기간과 받기 버튼.
   주머니가 표의 아랫부분을 덮어야 "꽂혀 있다" 는 느낌이 난다. */
.gift-voucher { position: relative; }
/* 교환권 위쪽. 라벨만 덩그러니 있어 허전했다. 봉인 도장 같은 엠블럼과
   양옆 선을 두고, 누가 보냈는지를 적는다. 장식만 늘리는 대신 알아야 할
   정보를 함께 올린다. */
.gift-voucher-head { text-align: center; margin-bottom: 16px; }
.gv-seal {
  width: 46px; height: 46px; margin: 0 auto 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #3FBF8C 0%, #2D9B6F 55%, #23815C 100%);
  box-shadow: 0 0 0 4px rgba(45,155,111,.16), 0 6px 16px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
}
.gv-seal svg { width: 24px; height: 24px; display: block; }
.gift-voucher-label {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 10px; letter-spacing: 2.5px; font-weight: 700;
  color: #8fae9c; text-transform: uppercase;
}
.gift-voucher-label::before, .gift-voucher-label::after {
  content: ''; height: 1px; width: 34px;
  background: linear-gradient(90deg, transparent, #3a5a49);
}
.gift-voucher-label::after { transform: scaleX(-1); }
.gv-from {
  margin-top: 8px; font-size: 13px; color: #cfe0d5; line-height: 1.5;
}
.gv-from b { color: #fff; font-weight: 700; }

/* ── PC 에서는 교환권을 크게 ──────────────────────────────────────
   좁은 화면 기준으로 만든 크기를 그대로 두면 넓은 화면에서 초라해 보인다. */
@media (min-width: 720px) {
  .gift-card-outer { max-width: 470px; }
  .gv-seal { width: 56px; height: 56px; font-size: 25px; }
  .gift-voucher-label { font-size: 11px; }
  .gift-voucher-label::before, .gift-voucher-label::after { width: 44px; }
  .gv-from { font-size: 14.5px; }
  .gift-ribbon { padding: 20px 20px 42px; }
  .gift-ribbon-thumb { border-radius: 13px; margin-bottom: 16px; }
  .gift-ribbon-title { font-size: 23px; }
  .gift-code-row { padding: 22px 24px 46px; }
  .gift-code-val { font-size: 15.5px; }
  .gift-expiry { font-size: 12.5px; }
  .gift-action-col { padding: 22px 20px 20px; border-radius: 22px; }
  .gift-pocket-note { font-size: 14px; }
  .gift-action-btn { padding: 16px; font-size: 16px; border-radius: 14px; }
}
@media (min-width: 1080px) {
  .gift-card-outer { max-width: 540px; }
  .gv-seal { width: 64px; height: 64px; }
  .gv-seal svg { width: 30px; height: 30px; }
  .gift-ribbon-title { font-size: 26px; }
  .gift-code-val { font-size: 16px; }
}

/* 표 본체. 받는 사람이 제일 먼저 궁금한 것은 "뭘 받았지" 다.
   그래서 강좌가 주인공이고 코드는 아래에 작게 둔다. 링크를 눌러 들어온
   사람은 코드를 볼 일이 없고, 코드가 필요한 쪽은 직접 입력하는 사람이다. */
/* 쿠폰이 어디에 쓰이는지. 밝은 카드 위라 어두운 글자여야 읽힌다 */
.gift-coupon-scope {
  margin-top: 6px; font-size: 13px; font-weight: 600;
  color: #5C7566; letter-spacing: -0.01em;
}
@media (min-width: 480px) { .gift-coupon-scope { font-size: 14px; } }

.gift-ribbon {
  position: relative; z-index: 1;
  background: #FBF8F3; border-radius: 16px;
  padding: 16px 16px 34px;          /* 아래는 주머니에 가려질 여백 */
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  text-align: center;
}
.gift-ribbon-thumb {
  width: 100%; aspect-ratio: 16 / 9;
  border-radius: 11px; overflow: hidden;
  background: #D9E7DE;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; margin-bottom: 14px;
}
.gift-ribbon-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gift-ribbon-title {
  font-size: 19px; font-weight: 800; color: #14281D;
  line-height: 1.38; word-break: keep-all;
  padding: 0 4px;
}

/* 뜯는 선과 양옆 구멍 */
.gift-code-row {
  position: relative; z-index: 1;
  margin: -22px 0 0; padding: 20px 18px 38px;
  background: #FBF8F3;
  border-top: 1.5px dashed #E0D8CB;
  text-align: center;
}
.gift-code-row::before, .gift-code-row::after {
  content: ''; position: absolute; top: -11px; width: 22px; height: 22px;
  border-radius: 50%; background: #080f0b;
}
.gift-code-row::before { left: -11px; }
.gift-code-row::after  { right: -11px; }
.gift-code-label {
  display: block; font-size: 9.5px; letter-spacing: 1.6px; font-weight: 700;
  color: #A79C8C; text-transform: uppercase; margin-bottom: 5px;
}
.gift-code-val {
  display: block;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 14px; font-weight: 600; letter-spacing: 1.4px;
  color: #5C6B60; word-break: break-all; line-height: 1.3;
}
.gift-expiry { display: block; margin-top: 8px; font-size: 11.5px; color: #9a9083; }

/* 주머니. 표의 아랫부분을 덮어 꽂힌 것처럼 보이게 한다. */
.gift-action-col {
  position: relative; z-index: 2;
  margin-top: -18px;
  background: linear-gradient(180deg, #2D9B6F 0%, #23815C 100%);
  border-radius: 18px;
  padding: 18px 16px 16px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 14px 34px rgba(0,0,0,.4);
}
.gift-pocket-note {
  text-align: center; font-size: 12.5px; font-weight: 600;
  color: rgba(255,255,255,.9); letter-spacing: .2px;
}
.gift-action-btn {
  width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
  border-radius: 12px; cursor: pointer; font-family: inherit;
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);
  color: #fff; transition: background .15s;
}
.gift-action-btn:hover { background: rgba(255,255,255,.22); }
.gift-action-btn.gold {
  background: #FBF8F3; border: none;
  color: #14281D; font-weight: 800;
}
.gift-action-btn.gold:hover { background: #fff; }

/* ── 코드 입력 ── */
.gift-code-input-wrap {
  background: #0f1a15; border: 0.5px solid #24382e;
  border-radius: 16px; padding: 36px 24px; text-align: center;
}
.gift-code-input-wrap .gift-env-label { margin-bottom: 16px; }
.gift-code-input-row { display: flex; gap: 8px; margin-top: 4px; }
.gift-code-input {
  flex: 1; min-width: 0;
  padding: 12px 14px;
  background: #16241d; border: 0.5px solid #2a4438;
  border-radius: 10px; color: #e9d18f;
  font-size: 15px; font-family: monospace; letter-spacing: 1px;
  text-transform: uppercase; outline: none;
}
.gift-code-input:focus { border-color: #c9a252; }
.gift-code-input::placeholder { color: #3d5040; }
.gift-code-go {
  padding: 12px 18px; background: #c9a252; color: #1c1406;
  border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  white-space: nowrap;
}

/* ── 알림 메시지 ── */
.g-alert {
  margin-top: 12px; padding: 10px 14px; border-radius: 8px;
  font-size: 13px; line-height: 1.6;
}
.g-alert.err { background: rgba(239,68,68,.12); color: #fca5a5; border: 0.5px solid rgba(239,68,68,.25); }
.g-alert.warn { background: rgba(249,168,37,.08); color: #fcd34d; border: 0.5px solid rgba(249,168,37,.2); }

@media (max-width: 480px) {
  .g-dark-card, .gift-voucher, .gift-code-input-wrap { padding: 28px 18px 24px; }
}
</style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="navbar-logo">
      <img src="images/logo-horizontal.png" alt="아이엠러닝" style="height:38px;width:auto;display:block;">
    </a>
  </div>
</nav>

<div class="gift-page-wrap">
  <div class="gift-card-outer" id="gift-root">
    <div class="gift-spinner-dark"></div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-inner">

  // ── 파티클 ─────────────────────────────────────────────────────────
  // 위에서 촤르르 떨어지는 조각들. DOM 을 수백 개 만드는 대신 캔버스에
  // 그린다. 다 떨어지면 캔버스를 걷어내 화면에 아무것도 남기지 않는다.
  // 화면 전체 캔버스를 만드는 비용은 작지 않다. 빛이 터지는 도중에 만들면
  // 그 프레임이 통째로 밀린다. 봉투를 그릴 때 미리 만들어 둔다.
  var _confettiCv = null;
  function giftConfettiPrepare() {
    if (_confettiCv) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.createElement('canvas');
    cv.id = 'gift-confetti';
    document.body.appendChild(cv);
    // 크기까지 여기서 정해야 한다. width 를 나중에 넣으면 그때 버퍼를
    // 다시 잡느라, 미리 만들어 둔 뜻이 사라진다.
    giftConfettiSize(cv);
    cv.getContext('2d');
    _confettiCv = cv;
  }

  // 화면 전체를 매 프레임 지우고 그린다. 배율이 높을수록 픽셀이 제곱으로
  // 늘어난다. 조각은 작은 사각형이라 1.5 배면 충분하다.
  function giftConfettiDpr() { return Math.min(window.devicePixelRatio || 1, 1.5); }
  function giftConfettiSize(cv) {
    var dpr = giftConfettiDpr();
    var w = Math.round(window.innerWidth * dpr);
    var h = Math.round(window.innerHeight * dpr);
    // 배치가 끝나기 전에는 화면 크기를 엉뚱하게 보고하는 기기가 있다.
    // 그 값으로 잡으면 캔버스가 늘어나 조각이 커진다. 그냥 넘긴다.
    if (w < 2 || h < 2) return;
    // 크기가 같으면 건드리지 않는다. width 를 다시 넣는 순간 버퍼를 새로 잡아
    // 미리 만들어 둔 뜻이 사라진다.
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function giftConfetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    giftConfettiPrepare();
    var cv = _confettiCv;
    if (!cv) return;
    var ctx = cv.getContext('2d');

    // 휴대폰은 주소창이 접히면서 화면 높이가 바뀐다. 미리 잡아 둔 크기와
    // 어긋난 채로 그리면 캔버스가 늘어나 조각이 커 보인다. 시작할 때 한 번
    // 맞춰 준다. 그대로면 위에서 아무것도 다시 잡지 않는다.
    var W, H;
    function size() {
      giftConfettiSize(cv);
      W = window.innerWidth; H = window.innerHeight;
    }
    size();
    window.addEventListener('resize', size);

    var COLORS = ['#2D9B6F', '#5ECF96', '#C9A252', '#E9D18F', '#FBF8F3'];
    var bits = [];
    for (var i = 0; i < 90; i++) {
      bits.push({
        x: Math.random() * W,
        // 화면 바로 위 좁은 띠에서 출발한다. 너무 멀리서 뿌리면 상당수가
        // 화면에 들어오기도 전에 시간이 끝나 "촤르르" 가 보이지 않는다.
        y: -20 - Math.random() * 340,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        vy: 2.8 + Math.random() * 3.4,
        vx: -0.6 + Math.random() * 1.2,
        rot: Math.random() * Math.PI,
        vr: -0.09 + Math.random() * 0.18,
        color: COLORS[(Math.random() * COLORS.length) | 0],
      });
    }

    var start = performance.now();
    var LIFE = 4200;   // 이 시간이 지나면 서서히 사라진다

    // 탭을 뒤로 보내면 requestAnimationFrame 이 멈춘다. 그러면 정리하는
    // 코드까지 같이 멈춰 캔버스가 화면에 계속 남는다. 시간으로도 걷어낸다.
    var done = false;
    function cleanup() {
      if (done) return;
      done = true;
      window.removeEventListener('resize', size);
      if (cv.parentNode) cv.parentNode.removeChild(cv);
      _confettiCv = null;
    }
    setTimeout(cleanup, LIFE + 1500);

    function frame(now) {
      var t = now - start;
      ctx.clearRect(0, 0, W, H);

      var fade = t > LIFE - 900 ? Math.max(0, (LIFE - t) / 900) : 1;
      var alive = 0;

      for (var i = 0; i < bits.length; i++) {
        var b = bits[i];
        b.y += b.vy;
        b.x += b.vx + Math.sin((t / 600) + i) * 0.4;   // 좌우로 살랑이게
        b.rot += b.vr;
        if (b.y < H + 40) alive++;

        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.fillStyle = b.color;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }

      if (t < LIFE && alive > 0 && !done) requestAnimationFrame(frame);
      else cleanup();
    }
    requestAnimationFrame(frame);
  }

  // ── 화면 B: 교환권 카드 ──────────────────────────────────────────────────
  function showVoucher(gift, fade) {

      : '';

    // 비로그인 → 로그인 버튼
    // 로그인 → 등록 버튼 (doAccept 호출)
    if (!window._giftUser) {

      actionHtml = '<a href="login.html?next=' + encodeURIComponent(nextUrl) + '" class="gift-action-btn gold" style="display:block;text-decoration:none;text-align:center;">로그인하고 받기</a>';
    } else {
      actionHtml = '<button class="gift-action-btn gold" id="accept-btn">내 강의실에 등록하기</button>';
    }

    var html = [
      '<div class="gift-voucher' + (fade ? ' gift-rising' : '') + '" id="screen-b">',
      '  <div class="gift-voucher-head">',
      '    <div class="gv-seal">',
      '      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">',
      '        <rect x="2.6" y="7.7" width="18.8" height="4" rx="1.2" stroke="#fff" stroke-width="1.7"/>',
      '        <path d="M4.2 11.7h15.6v8.1a1.3 1.3 0 0 1-1.3 1.3H5.5a1.3 1.3 0 0 1-1.3-1.3v-8.1Z" stroke="#fff" stroke-width="1.7"/>',
      '        <path d="M12 7.7V21.1" stroke="#fff" stroke-width="1.7"/>',
      '        <path d="M12 7.7S10.5 3.2 8.4 3.2a2.25 2.25 0 0 0 0 4.5H12Zm0 0s1.5-4.5 3.6-4.5a2.25 2.25 0 0 1 0 4.5H12Z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>',
      '      </svg>',
      '    </div>',
      '    <div class="gift-voucher-label">GIFT VOUCHER</div>',
      (gift.sender_name
        ? '    <div class="gv-from"><b>' + esc(gift.sender_name) + '</b>님이 보낸 선물이에요</div>'
        : ''),
      '  </div>',
      '  <div class="gift-ribbon">',
      '    <div class="gift-ribbon-thumb">' + thumbHtml + '</div>',
      '    <div class="gift-ribbon-title">' + esc(gift.course_title) + '</div>',
      '  </div>',
      '  <div class="gift-code-row">',
      '    <span class="gift-code-label">교환 코드</span>',
      '    <span class="gift-code-val">' + esc(gift.gift_code || giftCode) + '</span>',
      '  </div>',
      '  <div class="gift-action-col">',

      actionHtml,
      lockNotice,
      '  </div>',
      '</div>',
    ].join('');

    root.innerHTML = html;

    // 애니메이션은 클래스가 붙는 순간 시작된다. 따로 손댈 것이 없다.

    var acceptBtn = document.getElementById('accept-btn');
    if (acceptBtn) acceptBtn.addEventListener('click', doAccept);
  }

  // ── 알림 메시지 ──────────────────────────────────────────────────────────
  function showAlert(html, type) {
    var old = document.getElementById('g-alert');
    if (old) old.remove();
    var el = document.createElement('div');
    el.id = 'g-alert';
    el.className = 'g-alert ' + type;
    el.innerHTML = html;

    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ── 수락 처리 ─────────────────────────────────────────────────────────────
  async function doAccept() {
    var btn = document.getElementById('accept-btn');
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = '처리 중...';
    try {
      var result = await supabaseClient.rpc('accept_gift', { p_code: giftCode });
      if (result.error) throw result.error;
      var data = result.data;
      if (data.ok) {
        btn.textContent = '✅ 등록 완료!';
        setTimeout(function () { window.location.href = 'my-courses.html'; }, 900);
        return;
      }
      var msg = '';
      switch (data.reason) {
        case 'email_mismatch':
          msg = '<strong>' + esc(data.masked_email || '') + '</strong> 계정으로 로그인해주세요.';
          showAlert(msg, 'warn'); break;
        case 'already_owned':
          showAlert('이미 보유한 강좌예요. 보내주신 분이 선물함에서 환불을 요청할 수 있어요.', 'warn'); break;
        case 'expired':
          showAlert('선물 유효기간이 만료되었어요.', 'err'); break;
        case 'not_available':
          showAlert('이미 사용된 선물 코드예요.', 'err'); break;
        default:
          showAlert('오류가 발생했어요: ' + esc(data.reason || '알 수 없는 오류'), 'err');
      }
      btn.disabled = false;
      btn.textContent = '내 강의실에 등록하기';
    } catch (e) {
      console.error('accept_gift 오류:', e);
      showAlert('일시적인 오류가 발생했어요. 잠시 후 다시 시도해주세요.', 'err');
      btn.disabled = false;
      btn.textContent = '내 강의실에 등록하기';
    }
  }

  // ── 선물 데이터 로드 ─────────────────────────────────────────────────────
  async function loadGift(code) {
    root.innerHTML = '<div class="gift-spinner-dark"></div>';
    try {
      // 선물 정보와 로그인 상태 동시 조회
      var [giftResult, authResult] = await Promise.all([
        supabaseClient.rpc('get_gift_by_code', { p_code: code }),
        supabaseClient.auth.getUser(),
      ]);

      if (giftResult.error) throw giftResult.error;
      if (!giftResult.data || giftResult.data.length === 0) {
        showStatus('🔍', '선물 코드를 찾을 수 없어요', '코드를 다시 확인해주세요.');
        return;
      }

      var gift = giftResult.data[0];
      // get_gift_by_code 는 gift_code 를 반환하지 않으므로 URL의 코드를 넣어둠
      gift.gift_code = code;

      window._giftUser = authResult.data ? authResult.data.user : null;
      _gift = gift;

      // 만료 또는 비정상 상태 처리
      if (gift.is_expired || gift.status === 'expired') {
        showStatus('⏰', '만료된 선물이에요', '선물 유효기간이 지났습니다.');
        return;
      }
      if (gift.status === 'accepted') {
        showStatus('✅', '이미 사용된 선물이에요', '이 선물 코드는 이미 사용되었습니다.');
        return;
      }
      if (gift.status === 'already_owned') {
        showStatus('📚', '수신자가 이미 보유한 강좌였어요', '보내신 분이 환불을 요청할 수 있어요.');
        return;
      }
      if (gift.status === 'cancelled' || gift.status === 'refunded') {
        showStatus('🚫', '취소된 선물이에요', '보내신 분이 선물을 취소했습니다.');
        return;
      }
      if (gift.status !== 'pending') {
        showStatus('⚠️', '사용할 수 없는 선물이에요', '상태: ' + gift.status);
        return;
      }

      // 정상: 봉투 화면 표시
      showEnvelope(gift);

    } catch (e) {
      console.error('loadGift 오류:', e);
      showStatus('⚠️', '선물 정보를 불러오지 못했어요', '잠시 후 다시 시도해주세요.');
    }
  }

  // ── 쿠폰 선물 ─────────────────────────────────────────────────────────────
  async function loadCoupon(code) {
    try {
      // 로그인 여부를 먼저 알아야 "로그인하고 받기" 와 "쿠폰함에 담기" 를 가른다
      var authResult = await supabaseClient.auth.getUser();
      window._giftUser = authResult.data ? authResult.data.user : null;

      var res = await supabaseClient.rpc('lookup_coupon', { p_code: code });
      var c = (res.data && res.data.length) ? res.data[0] : null;
      if (res.error || !c) {
        showStatus('🎟️', '쿠폰을 찾지 못했어요', '코드가 맞는지 확인해 주세요.');
        return;
      }
      if (c.expires_at && new Date(c.expires_at) < new Date()) {
        showStatus('⌛', '사용 기간이 지난 쿠폰이에요', '보내신 분에게 문의해 주세요.');
        return;
      }
      if (c.max_uses != null && c.used_count >= c.max_uses) {
        showStatus('🎟️', '모두 사용된 쿠폰이에요', '아쉽지만 남은 수량이 없어요.');
        return;
      }
      // 강의 전용 쿠폰이면 그 강의 그림을 함께 보여준다
      if (c.course_id != null) {
        var cr = await supabaseClient.from('courses')
          .select('thumbnail_url').eq('id', c.course_id).maybeSingle();
        if (cr.data) c.thumbnail_url = cr.data.thumbnail_url;
      }
      couponMode = true;
      couponData = c;

      // 로그인하고 돌아온 길이면 봉투를 다시 열게 하지 않는다.
      // 이미 한 번 열어 본 사람이라 두 번 여는 것은 군더더기다.
      if (autoClaim && window._giftUser) {
        showCouponVoucher(c, false);
        doRedeem();
        return;
      }
      showEnvelope({ sender_name: null, message: null });
    } catch (e) {
      console.error('loadCoupon 오류:', e);
      showStatus('⚠️', '쿠폰 정보를 불러오지 못했어요', '잠시 후 다시 시도해주세요.');
    }
  }

  function couponDiscountText(c) {
    return c.discount_type === 'rate'
      ? Math.round(Number(c.discount_value)) + '% 할인'
      : '₩' + Number(c.discount_value).toLocaleString('ko-KR') + ' 할인';
  }

  function showCouponVoucher(c, fade) {
    var thumbHtml = c.thumbnail_url ? '<img src="' + esc(c.thumbnail_url) + '" alt="">' : '🎟️';
    var expiryStr = c.expires_at
      ? '~' + new Date(c.expires_at).toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }) + '까지'
      : '사용 기한 없음';
    var scope = c.course_id != null && c.course_title
      ? esc(c.course_title) + ' 전용'
      : '모든 강의에 사용 가능';

    var actionHtml;
    if (!window._giftUser) {
      var nextUrl = 'gift.html?coupon=' + encodeURIComponent(c.code) + '&claim=1';
      actionHtml = '<a href="login.html?next=' + encodeURIComponent(nextUrl) + '" class="gift-action-btn gold" style="display:block;text-decoration:none;text-align:center;">로그인하고 받기</a>';
    } else {
      actionHtml = '<button class="gift-action-btn gold" id="redeem-btn">내 쿠폰함에 담기</button>';
    }

    root.innerHTML = [
      '<div class="gift-voucher' + (fade ? ' gift-rising' : '') + '" id="screen-b">',
      '  <div class="gift-voucher-head">',
      '    <div class="gv-seal">',
      '      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">',
      '        <path d="M3 8.2a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.4a2.4 2.4 0 0 0 0 4.8v1.4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.4a2.4 2.4 0 0 0 0-4.8V8.2Z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>',
      '        <path d="M14.5 6.2v11.6" stroke="#fff" stroke-width="1.7" stroke-dasharray="2 2.4"/>',
      '      </svg>',
      '    </div>',
      '    <div class="gift-voucher-label">COUPON</div>',
      '    <div class="gv-from">쿠폰이 도착했어요</div>',
      '  </div>',
      '  <div class="gift-ribbon">',
      '    <div class="gift-ribbon-thumb">' + thumbHtml + '</div>',
      '    <div class="gift-ribbon-title">' + esc(couponDiscountText(c)) + '</div>',
      '    <div class="gift-coupon-scope">' + scope + '</div>',
      '  </div>',
      '  <div class="gift-code-row">',
      '    <span class="gift-code-label">쿠폰 코드</span>',
      '    <span class="gift-code-val">' + esc(c.code) + '</span>',
      '  </div>',
      '  <div class="gift-action-col">',
      '    <div class="gift-pocket-note">' + esc(expiryStr) + '</div>',
      actionHtml,
      '  </div>',
      '</div>',
    ].join('');

    var btn = document.getElementById('redeem-btn');
    if (btn) btn.addEventListener('click', doRedeem);
  }

  async function doRedeem() {
    var btn = document.getElementById('redeem-btn');
    btn.disabled = true;
    btn.textContent = '담는 중...';
    try {
      var res = await supabaseClient.rpc('redeem_coupon', { p_code: couponData.code });
      var r = res.data || {};
      if (res.error || !r.ok) {
        // 이미 갖고 있는 경우는 실패가 아니다. 쿠폰함으로 보내 준다.
        var already = r.reason === 'already_have';
        showAlert(esc(r.message || '쿠폰을 담지 못했어요.'), already ? 'ok' : 'err');
        btn.textContent = already ? '내 쿠폰함 열기' : '다시 시도';
        btn.disabled = false;
        if (already) btn.onclick = function () { location.href = 'my-courses.html#coupons'; };
        return;
      }
      showAlert('쿠폰이 쿠폰함에 담겼어요.', 'ok');
      btn.textContent = '내 쿠폰함 열기';
      btn.disabled = false;
      btn.onclick = function () { location.href = 'my-courses.html#coupons'; };
    } catch (e) {
      showAlert('쿠폰을 담지 못했어요. 잠시 후 다시 시도해 주세요.', 'err');
      btn.disabled = false;
      btn.textContent = '다시 시도';
    }
  }

  // ── 진입점 ───────────────────────────────────────────────────────────────
  if (couponCodeParam) {
    loadCoupon(couponCodeParam);
  } else if (giftCode) {
    loadGift(giftCode);
  } else {
    showCodeInput();
  }
})();
</script>
</body>
</html>
