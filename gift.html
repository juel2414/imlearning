<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선물 받기 — 아이엠러닝</title>
<link rel="stylesheet" href="css/style.css">
<style>
.gift-page-wrap {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1rem;
  background: #080f0b;
}
.gift-card-outer { width: 100%; max-width: 400px; }

/* ── 로딩 스피너 ── */
.gift-spinner-dark {
  width: 36px; height: 36px;
  border: 2.5px solid #1c2f26;
  border-top-color: #c9a252;
  border-radius: 50%;
  animation: gSpin .8s linear infinite;
  margin: 4rem auto;
}
@keyframes gSpin { to { transform: rotate(360deg); } }

/* ── 공통 카드 ── */
.g-dark-card {
  background: #0f1a15;
  border: 0.5px solid #24382e;
  border-radius: 16px;
  padding: 36px 24px;
  text-align: center;
}

/* ── 화면 A: 봉투 ── */
.gift-env-icon {
  width: 56px; height: 56px;
  background: #1c2f26;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  font-size: 26px;
}
.gift-env-label {
  font-size: 10px; letter-spacing: 2px; color: #8fae9c;
  margin-bottom: 12px; text-transform: uppercase;
}
.gift-env-title {
  font-size: 16px; font-weight: 700; color: #f0f3f1;
  line-height: 1.55; margin-bottom: 20px;
}
.gift-env-msg {
  background: #16241d; border-radius: 10px;
  padding: 14px 18px; font-size: 13px; color: #c8d8cc;
  line-height: 1.7; text-align: left;
  margin-bottom: 20px; font-style: italic;
}
.gift-env-btn {
  width: 100%; padding: 14px;
  background: #c9a252; color: #1c1406;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: opacity .15s;
}
.gift-env-btn:hover { opacity: .9; }

/* ── 화면 B: 교환권 카드 ── */
.gift-voucher {
  background: #12211b; border: 0.5px solid #2a4438;
  border-radius: 16px; padding: 24px 20px 20px;
}
.gift-voucher-label {
  text-align: center; font-size: 10px; letter-spacing: 2px;
  color: #8fae9c; margin-bottom: 16px; text-transform: uppercase;
}
.gift-ribbon {
  background: linear-gradient(180deg, #e9d18f 0%, #c9a252 50%, #e9d18f 100%);
  border-radius: 10px; padding: 14px;
  display: flex; align-items: center; gap: 14px;
}
.gift-ribbon-thumb {
  width: 60px; height: 60px; border-radius: 8px;
  object-fit: cover; flex-shrink: 0;
  background: #3d5648;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; overflow: hidden;
}
.gift-ribbon-thumb img {
  width: 60px; height: 60px; border-radius: 8px; object-fit: cover;
}
.gift-ribbon-title {
  font-size: 14px; font-weight: 500; color: #2c2107;
  line-height: 1.4; min-width: 0;
}
.gift-code-row {
  margin-top: 16px; padding-top: 14px;
  border-top: 0.5px solid #2a4438;
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.gift-code-val {
  font-family: monospace; font-size: 15px;
  letter-spacing: 1px; color: #e9d18f;
}
.gift-expiry { font-size: 11px; color: #6d8a78; flex-shrink: 0; }
.gift-action-col { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.gift-action-btn {
  width: 100%; padding: 12px; font-size: 14px;
  border-radius: 8px; cursor: pointer; font-family: inherit;
  background: transparent; border: 0.5px solid #4a6656; color: #e7ece8;
}
.gift-action-btn.gold {
  background: #c9a252; border: none;
  color: #1c1406; font-weight: 700;
}

/* ── 코드 입력 ── */
.gift-code-input-wrap {
  background: #0f1a15; border: 0.5px solid #24382e;
  border-radius: 16px; padding: 36px 24px; text-align: center;
}
.gift-code-input-wrap .gift-env-label { margin-bottom: 16px; }
.gift-code-input-row { display: flex; gap: 8px; margin-top: 4px; }
.gift-code-input {
  flex: 1; min-width: 0;
  padding: 12px 14px;
  background: #16241d; border: 0.5px solid #2a4438;
  border-radius: 10px; color: #e9d18f;
  font-size: 15px; font-family: monospace; letter-spacing: 1px;
  text-transform: uppercase; outline: none;
}
.gift-code-input:focus { border-color: #c9a252; }
.gift-code-input::placeholder { color: #3d5040; }
.gift-code-go {
  padding: 12px 18px; background: #c9a252; color: #1c1406;
  border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  white-space: nowrap;
}

/* ── 알림 메시지 ── */
.g-alert {
  margin-top: 12px; padding: 10px 14px; border-radius: 8px;
  font-size: 13px; line-height: 1.6;
}
.g-alert.err { background: rgba(239,68,68,.12); color: #fca5a5; border: 0.5px solid rgba(239,68,68,.25); }
.g-alert.warn { background: rgba(249,168,37,.08); color: #fcd34d; border: 0.5px solid rgba(249,168,37,.2); }

@media (max-width: 480px) {
  .g-dark-card, .gift-voucher, .gift-code-input-wrap { padding: 28px 18px 24px; }
}
</style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="navbar-logo">
      <img src="images/logo-horizontal.png" alt="아이엠러닝" style="height:38px;width:auto;display:block;">
    </a>
  </div>
</nav>

<div class="gift-page-wrap">
  <div class="gift-card-outer" id="gift-root">
    <div class="gift-spinner-dark"></div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-inner">
      <div>
        <img src="images/logo-horizontal.png" alt="아이엠러닝" style="height:32px;width:auto;display:block;margin-bottom:8px;">
        <div class="footer-slogan">I'M Learning, I'M Running!</div>
        <div class="footer-info">상호: IMlearning 아이엠러닝 · 대표자: 이수열 · 전화: 010-5307-6139</div>
      </div>
      <div class="footer-col"><div class="footer-col-title">강좌</div><a href="courses.html?cat=faith">신앙</a><a href="courses.html?cat=edu">교사·부모</a><a href="courses.html?cat=english">영어·시험</a></div>
      <div class="footer-col"><div class="footer-col-title">서비스</div><a href="contact.html">문의하기</a><a href="reviews.html">수강생 후기</a></div>
    </div>
    <div class="footer-bottom"><span>© 2026 아이엠러닝(IMlearning) All Rights Reserved.</span></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var giftCode = (params.get('code') || '').trim().toUpperCase();
  var root = document.getElementById('gift-root');
  var _gift = null; // 로드된 선물 데이터 저장

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── 코드 입력 화면 ────────────────────────────────────────────────────────
  function showCodeInput() {
    root.innerHTML = [
      '<div class="gift-code-input-wrap">',
      '  <div class="gift-env-label">IMLEARNING GIFT</div>',
      '  <p style="color:#f0f3f1;font-size:16px;font-weight:700;margin:0 0 4px;">선물 코드를 입력해주세요</p>',
      '  <p style="color:#8fae9c;font-size:13px;margin:0 0 16px;">받으신 선물 코드를 아래에 입력해주세요.</p>',
      '  <div class="gift-code-input-row">',
      '    <input class="gift-code-input" id="code-input" type="text" placeholder="IMGIFT-XXXXXXXX" maxlength="30" autocomplete="off">',
      '    <button class="gift-code-go" id="code-go">확인</button>',
      '  </div>',
      '</div>',
    ].join('');

    var input = document.getElementById('code-input');
    var btn = document.getElementById('code-go');
    function go() {
      var val = input.value.trim().toUpperCase();
      if (!val) { input.focus(); return; }
      history.replaceState(null, '', 'gift.html?code=' + encodeURIComponent(val));
      giftCode = val;
      loadGift(val);
    }
    btn.addEventListener('click', go);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    input.focus();
  }

  // ── 상태 안내 화면 ────────────────────────────────────────────────────────
  function showStatus(icon, title, desc) {
    root.innerHTML = [
      '<div class="g-dark-card">',
      '  <div class="gift-env-label">IMLEARNING GIFT</div>',
      '  <div style="font-size:36px;margin-bottom:12px;">' + icon + '</div>',
      '  <p style="color:#f0f3f1;font-size:16px;font-weight:700;margin:0 0 8px;">' + esc(title) + '</p>',
      '  <p style="color:#8fae9c;font-size:13px;margin:0 0 20px;">' + esc(desc) + '</p>',
      '  <a href="gift.html" style="display:inline-block;padding:10px 24px;border:0.5px solid #4a6656;border-radius:8px;color:#e7ece8;font-size:13px;text-decoration:none;">다시 시도</a>',
      '</div>',
    ].join('');
  }

  // ── 화면 A: 봉투 ─────────────────────────────────────────────────────────
  function showEnvelope(gift) {
    var senderLine = gift.sender_name
      ? esc(gift.sender_name) + '님이 마음을 담아 선물을 보냈어요'
      : '누군가 마음을 담아 선물을 보냈어요';
    var msgBlock = gift.message
      ? '<div class="gift-env-msg">' + esc(gift.message).replace(/\n/g, '<br>') + '</div>'
      : '';

    root.innerHTML = [
      '<div class="g-dark-card" id="screen-a">',
      '  <div class="gift-env-icon">✉️</div>',
      '  <div class="gift-env-label">IMLEARNING GIFT</div>',
      '  <p class="gift-env-title">' + senderLine + '</p>',
      msgBlock,
      '  <button class="gift-env-btn" id="open-btn">선물 열어보기</button>',
      '</div>',
    ].join('');

    document.getElementById('open-btn').addEventListener('click', function () {
      showVoucher(gift, true);
    });
  }

  // ── 화면 B: 교환권 카드 ──────────────────────────────────────────────────
  function showVoucher(gift, fade) {
    var thumbHtml = gift.thumbnail_url
      ? '<img src="' + esc(gift.thumbnail_url) + '" alt="">'
      : '📚';
    var expiryStr = gift.expires_at
      ? '~' + new Date(gift.expires_at).toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }) + '까지'
      : '발급일로부터 1년간 유효';

    var actionHtml = '';
    var isLocked = gift.is_locked;

    // 잠금 안내
    var lockNotice = isLocked
      ? '<p style="font-size:12px;color:#c9a252;margin:8px 0 0;text-align:center;"><img src="icons/lock-closed.svg" alt="" style="width:1em;height:1em;vertical-align:-0.15em;display:inline-block;"> ' + esc(gift.masked_email) + ' 계정으로 로그인해야 받을 수 있어요</p>'
      : '';

    // 비로그인 → 로그인 버튼
    // 로그인 → 등록 버튼 (doAccept 호출)
    if (!window._giftUser) {
      var nextUrl = 'gift.html?code=' + encodeURIComponent(giftCode);
      actionHtml = '<a href="login.html?next=' + encodeURIComponent(nextUrl) + '" class="gift-action-btn gold" style="display:block;text-decoration:none;text-align:center;">로그인하고 받기</a>';
    } else {
      actionHtml = '<button class="gift-action-btn gold" id="accept-btn">내 강의실에 등록하기</button>';
    }

    var html = [
      '<div class="gift-voucher" id="screen-b" style="' + (fade ? 'opacity:0;transition:opacity .3s;' : '') + '">',
      '  <div class="gift-voucher-label">GIFT VOUCHER</div>',
      '  <div class="gift-ribbon">',
      '    <div class="gift-ribbon-thumb">' + thumbHtml + '</div>',
      '    <div class="gift-ribbon-title">' + esc(gift.course_title) + '</div>',
      '  </div>',
      '  <div class="gift-code-row">',
      '    <span class="gift-code-val">' + esc(gift.gift_code || giftCode) + '</span>',
      '    <span class="gift-expiry">' + esc(expiryStr) + '</span>',
      '  </div>',
      '  <div class="gift-action-col">',
      actionHtml,
      lockNotice,
      '  </div>',
      '</div>',
    ].join('');

    root.innerHTML = html;

    if (fade) {
      requestAnimationFrame(function () {
        var el = document.getElementById('screen-b');
        if (el) el.style.opacity = '1';
      });
    }

    var acceptBtn = document.getElementById('accept-btn');
    if (acceptBtn) acceptBtn.addEventListener('click', doAccept);
  }

  // ── 알림 메시지 ──────────────────────────────────────────────────────────
  function showAlert(html, type) {
    var old = document.getElementById('g-alert');
    if (old) old.remove();
    var el = document.createElement('div');
    el.id = 'g-alert';
    el.className = 'g-alert ' + type;
    el.innerHTML = html;
    var col = root.querySelector('.gift-action-col');
    if (col) col.insertAdjacentElement('beforebegin', el);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ── 수락 처리 ─────────────────────────────────────────────────────────────
  async function doAccept() {
    var btn = document.getElementById('accept-btn');
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = '처리 중...';
    try {
      var result = await supabaseClient.rpc('accept_gift', { p_code: giftCode });
      if (result.error) throw result.error;
      var data = result.data;
      if (data.ok) {
        btn.textContent = '✅ 등록 완료!';
        setTimeout(function () { window.location.href = 'my-courses.html'; }, 900);
        return;
      }
      var msg = '';
      switch (data.reason) {
        case 'email_mismatch':
          msg = '<strong>' + esc(data.masked_email || '') + '</strong> 계정으로 로그인해주세요.';
          showAlert(msg, 'warn'); break;
        case 'already_owned':
          showAlert('이미 보유한 강좌예요. 보내주신 분이 선물함에서 환불을 요청할 수 있어요.', 'warn'); break;
        case 'expired':
          showAlert('선물 유효기간이 만료되었어요.', 'err'); break;
        case 'not_available':
          showAlert('이미 사용된 선물 코드예요.', 'err'); break;
        default:
          showAlert('오류가 발생했어요: ' + esc(data.reason || '알 수 없는 오류'), 'err');
      }
      btn.disabled = false;
      btn.textContent = '내 강의실에 등록하기';
    } catch (e) {
      console.error('accept_gift 오류:', e);
      showAlert('일시적인 오류가 발생했어요. 잠시 후 다시 시도해주세요.', 'err');
      btn.disabled = false;
      btn.textContent = '내 강의실에 등록하기';
    }
  }

  // ── 선물 데이터 로드 ─────────────────────────────────────────────────────
  async function loadGift(code) {
    root.innerHTML = '<div class="gift-spinner-dark"></div>';
    try {
      // 선물 정보와 로그인 상태 동시 조회
      var [giftResult, authResult] = await Promise.all([
        supabaseClient.rpc('get_gift_by_code', { p_code: code }),
        supabaseClient.auth.getUser(),
      ]);

      if (giftResult.error) throw giftResult.error;
      if (!giftResult.data || giftResult.data.length === 0) {
        showStatus('🔍', '선물 코드를 찾을 수 없어요', '코드를 다시 확인해주세요.');
        return;
      }

      var gift = giftResult.data[0];
      // get_gift_by_code 는 gift_code 를 반환하지 않으므로 URL의 코드를 넣어둠
      gift.gift_code = code;

      window._giftUser = authResult.data ? authResult.data.user : null;
      _gift = gift;

      // 만료 또는 비정상 상태 처리
      if (gift.is_expired || gift.status === 'expired') {
        showStatus('⏰', '만료된 선물이에요', '선물 유효기간이 지났습니다.');
        return;
      }
      if (gift.status === 'accepted') {
        showStatus('✅', '이미 사용된 선물이에요', '이 선물 코드는 이미 사용되었습니다.');
        return;
      }
      if (gift.status === 'already_owned') {
        showStatus('📚', '수신자가 이미 보유한 강좌였어요', '보내신 분이 환불을 요청할 수 있어요.');
        return;
      }
      if (gift.status === 'cancelled' || gift.status === 'refunded') {
        showStatus('🚫', '취소된 선물이에요', '보내신 분이 선물을 취소했습니다.');
        return;
      }
      if (gift.status !== 'pending') {
        showStatus('⚠️', '사용할 수 없는 선물이에요', '상태: ' + gift.status);
        return;
      }

      // 정상: 봉투 화면 표시
      showEnvelope(gift);

    } catch (e) {
      console.error('loadGift 오류:', e);
      showStatus('⚠️', '선물 정보를 불러오지 못했어요', '잠시 후 다시 시도해주세요.');
    }
  }

  // ── 진입점 ───────────────────────────────────────────────────────────────
  if (giftCode) {
    loadGift(giftCode);
  } else {
    showCodeInput();
  }
})();
</script>
</body>
