<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 완료 — 아이엠러닝</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif !important; }
body * { font-family: inherit; }

/* ── 럭셔리 배경 (pass.html 동일) ── */
.success-wrap {
  position: relative;
  min-height: 100svh;
  background: #04100A;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 1rem 60px;
  overflow: hidden;
}

/* 오로라 */
.aurora {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.aurora::before {
  content: '';
  position: absolute;
  width: 140%; height: 140%;
  top: -20%; left: -20%;
  background:
    radial-gradient(ellipse 55% 45% at 30% 40%, rgba(45,155,111,.28) 0%, transparent 60%),
    radial-gradient(ellipse 40% 50% at 75% 65%, rgba(26,90,55,.22) 0%, transparent 55%),
    radial-gradient(ellipse 30% 35% at 55% 15%, rgba(201,168,76,.06) 0%, transparent 50%);
  animation: aurora-shift 12s ease-in-out infinite alternate;
}
.aurora::after {
  content: '';
  position: absolute;
  width: 120%; height: 120%;
  top: -10%; left: -10%;
  background:
    radial-gradient(ellipse 45% 40% at 70% 30%, rgba(45,155,111,.15) 0%, transparent 55%),
    radial-gradient(ellipse 35% 45% at 20% 70%, rgba(26,122,74,.12) 0%, transparent 50%);
  animation: aurora-shift 18s ease-in-out infinite alternate-reverse;
}
@keyframes aurora-shift {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(3%,2%) scale(1.04); }
  100% { transform: translate(-2%,4%) scale(.97); }
}

/* 격자 패턴 */
.grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
  pointer-events: none;
}

/* ── 카드 ── */
.success-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  background: linear-gradient(145deg, #0D1F16 0%, #071510 60%, #0A1A0F 100%);
  border: 1px solid rgba(201,168,76,.25);
  border-radius: 28px;
  padding: 48px 40px 40px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 40px 80px rgba(0,0,0,.7),
    0 0 80px rgba(201,168,76,.06);
  text-align: center;
  animation: card-in .6s cubic-bezier(.2,1,.3,1) both;
}
@keyframes card-in {
  from { transform: translateY(28px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

/* 카드 상단 골드 라인 */
.success-card::before {
  content: '';
  position: absolute;
  top: 0; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,.7), transparent);
}
/* 배경 장식 원 */
.success-card::after {
  content: '';
  position: absolute;
  width: 320px; height: 320px;
  border-radius: 50%;
  border: 1px solid rgba(201,168,76,.04);
  bottom: -100px; right: -100px;
  pointer-events: none;
}

/* ── 아이콘 ── */
.success-icon-wrap {
  position: relative;
  width: 88px; height: 88px;
  margin: 0 auto 28px;
}
.success-icon-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(201,168,76,.3);
  animation: ring-pulse 2.5s ease-in-out infinite;
}
.success-icon-ring2 {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(201,168,76,.12);
  animation: ring-pulse 2.5s ease-in-out .5s infinite;
}
@keyframes ring-pulse {
  0%, 100% { opacity: .8; transform: scale(1); }
  50%       { opacity: .3; transform: scale(1.07); }
}
.success-icon-inner {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(201,168,76,.18), rgba(201,168,76,.06));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  animation: icon-pop .6s .15s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes icon-pop {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
/* 골드 체크 SVG */
.success-check-svg {
  width: 36px; height: 36px;
}

/* ── 배지 ── */
.success-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
}
.success-badge-line {
  width: 24px; height: 1px;
  background: linear-gradient(90deg, transparent, #C9A84C);
}
.success-badge-line.r {
  background: linear-gradient(90deg, #C9A84C, transparent);
}
.success-badge-text {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #C9A84C;
}

/* ── 제목 ── */
.success-title {
  font-size: 28px;
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: -0.5px;
  color: #fff;
  margin-bottom: 10px;
}
.success-title .gold-text {
  background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 35%, #B38728 65%, #FBF5B7 80%, #AA771C 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.success-sub {
  font-size: 14px;
  color: rgba(255,255,255,.38);
  line-height: 1.7;
  margin-bottom: 32px;
  letter-spacing: .01em;
}

/* ── 강좌 썸네일 ── */
.course-thumb-sm {
  width: 52px; height: 52px;
  border-radius: 12px;
  border: 1px solid rgba(201,168,76,.2);
  background: rgba(201,168,76,.06);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 24px;
  overflow: hidden;
  position: relative;
}
.course-thumb-sm img {
  position: absolute;
  inset: 0; width: 100%; height: 100%;
  object-fit: cover;
}

/* ── 영수증 ── */
.success-receipt {
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 16px;
  padding: 20px 22px;
  margin-bottom: 28px;
  text-align: left;
}
.receipt-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  font-size: 13px;
}
.receipt-row:not(:last-child) {
  border-bottom: 1px solid rgba(255,255,255,.05);
}
.receipt-row .label {
  color: rgba(255,255,255,.35);
  font-weight: 500;
}
.receipt-row .value {
  font-weight: 700;
  color: rgba(255,255,255,.85);
  max-width: 230px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: right;
}
.receipt-row.total .label { color: rgba(201,168,76,.6); font-weight: 700; }
.receipt-row.total .value {
  font-size: 20px;
  background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 40%, #C9A84C 70%, #FBF5B7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── 버튼 ── */
.success-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn-gold {
  display: block;
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: -.2px;
  text-decoration: none;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: transform .15s, box-shadow .15s;
  background: linear-gradient(135deg, #BF953F, #C9A84C 40%, #AA771C);
  color: #07150D;
  box-shadow: 0 8px 24px rgba(201,168,76,.3), 0 0 0 1px rgba(201,168,76,.4) inset;
}
.btn-gold::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
  animation: shimmer 3s ease-in-out infinite;
}
@keyframes shimmer {
  0%   { left: -100%; }
  50%  { left: 150%; }
  100% { left: 150%; }
}
.btn-gold:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(201,168,76,.4), 0 0 0 1px rgba(201,168,76,.5) inset; }

.btn-ghost-gold {
  display: block;
  width: 100%;
  padding: 14px;
  border: 1px solid rgba(201,168,76,.3);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  color: rgba(201,168,76,.8);
  background: transparent;
  transition: border-color .15s, color .15s, background .15s;
}
.btn-ghost-gold:hover {
  border-color: rgba(201,168,76,.6);
  color: #C9A84C;
  background: rgba(201,168,76,.05);
}

/* ── 하단 문구 ── */
.success-footer-note {
  margin-top: 24px;
  font-size: 11px;
  color: rgba(255,255,255,.18);
  letter-spacing: .04em;
}

@media (max-width: 480px) {
  .success-card { padding: 36px 24px 28px; }
  .success-title { font-size: 24px; }
}
</style>
</head>
<body>
<nav class="navbar" style="background:rgba(4,16,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,.1);">
  <div class="navbar-inner">
    <a href="index.html" class="navbar-logo">
      <span class="navbar-logo-text" style="color:#fff;">아이엠<span style="color:#C9A84C;">러닝</span></span>
    </a>
    <ul class="navbar-menu" style="--menu-color:rgba(255,255,255,.6);">
      <li><a href="courses.html" style="color:rgba(255,255,255,.6);">강좌</a></li>
      <li><a href="https://imbooks.kr" target="_blank" rel="noopener" style="color:rgba(255,255,255,.6);">교재 (아이엠북스)</a></li>
    </ul>
    <div class="navbar-right">
      <a href="login.html" class="btn btn-outline btn-sm" style="border-color:rgba(201,168,76,.4);color:#C9A84C;">로그인</a>
    </div>
  </div>
</nav>

<div class="success-wrap">
  <div class="aurora"></div>
  <div class="grid-bg"></div>

  <div class="success-card">
    <!-- 체크 아이콘 -->
    <div class="success-icon-wrap">
      <div class="success-icon-ring2"></div>
      <div class="success-icon-ring"></div>
      <div class="success-icon-inner">
        <svg class="success-check-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="16" stroke="url(#goldRing)" stroke-width="1.5"/>
          <polyline points="10,18 15.5,24 26,12" stroke="url(#goldCheck)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="28" stroke-dashoffset="28">
            <animate attributeName="stroke-dashoffset" from="28" to="0" dur=".5s" begin=".3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
          </polyline>
          <defs>
            <linearGradient id="goldRing" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#BF953F"/>
              <stop offset="50%" stop-color="#FCF6BA"/>
              <stop offset="100%" stop-color="#AA771C"/>
            </linearGradient>
            <linearGradient id="goldCheck" x1="10" y1="18" x2="26" y2="18" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#C9A84C"/>
              <stop offset="100%" stop-color="#FCF6BA"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>

    <!-- 배지 -->
    <div class="success-badge">
      <div class="success-badge-line"></div>
      <span class="success-badge-text">결제 완료</span>
      <div class="success-badge-line r"></div>
    </div>

    <!-- 제목 -->
    <h1 class="success-title">수강 신청이<br><span class="gold-text">완료되었어요!</span></h1>
    <p class="success-sub">결제가 정상적으로 처리되었습니다.<br>지금 바로 강의를 시작해보세요.</p>

    <!-- 강좌 썸네일 -->
    <div class="course-thumb-sm" id="course-thumb">
      <img src="icons/faith.svg" alt="" style="width:1.2em;height:1.2em;opacity:.6;filter:invert(1);">
    </div>

    <!-- 영수증 -->
    <div class="success-receipt">
      <div class="receipt-row">
        <span class="label">강좌명</span>
        <span class="value" id="receipt-course">불러오는 중...</span>
      </div>
      <div class="receipt-row">
        <span class="label">수강 기간</span>
        <span class="value">무제한</span>
      </div>
      <div class="receipt-row">
        <span class="label">결제일시</span>
        <span class="value" id="receipt-date">-</span>
      </div>
      <div class="receipt-row total">
        <span class="label">결제 금액</span>
        <span class="value" id="receipt-amount">₩0</span>
      </div>
    </div>

    <!-- CTA 버튼 -->
    <div class="success-btns">
      <a href="#" class="btn-gold" id="btn-start">나의 강의실로 이동</a>
      <a href="my-courses.html" class="btn-ghost-gold">나의 강의실 보기</a>
    </div>

    <div class="success-footer-note">아이엠러닝 · I'M Learning, I'M Running!</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>

<script>
(function () {
  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const params = new URLSearchParams(window.location.search);
  const courseId   = params.get('courseId');
  const amount     = Number(params.get('amount') || 0);
  const courseName = params.get('courseName') || '';

  // 결제일시
  const now = new Date();
  document.getElementById('receipt-date').textContent =
    now.getFullYear() + '.' +
    String(now.getMonth() + 1).padStart(2, '0') + '.' +
    String(now.getDate()).padStart(2, '0') + ' ' +
    String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0');

  // 금액
  document.getElementById('receipt-amount').textContent = '₩' + amount.toLocaleString();

  // 강의 시작 버튼
  const btnStart = document.getElementById('btn-start');
  if (courseId) {
    btnStart.href = 'course-detail.html?id=' + courseId;
    btnStart.textContent = '▶ 강의 시작하기';
  } else {
    btnStart.href = 'my-courses.html';
    btnStart.textContent = '나의 강의실로 이동';
  }

  // 강좌명 + 썸네일 로드
  if (courseName) {
    document.getElementById('receipt-course').textContent = decodeURIComponent(courseName);
  }

  if (courseId) {
    fetchCourseById(courseId).then(course => {
      if (!course) return;
      document.getElementById('receipt-course').textContent = course.title;
      if (course.thumbnail_url) {
        const thumbEl = document.getElementById('course-thumb');
        thumbEl.innerHTML = `<img src="${esc(course.thumbnail_url)}" alt="">`;
      }
    });
  }

  // 비로그인 상태면 로그인 페이지로 + 결제 영수증 이메일 발송
  supabaseClient.auth.getUser().then(({ data: { user } }) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    if (courseId) {
      supabaseClient.from('orders')
        .select('amount, course_name')
        .eq('user_id', user.id)
        .eq('course_id', courseId)
        .eq('status', 'paid')
        .order('created_at', { ascending: false })
        .limit(1)
        .single()
        .then(({ data: order }) => {
          const realAmount = order?.amount ?? amount;
          const displayName = order?.course_name || decodeURIComponent(courseName || '강좌');
          document.getElementById('receipt-amount').textContent = '₩' + realAmount.toLocaleString();
          sendEmail('payment', { courseName: displayName, amount: realAmount });
        });
    } else {
      supabaseClient.from('orders')
        .select('amount, course_name')
        .eq('user_id', user.id)
        .is('course_id', null)
        .eq('status', 'paid')
        .order('created_at', { ascending: false })
        .limit(1)
        .single()
        .then(({ data: order }) => {
          const realAmount = order?.amount ?? amount;
          const displayName = order?.course_name || decodeURIComponent(courseName || '강좌');
          document.getElementById('receipt-course').textContent = displayName;
          document.getElementById('receipt-amount').textContent = '₩' + realAmount.toLocaleString();
          sendEmail('payment', { courseName: displayName, amount: realAmount });
        });
    }
  });
})();
</script>
</body>
</html>
