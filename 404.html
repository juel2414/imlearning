<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 없는 주소로 들어오면 브라우저 주소는 그대로라 상대 경로가 어긋난다.
       base 를 뿌리로 잡아 두면 nav.js 가 쓰는 경로까지 한 번에 맞는다. -->
  <base href="/">
  <title>페이지를 찾을 수 없습니다 — 아이엠러닝</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nf-wrap {
      min-height: calc(100vh - 64px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 4rem 1.5rem;
      position: relative; overflow: hidden;
      background: var(--gray-100);
    }
    .nf-inner { position: relative; z-index: 3; max-width: 520px; }
    .nf-art { width: 220px; margin: 0 auto 20px; color: var(--gray-300); }
    .nf-art svg { width: 100%; height: auto; display: block; }
    .nf-code {
      font-size: 14px; font-weight: 700; letter-spacing: .16em;
      color: var(--green); margin-bottom: 10px;
    }
    .nf-title { font-size: 26px; font-weight: 800; color: var(--gray-900); margin-bottom: 10px; }
    .nf-desc { font-size: 15px; color: var(--gray-500); line-height: 1.8; }
    .nf-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    @media (max-width: 768px) {
      .nf-art { width: 168px; }
      .nf-title { font-size: 21px; }
    }
  </style>
</head>
<body>

<div class="nf-wrap">
  <div class="nf-inner">
    <!-- 시즌 테마가 켜지면 이 자리에 계절 그림이 들어간다 -->
    <div class="nf-art" id="nf-art" aria-hidden="true">
      <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="60" r="44" fill="none" stroke="currentColor" stroke-width="4"/>
        <path d="M76 48 L88 60 M88 48 L76 60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M112 48 L124 60 M124 48 L112 60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M84 82 C 92 74, 108 74, 116 82" stroke="currentColor" stroke-width="4"
              stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="nf-code" id="nf-code">404</div>
    <h1 class="nf-title" id="nf-title">페이지를 찾을 수 없습니다</h1>
    <p class="nf-desc" id="nf-desc">
      주소가 바뀌었거나 없는 쪽입니다.<br>아래에서 다시 찾아 주세요.
    </p>
    <div class="nf-btns">
      <a href="index.html" class="btn btn-primary">첫 화면으로</a>
      <a href="courses.html" class="btn btn-outline">강좌 둘러보기</a>
    </div>
  </div>
</div>

<script src="js/supabase-client.js?v=3"></script>
<script src="js/nav.js?v=69"></script>
</body>
</html>
