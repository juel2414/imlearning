<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자료실 — 아이엠러닝</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .res-wrap { max-width: 820px; margin: 0 auto; padding: 52px 20px 80px; }

    .res-header { margin-bottom: 26px; }
    .res-header h1 { font-size: 24px; font-weight: 800; color: var(--gray-900); margin: 0 0 6px; }
    .res-header p  { font-size: 14px; color: var(--gray-500); margin: 0; }

    /* 검색 + 분류 */
    .res-tools { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
    .res-search {
      width: 100%; padding: 11px 14px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--gray-300); border-radius: var(--radius-sm); background: var(--white);
    }
    .res-search:focus { outline: none; border-color: var(--green); }
    .res-cats { display: flex; flex-wrap: wrap; gap: 7px; }
    .res-cat {
      padding: 7px 13px; font-size: 13px; font-family: inherit; cursor: pointer;
      border: 1px solid var(--gray-300); border-radius: 999px;
      background: var(--white); color: var(--gray-700); transition: var(--transition);
    }
    .res-cat:hover  { border-color: var(--green); color: var(--green); }
    .res-cat.active { background: var(--green); border-color: var(--green); color: var(--white); font-weight: 700; }

    .res-count { font-size: 13px; color: var(--gray-500); margin-bottom: 12px; }

    /* 목록 */
    .res-list { display: flex; flex-direction: column; gap: 10px; }
    .res-item {
      background: var(--white); border: 1px solid #ECECEC; border-radius: var(--radius-md);
      overflow: hidden; transition: var(--transition);
    }
    .res-item:hover { border-color: var(--gray-300); box-shadow: var(--shadow-sm); }

    .res-head {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 16px 18px; cursor: pointer; user-select: none;
    }
    .res-main { flex: 1; min-width: 0; }
    .res-title {
      font-size: 15px; font-weight: 700; color: var(--gray-900);
      line-height: 1.5; margin-bottom: 5px; word-break: keep-all;
    }
    .res-meta { font-size: 12px; color: var(--gray-500); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .res-badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; background: var(--green-light); color: var(--green-dark);
    }
    .res-clip { font-size: 12px; color: var(--gray-500); white-space: nowrap; }
    .res-arrow { color: var(--gray-300); font-size: 13px; flex: none; margin-top: 3px; transition: var(--transition); }
    .res-item.open .res-arrow { transform: rotate(90deg); color: var(--green); }

    /* 펼친 내용 */
    .res-body { display: none; padding: 0 18px 18px; border-top: 1px solid #F0F0F0; }
    .res-item.open .res-body { display: block; }
    .res-text {
      font-size: 14px; line-height: 1.75; color: var(--gray-700);
      white-space: pre-wrap; word-break: break-word; padding: 14px 0 4px;
    }
    .res-text a { color: var(--green-dark); word-break: break-all; }

    .res-files { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .res-file {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 13px; background: var(--gray-100); border-radius: var(--radius-sm);
    }
    .res-file-ico  { font-size: 18px; flex: none; }
    .res-file-info { flex: 1; min-width: 0; }
    .res-file-name {
      font-size: 13px; font-weight: 600; color: var(--gray-900);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .res-file-size { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
    .res-dl {
      flex: none; padding: 7px 14px; font-size: 12px; font-weight: 700;
      background: var(--green); color: var(--white); border-radius: var(--radius-sm);
      text-decoration: none; transition: var(--transition);
    }
    .res-dl:hover { background: var(--green-dark); }
    .res-dl.busy { background: var(--gray-300); pointer-events: none; }

    /* 비어 있거나 권한이 없을 때 */
    .res-state {
      background: var(--white); border: 1px solid #ECECEC; border-radius: var(--radius-lg);
      padding: 48px 24px; text-align: center;
    }
    .res-state-ico {
      width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%;
      background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .res-state h2 { font-size: 16px; font-weight: 700; color: var(--gray-900); margin: 0 0 7px; }
    .res-state p  { font-size: 13.5px; color: var(--gray-500); line-height: 1.7; margin: 0; }
    .res-state .btn-line {
      display: inline-block; margin-top: 16px; padding: 10px 20px;
      background: var(--green); color: var(--white); border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 700; text-decoration: none;
    }

    @media (max-width: 560px) {
      .res-wrap { padding: 34px 16px 64px; }
      .res-head { padding: 14px 15px; }
      .res-body { padding: 0 15px 15px; }
    }
  </style>
</head>
<body>

<div class="res-wrap">
  <div class="res-header">
    <h1>📂 자료실</h1>
    <p>사역에 필요한 문서와 양식을 내려받는 곳입니다.</p>
  </div>

  <div class="res-tools" id="res-tools" hidden>
    <input type="search" class="res-search" id="res-search" placeholder="제목이나 내용으로 검색">
    <div class="res-cats" id="res-cats"></div>
  </div>

  <div class="res-count" id="res-count" hidden></div>
  <div class="res-list" id="res-list">
    <div class="res-state"><p>불러오는 중...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  var listEl   = document.getElementById('res-list');
  var toolsEl  = document.getElementById('res-tools');
  var countEl  = document.getElementById('res-count');
  var catsEl   = document.getElementById('res-cats');
  var searchEl = document.getElementById('res-search');

  var all = [], filesBy = {}, curCat = '전체', curQ = '';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function sizeText(n) {
    if (!n) return '';
    return n > 1048576 ? (n/1048576).toFixed(1) + 'MB' : Math.round(n/1024) + 'KB';
  }
  function icon(name) {
    var e = String(name||'').split('.').pop().toLowerCase();
    if (e === 'pdf') return '📄';
    if (e === 'zip') return '🗜️';
    if (e === 'hwp' || e === 'hwpx') return '🅷';
    if (/^pptx?$/.test(e)) return '📊';
    if (/^xlsx?$/.test(e)) return '📗';
    if (/^docx?$/.test(e)) return '📝';
    if (/^(jpe?g|png|gif|webp)$/.test(e)) return '🖼️';
    return '📎';
  }
  // 본문에 들어 있는 맨 주소를 눌러서 갈 수 있게 만든다
  function linkify(s) {
    return esc(s).replace(/(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function state(ico, title, desc, link) {
    listEl.innerHTML =
      '<div class="res-state">' +
        '<div class="res-state-ico">' + ico + '</div>' +
        '<h2>' + esc(title) + '</h2>' +
        '<p>' + desc + '</p>' +
        (link || '') +
      '</div>';
  }

  function render() {
    var rows = all.filter(function (r) {
      if (curCat !== '전체' && r.category !== curCat) return false;
      if (!curQ) return true;
      var hay = (r.title + ' ' + (r.body || '')).toLowerCase();
      return hay.indexOf(curQ) !== -1;
    });

    countEl.hidden = false;
    countEl.textContent = '전체 ' + all.length + '건' +
      (rows.length !== all.length ? ' 중 ' + rows.length + '건' : '');

    if (!rows.length) {
      listEl.innerHTML = '<div class="res-state"><div class="res-state-ico">🔍</div>' +
        '<h2>찾는 자료가 없습니다</h2><p>다른 낱말로 찾아보시겠어요?</p></div>';
      return;
    }

    listEl.innerHTML = rows.map(function (r) {
      var fs = filesBy[r.id] || [];
      var body =
        (r.body ? '<div class="res-text">' + linkify(r.body) + '</div>' : '') +
        (fs.length
          ? '<div class="res-files">' + fs.map(function (f) {
              return '<div class="res-file">' +
                '<span class="res-file-ico">' + icon(f.file_name) + '</span>' +
                '<div class="res-file-info">' +
                  '<div class="res-file-name">' + esc(f.file_name) + '</div>' +
                  (f.file_size ? '<div class="res-file-size">' + sizeText(f.file_size) + '</div>' : '') +
                '</div>' +
                '<a class="res-dl" href="#" data-file="' + f.id + '">받기</a>' +
              '</div>';
            }).join('') + '</div>'
          : (r.body ? '' : '<div class="res-text" style="color:var(--gray-500);">첨부된 파일이 없습니다.</div>'));

      return '<div class="res-item" data-id="' + r.id + '">' +
        '<div class="res-head">' +
          '<div class="res-main">' +
            '<div class="res-title">' + esc(r.title) + '</div>' +
            '<div class="res-meta">' +
              (r.category ? '<span class="res-badge">' + esc(r.category) + '</span>' : '') +
              (r.published_at ? '<span>' + esc(r.published_at) + '</span>' : '') +
              (r.author_name ? '<span>' + esc(r.author_name) + '</span>' : '') +
              (fs.length ? '<span class="res-clip">📎 ' + fs.length + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<span class="res-arrow">▶</span>' +
        '</div>' +
        '<div class="res-body">' + body + '</div>' +
      '</div>';
    }).join('');
  }

  // 펼치기 / 접기
  listEl.addEventListener('click', function (e) {
    var head = e.target.closest('.res-head');
    if (head) { head.parentElement.classList.toggle('open'); return; }

    var dl = e.target.closest('.res-dl');
    if (!dl) return;
    e.preventDefault();
    if (dl.classList.contains('busy')) return;

    var fid = dl.getAttribute('data-file');
    var file = null;
    Object.keys(filesBy).some(function (k) {
      return filesBy[k].some(function (f) { if (String(f.id) === fid) { file = f; return true; } });
    });
    if (!file) return;

    dl.classList.add('busy'); dl.textContent = '준비 중';
    supabaseClient.storage.from('resource-files')
      .createSignedUrl(file.file_path, 300, { download: file.file_name })
      .then(function (res) {
        dl.classList.remove('busy'); dl.textContent = '받기';
        var url = res && res.data && res.data.signedUrl;
        if (!url) { alert('파일을 여는 데 실패했습니다. 잠시 후 다시 시도해 주세요.'); return; }
        window.location.href = url;
      })
      .catch(function () {
        dl.classList.remove('busy'); dl.textContent = '받기';
        alert('파일을 여는 데 실패했습니다.');
      });
  });

  catsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.res-cat');
    if (!b) return;
    curCat = b.getAttribute('data-cat');
    [].forEach.call(catsEl.children, function (c) { c.classList.toggle('active', c === b); });
    render();
  });

  var t;
  searchEl.addEventListener('input', function () {
    clearTimeout(t);
    t = setTimeout(function () { curQ = searchEl.value.trim().toLowerCase(); render(); }, 180);
  });

  async function load() {
    var { data: { session } } = await supabaseClient.auth.getSession();

    var { data: rows, error } = await supabaseClient
      .from('resources')
      .select('id,title,body,category,access,author_name,published_at')
      .order('published_at', { ascending: false })
      .order('id', { ascending: false });

    if (error) {
      state('⚠️', '자료를 불러오지 못했습니다', '잠시 후 다시 시도해 주세요.');
      return;
    }

    // RLS 가 걸러 주므로, 결과가 비어 있으면 볼 권한이 없다는 뜻이다
    if (!rows || !rows.length) {
      if (!session) {
        state('🔒', '로그인이 필요합니다',
          '자료실은 로그인 후 이용할 수 있습니다.',
          '<a class="btn-line" href="login.html">로그인하기</a>');
      } else {
        state('🔒', '열람 권한이 없습니다',
          '자료실 자료는 사역자에게만 열려 있습니다.<br>권한이 필요하시면 관리자에게 문의해 주세요.',
          '<a class="btn-line" href="contact.html">문의하기</a>');
      }
      return;
    }

    all = rows;

    var { data: files } = await supabaseClient
      .from('resource_files')
      .select('id,resource_id,file_name,file_path,file_size,sort_order')
      .order('sort_order');
    (files || []).forEach(function (f) {
      (filesBy[f.resource_id] = filesBy[f.resource_id] || []).push(f);
    });

    var cats = ['전체'];
    all.forEach(function (r) { if (r.category && cats.indexOf(r.category) === -1) cats.push(r.category); });
    catsEl.innerHTML = cats.map(function (c, i) {
      return '<button class="res-cat' + (i === 0 ? ' active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('');
    toolsEl.hidden = false;

    render();
  }

  load();
})();
</script>

</body>
</html>
