<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이엠러닝 — 그리스도인의 성장을 위한 모든 것</title>
  <meta name="description" content="말씀, 신앙, 결혼관, 영어, 수능, 수학, 선교까지. 그리스도인의 성장에 필요한 모든 배움을 온라인에서.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ═══════════════════════════════════════════════════════════
       신규 유입자용 랜딩.
       가운데에 문장 하나, 그 둘레를 배움의 갈래들이 '생물처럼' 떠다닌다.
       배움이 딱딱한 목록이 아니라 살아 움직이는 것이라는 인상을 준다.
       바탕은 welcome.html 과 같은 짙은 초록 — 한 화면짜리 입구의 톤을 맞춘다.
       ═══════════════════════════════════════════════════════════ */

    :root {
      --mint:     #6FDCA9;   /* 어두운 바탕 위의 강조색 */
      --mint-dim: #8FE3BC;
      --brand:    #2D9B6F;
    }

    html, body { height: 100%; overflow-x: clip; }
    body {
      margin: 0;
      background: #0E2A1E;
      color: #fff;
      font-family: var(--font-body);
    }

    .lp {
      position: relative;
      height: 100dvh;                    /* 스크롤 없이 한 화면에서 끝낸다 */
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 3vh, 28px) clamp(18px, 4vw, 48px);
      isolation: isolate;
      overflow: hidden;
    }

    /* 배경 — 초록 빛무리 두 개 위에 옅은 격자 */
    .lp::before {
      content: ''; position: absolute; inset: 0; z-index: -2;
      background:
        radial-gradient(1100px 620px at 78% -10%, rgba(45,155,111,.42), transparent 62%),
        radial-gradient(760px 520px at 6% 106%, rgba(20,96,58,.55), transparent 60%),
        linear-gradient(160deg, #0E2A1E 0%, #113826 55%, #0C2318 100%);
    }
    .lp::after {
      content: ''; position: absolute; inset: 0; z-index: -1; opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px);
      background-size: 68px 68px;
      -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 28%, transparent 78%);
              mask-image: radial-gradient(circle at 50% 42%, #000 28%, transparent 78%);
    }

    /* ── 위: 로고 · 홈 ── */
    .lp-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .lp-logo { text-decoration: none; }
    .lp-logo img { height: clamp(26px, 3.4vh, 34px); width: auto; display: block; }
    .lp-home {
      text-decoration: none;
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,.62);
      display: inline-flex; align-items: center; gap: 5px;
      padding: 8px 14px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
      transition: color .18s, border-color .18s;
    }
    .lp-home:hover { color: #fff; border-color: rgba(255,255,255,.45); }

    /* ── 가운데: 문장 + 떠다니는 갈래들 ── */
    .lp-mid { position: relative; display: grid; place-items: center; }

    /* 문장은 넓게 편다. 좁히면 큰 글씨가 한 어절씩 끊겨 읽는 리듬이 깨진다.
       크리처는 좌우 가장자리에 두므로 가운데는 이만큼 내줘도 겹치지 않는다. */
    .lp-copy { position: relative; z-index: 3; text-align: center; max-width: min(88vw, 900px); }

    .lp-eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: clamp(11px, 1.5vh, 12.5px); font-weight: 700; letter-spacing: .14em;
      color: var(--mint-dim); text-transform: uppercase;
      margin-bottom: clamp(14px, 2.6vh, 24px);
    }
    .lp-eyebrow::before, .lp-eyebrow::after {
      content: ''; width: clamp(18px, 3vw, 34px); height: 1px;
      background: rgba(143,227,188,.45);
    }

    .lp-title {
      font-family: var(--font-display);
      font-size: clamp(30px, 6.2vw, 64px);
      line-height: 1.24; letter-spacing: -0.03em;
      margin: 0; color: #fff; word-break: keep-all; text-wrap: balance;
      text-shadow: 0 2px 24px rgba(0,0,0,.35);
      /* Jua 는 굵기가 하나뿐이라 font-weight 로는 더 두꺼워지지 않는다.
         글자 색과 같은 획을 덧대 살을 붙인다. em 은 색이 다르므로 currentColor. */
      -webkit-text-stroke: 0.035em currentColor;
      paint-order: stroke fill;
    }
    .lp-title em { font-style: normal; color: var(--mint); white-space: nowrap; }

    .lp-shout {
      font-family: var(--font-display);
      font-size: clamp(19px, 3.2vw, 32px);
      color: var(--mint-dim); margin: clamp(10px, 1.8vh, 18px) 0 0;
      letter-spacing: -0.02em;
      /* 제목만 두꺼워지면 두 줄이 따로 놀아서, 여기도 살짝 살을 붙인다 */
      -webkit-text-stroke: 0.02em currentColor;
      paint-order: stroke fill;
    }

    /* ── 크리처 ──────────────────────────────────────────────
       각자 다른 속도로 떠다닌다. 눈이 있어 '살아 있는 것'으로 읽힌다.
       어두운 바탕이라 면을 채우지 않고 유리처럼 비치게 두고,
       색은 테두리·눈·글자에만 얹어 여덟이 서로 싸우지 않게 한다. */
    .lp-orbit { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

    .creature {
      position: absolute;
      left: var(--x); top: var(--y);
      pointer-events: auto;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 13px 20px 12px;
      text-decoration: none;
      background: rgba(255,255,255,.055);
      border: 1.5px solid var(--c-line, rgba(255,255,255,.16));
      /* 타원에 가까우면 알약처럼 보인다. 모서리만 둥근 사각으로 두되
         네 귀를 조금씩 어긋나게 해 손으로 그린 티를 남긴다. */
      border-radius: 14px 12px 13px 15px / 13px 15px 14px 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      animation: drift var(--dur, 18s) ease-in-out var(--delay, 0s) infinite alternate;
      transition: transform .2s, box-shadow .2s, background .2s;
      will-change: transform;
    }
    .creature:hover, .creature:focus-visible {
      transform: translateY(-5px) scale(1.06) rotate(0deg);
      background: rgba(255,255,255,.11);
      box-shadow: 0 18px 40px rgba(0,0,0,.4), 0 0 0 1px var(--c-line, rgba(255,255,255,.3));
      outline: none; z-index: 5;
    }

    .cr-face { display: flex; gap: 8px; align-items: center; height: 12px; }
    .cr-face i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--c-ink, var(--mint));
      box-shadow: 0 0 10px var(--c-glow, rgba(111,220,169,.7));
      animation: blink 6s ease-in-out var(--delay, 0s) infinite;
    }
    .cr-label {
      font-family: var(--font-display);
      font-size: clamp(15px, 1.7vw, 21px);
      color: var(--c-ink, var(--mint)); letter-spacing: -0.02em; white-space: nowrap;
    }
    .cr-soon {
      position: absolute; top: -10px; right: -12px;
      font-size: 10px; font-weight: 800; letter-spacing: -0.01em;
      color: rgba(255,255,255,.62); background: rgba(14,42,30,.92);
      border: 1px solid rgba(255,255,255,.22);
      padding: 2px 8px; border-radius: 7px; white-space: nowrap;
    }
    /* 예정인 갈래는 빛을 빼서 '아직'임을 형태로도 알린다 */
    .creature.soon {
      background: rgba(255,255,255,.03);
      border-color: rgba(255,255,255,.11);
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
    }
    .creature.soon .cr-label { color: rgba(255,255,255,.5); }
    .creature.soon .cr-face i { background: rgba(255,255,255,.38); box-shadow: none; }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) rotate(var(--rot, -3deg)); }
      to   { transform: translate3d(var(--dx, 14px), var(--dy, -18px), 0) rotate(calc(var(--rot, -3deg) * -1)); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(.12); }
    }

    /* ── 아래: 버튼과 안심 문구 ── */
    .lp-bot {
      position: relative; z-index: 3;
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(9px, 1.4vh, 14px); text-align: center;
    }
    .lp-cta {
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 9px;
      padding: clamp(13px, 2vh, 17px) clamp(28px, 4.5vw, 42px);
      background: var(--brand); color: #fff;
      font-size: clamp(14.5px, 1.9vh, 16.5px); font-weight: 800; letter-spacing: -0.02em;
      border-radius: 14px; box-shadow: 0 12px 30px rgba(45,155,111,.34);
      transition: background .18s, transform .18s, box-shadow .18s;
    }
    .lp-cta:hover { background: #35B37F; transform: translateY(-2px); box-shadow: 0 16px 38px rgba(45,155,111,.46); }
    .lp-trust { font-size: clamp(11.5px, 1.5vh, 13px); color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; }
    .lp-trust b { color: rgba(255,255,255,.75); font-weight: 600; }

    /* ── 좁은 화면: 떠다니지 않고 아래에 한 줄로 모인다 ────────
       작은 화면에서 절대 배치를 유지하면 글자 위로 겹친다. */
    @media (max-width: 860px) {
      /* grid 의 place-items 로는 두 덩이가 각자 제 칸 가운데로 흩어져
         문장과 갈래 사이가 크게 벌어진다. 세로로 붙여 쌓는다. */
      .lp-mid { display: flex; flex-direction: column; justify-content: center; }
      .lp-orbit {
        position: static; display: flex; flex-wrap: wrap;
        justify-content: center; gap: 9px;
        margin-top: clamp(20px, 3.5vh, 32px); max-width: 460px;
      }
      .creature {
        position: static; flex-direction: row; gap: 8px;
        padding: 9px 14px; animation: bob var(--dur, 5s) ease-in-out var(--delay, 0s) infinite alternate;
      }
      .cr-face { height: auto; gap: 5px; }
      .cr-face i { width: 5px; height: 5px; }
      .cr-soon { position: static; margin-left: 2px; }
      @keyframes bob {
        from { transform: translateY(0); }
        to   { transform: translateY(-5px); }
      }
    }
    @media (max-height: 620px) and (min-width: 861px) {
      .lp-eyebrow { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .creature, .cr-face i { animation: none; }
      .creature, .lp-cta, .lp-home { transition: none; }
      .creature:hover, .lp-cta:hover { transform: none; }
    }
  </style>
</head>
<body>

  <div class="lp">

    <div class="lp-top">
      <a href="index.html" class="lp-logo" aria-label="아이엠러닝 홈">
        <img src="images/logo-horizontal-white.png" alt="아이엠러닝"
             onerror="this.src='images/logo-horizontal.png';this.style.filter='brightness(0) invert(1)';">
      </a>
      <a href="index.html" class="lp-home">바로 홈으로 →</a>
    </div>

    <div class="lp-mid">

      <div class="lp-copy">
        <div class="lp-eyebrow">I'M Learning · I'M Running</div>
        <h1 class="lp-title">그리스도인의 성장을 위한<br><em>모든 것</em>이 여기 있다</h1>
        <p class="lp-shout">온라인으로 배우자!</p>
      </div>

      <!-- 배움의 갈래들. 각자 다른 속도·방향으로 떠다닌다. -->
      <div class="lp-orbit" aria-label="배움의 갈래">

        <a class="creature" href="courses.html?cat=faith"
           style="--x:7%;  --y:14%; --c-ink:#6FDCA9; --c-line:rgba(111,220,169,.42); --c-glow:rgba(111,220,169,.65); --dur:19s; --delay:0s;   --dx:16px;  --dy:-20px; --rot:-4deg;">
          <span class="cr-face"><i></i><i></i></span><span class="cr-label">말씀</span>
        </a>

        <a class="creature" href="courses.html?cat=faith"
           style="--x:20%; --y:63%; --c-ink:#7FB6FF; --c-line:rgba(127,182,255,.42); --c-glow:rgba(127,182,255,.6);  --dur:23s; --delay:1.4s; --dx:-18px; --dy:16px;  --rot:5deg;">
          <span class="cr-face"><i></i><i></i></span><span class="cr-label">신앙</span>
        </a>

        <a class="creature" href="search.html?q=%EA%B2%B0%ED%98%BC"
           style="--x:5%;  --y:80%; --c-ink:#FF9FBB; --c-line:rgba(255,159,187,.42); --c-glow:rgba(255,159,187,.6);  --dur:17s; --delay:.7s;  --dx:20px;  --dy:-14px; --rot:4deg;">
          <span class="cr-face"><i></i><i></i></span><span class="cr-label">결혼관</span>
        </a>

        <a class="creature" href="courses.html?cat=english"
           style="--x:84%; --y:13%; --c-ink:#B49CFF; --c-line:rgba(180,156,255,.42); --c-glow:rgba(180,156,255,.6);  --dur:21s; --delay:.3s;  --dx:-16px; --dy:20px;  --rot:6deg;">
          <span class="cr-face"><i></i><i></i></span><span class="cr-label">영어</span>
        </a>

        <a class="creature" href="courses.html?cat=exam"
           style="--x:88%; --y:44%; --c-ink:#FFC066; --c-line:rgba(255,192,102,.42); --c-glow:rgba(255,192,102,.6);  --dur:25s; --delay:2.1s; --dx:-22px; --dy:-16px; --rot:-5deg;">
          <span class="cr-face"><i></i><i></i></span><span class="cr-label">수능</span>
        </a>

        <a class="creature" href="search.html?q=%EC%88%98%ED%95%99"
           style="--x:77%; --y:76%; --c-ink:#5FD8DE; --c-line:rgba(95,216,222,.42);  --c-glow:rgba(95,216,222,.6);   --dur:16s; --delay:1s;   --dx:-14px; --dy:-22px; --rot:3deg;">
          <span class="cr-face"><i></i><i></i></span><span class="cr-label">수학</span>
        </a>

        <a class="creature" href="search.html?q=%EC%84%A0%EA%B5%90"
           style="--x:33%; --y:6%;  --c-ink:#FF9B78; --c-line:rgba(255,155,120,.42); --c-glow:rgba(255,155,120,.6);  --dur:20s; --delay:1.8s; --dx:12px;  --dy:22px;  --rot:5deg;">
          <span class="cr-face"><i></i><i></i></span><span class="cr-label">선교</span>
        </a>

        <!-- 아직 열지 않은 갈래. 빛을 빼고 '예정'을 달아 기대만 남긴다. -->
        <span class="creature soon" aria-label="부동산 — 준비 중"
              style="--x:62%; --y:88%; --dur:22s; --delay:.5s; --dx:18px; --dy:-12px; --rot:-3deg;">
          <span class="cr-face"><i></i><i></i></span><span class="cr-label">부동산</span>
          <span class="cr-soon">예정</span>
        </span>

      </div>
    </div>

    <div class="lp-bot">
      <a href="courses.html" class="lp-cta">전체 강좌 둘러보기 →</a>
      <p class="lp-trust">
        카드 등록 없이 <b>30초</b> 가입 · <b>26개 강의</b> 미리보기 · 무료 강좌 <b>5개</b>
      </p>
    </div>

  </div>

</body>
</html>
